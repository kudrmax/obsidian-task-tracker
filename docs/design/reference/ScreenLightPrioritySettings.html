<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ScreenLightPrioritySettings</title>
<style>
body{margin:0;background:#000}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; inset: 0; padding: 64px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0 0 16px; font-size: 17px; font-weight: 600; text-align: center;">Task Calendar</h1>
<span style="padding: 0 16px; font-size: 13px; color: #8E8E93;">PRIORITIES</span>
<div style="border-radius: 12px; overflow: hidden; background: #FFFFFF;">

<div style="height: 56px; box-sizing: border-box; padding: 0 10px 0 14px; border-bottom: 0.5px solid #D1D1D6; display: flex; align-items: center; gap: 12px;">
<span style="width: 56px; height: 32px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #F2F2F7; display: flex; align-items: center; font-size: 16px;">p1</span>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between;">

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #FF3B30; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #FF3B30;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #FF9500; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #FFCC00; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #34C759; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #30B0C7; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #007AFF; box-shadow: none;"></span>

</div>
<button aria-label="Delete level" style="width: 32px; height: 32px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13"></path></svg></button>
</div>

<div style="height: 56px; box-sizing: border-box; padding: 0 10px 0 14px; border-bottom: 0.5px solid #D1D1D6; display: flex; align-items: center; gap: 12px;">
<span style="width: 56px; height: 32px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: #F2F2F7; display: flex; align-items: center; font-size: 16px;">p2</span>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between;">

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #FF3B30; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #FF9500; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #FF9500;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #FFCC00; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #34C759; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #30B0C7; box-shadow: none;"></span>

<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #007AFF; box-shadow: none;"></span>

</div>
<button aria-label="Delete level" style="width: 32px; height: 32px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13"></path></svg></button>
</div>

<button style="width: 100%; height: 46px; box-sizing: border-box; padding: 0 14px; border: 0; background: transparent; color: #8A5CF5; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Add priority</button>
</div>
<span style="padding: 0 16px; font-size: 13px; line-height: 18px; color: #8E8E93;">A task whose text starts with the prefix gets its colour. Levels show in this order in the menu and on the task screen.</span>
</div>
</div>
</body>
</html>
