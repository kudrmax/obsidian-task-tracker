<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экран задачи</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{tk.bg}}; color: {{tk.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">

<div style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
<button style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: {{accent}}; font: inherit; font-size: 17px;">Cancel</button>
<button style="height: 44px; padding: 0 10px; border: 0; background: transparent; color: {{accent}}; font: inherit; font-size: 17px; font-weight: 600;">{{doneLabel}}</button>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 98px; height: 446px; display: flex; flex-direction: column; justify-content: center; gap: 20px;">
<div style="text-align: center; font-size: 28px; line-height: 34px; font-weight: 700; overflow-wrap: anywhere;">{{title}}<span style="display: inline-block; width: 3px; height: 30px; margin-left: 2px; vertical-align: -6px; border-radius: 2px; background: {{accent}};"></span></div>

<sc-if value="{{styles.segment}}" hint-placeholder-val="{{true}}">
<div style="height: 40px; box-sizing: border-box; padding: 3px; border-radius: 20px; background: #1C1C1E; display: flex; gap: 3px;">
<sc-for list="{{places}}" as="o" hint-placeholder-count="3">
<button style="flex: 1; height: 34px; border: 0; border-radius: 17px; background: {{o.bg}}; color: {{o.color}}; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;">
<sc-if value="{{o.icon}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><line x1="3.5" y1="10" x2="20.5" y2="10"></line><line x1="8" y1="3" x2="8" y2="6.5"></line><line x1="16" y1="3" x2="16" y2="6.5"></line></svg></sc-if>{{o.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{styles.pills}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: center; gap: 10px;">
<sc-for list="{{places}}" as="o" hint-placeholder-count="3">
<button style="height: 44px; padding: 0 22px; border: 0; border-radius: 22px; background: {{o.pillBg}}; color: {{o.color}}; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 7px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg>{{o.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{styles.tiles}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 10px;">
<sc-for list="{{places}}" as="o" hint-placeholder-count="3">
<button style="flex: 1; height: 78px; border: 0; border-radius: 18px; background: {{o.pillBg}}; color: {{o.color}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg><span style="font-size: 15px; font-weight: 600;">{{o.label}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{styles.circles}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: center; gap: 30px;">
<sc-for list="{{places}}" as="o" hint-placeholder-count="3">
<button style="width: 72px; border: 0; padding: 0; background: transparent; color: #E5E5EA; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 8px;"><span style="width: 62px; height: 62px; border-radius: 31px; background: {{o.pillBg}}; color: {{o.color}}; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg></span><span style="font-size: 14px; font-weight: {{o.weight}}; color: {{o.labelColor}};">{{o.label}}</span></button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{styles.accent}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: center; gap: 10px;">
<sc-for list="{{places}}" as="o" hint-placeholder-count="3">
<button style="height: 44px; padding: 0 22px; box-sizing: border-box; border: 1.5px solid {{o.accentBorder}}; border-radius: 22px; background: {{o.accentBg}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 7px;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg>{{o.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{hasTime}}" hint-placeholder-val="{{false}}">
<div style="margin-top: -8px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; color: #8E8E93; font-variant-numeric: tabular-nums;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M12 7.5V12l3 2"></path></svg>16:30–17:30</div>
</sc-if>

<sc-if value="{{showPicker}}" hint-placeholder-val="{{false}}">
<div style="box-sizing: border-box; padding: 8px 10px 10px; border-radius: 16px; background: {{tk.card}};">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 4px;">
<span style="font-size: 16px; font-weight: 600;">November 2026</span>
<div style="display: flex; gap: 4px;">
<button aria-label="Previous month" style="width: 32px; height: 32px; border: 0; padding: 0; border-radius: 16px; background: transparent; color: {{accent}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg></button>
<button aria-label="Next month" style="width: 32px; height: 32px; border: 0; padding: 0; border-radius: 16px; background: transparent; color: {{accent}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg></button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 1px;">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
<span style="height: 18px; text-align: center; font-size: 11px; font-weight: 600; color: #8E8E93;">{{w}}</span>
</sc-for>
<sc-for list="{{days}}" as="d" hint-placeholder-count="42">
<button style="justify-self: center; width: 36px; height: 36px; border: 0; padding: 0; border-radius: 18px; background: {{d.bg}}; color: {{d.color}}; font: inherit; font-size: 16px; font-weight: {{d.weight}}; font-variant-numeric: tabular-nums;">{{d.n}}</button>
</sc-for>
</div>
</div>
</sc-if>
</div>

<div style="position: absolute; left: 0; right: 0; top: 544px; height: 300px; box-sizing: border-box; padding: 8px 3px 0; background: {{tk.kbd}}; display: flex; flex-direction: column; gap: 11px;">
<sc-for list="{{letterRows}}" as="row" hint-placeholder-count="2">
<div style="display: flex; gap: 5px;">
<sc-for list="{{row}}" as="k" hint-placeholder-count="11">
<span style="flex: 1; height: 42px; border-radius: 5px; background: {{tk.key}}; color: {{tk.text}}; display: flex; align-items: center; justify-content: center; font-size: 21px; box-shadow: {{tk.keyShadow}};">{{k}}</span>
</sc-for>
</div>
</sc-for>
<div style="display: flex; gap: 5px;">
<span style="width: 42px; flex-shrink: 0; height: 42px; border-radius: 5px; background: {{tk.fnKey}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{tk.text}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 8h-4.5v7h-7v-7H4z"></path></svg></span>
<sc-for list="{{row3}}" as="k" hint-placeholder-count="9">
<span style="flex: 1; height: 42px; border-radius: 5px; background: {{tk.key}}; color: {{tk.text}}; display: flex; align-items: center; justify-content: center; font-size: 21px; box-shadow: {{tk.keyShadow}};">{{k}}</span>
</sc-for>
<span style="width: 42px; flex-shrink: 0; height: 42px; border-radius: 5px; background: {{tk.fnKey}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="20" viewBox="0 0 26 24" fill="none" stroke="{{tk.text}}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 5h13a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 22 19H9l-6.5-7z M13 9.5l5 5 M18 9.5l-5 5"></path></svg></span>
</div>
<div style="display: flex; gap: 5px;">
<span style="width: 46px; flex-shrink: 0; height: 42px; border-radius: 5px; background: {{tk.fnKey}}; color: {{tk.text}}; display: flex; align-items: center; justify-content: center; font-size: 16px;">123</span>
<span style="width: 42px; flex-shrink: 0; height: 42px; border-radius: 5px; background: {{tk.fnKey}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{tk.text}}" stroke-width="1.6" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M3 12h18 M12 3c2.8 3 2.8 15 0 18 M12 3c-2.8 3-2.8 15 0 18"></path></svg></span>
<span style="flex: 1; height: 42px; border-radius: 5px; background: {{tk.key}}; color: {{tk.text}}; display: flex; align-items: center; justify-content: center; font-size: 16px;">Пробел</span>
<span style="width: 92px; flex-shrink: 0; height: 42px; border-radius: 5px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px;">Готово</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"list","options":["list","slot","edit","picker","long"]},"pickerStyle":{"editor":"enum","default":"tiles","options":["segment","pills","tiles","circles","accent"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'list';
    const light = this.props.theme === 'light';
    const tk = light
      ? { bg: '#FFFFFF', text: '#000000', card: '#F2F2F7', soft: '#1C1C1E', outside: '#C7C7CC', kbd: '#D1D3D9', key: '#FFFFFF', fnKey: '#ABB0BC', keyShadow: '0 1px 0 rgba(0,0,0,0.3)', onBg: '#1C1C1E', onText: '#FFFFFF', accent: '#8A5CF5' }
      : { bg: '#000000', text: '#FFFFFF', card: '#1C1C1E', soft: '#E5E5EA', outside: '#636366', kbd: '#1E1E20', key: '#48484B', fnKey: '#2F2F31', keyShadow: '0 1px 0 rgba(0,0,0,0.5)', onBg: '#E5E5EA', onText: '#000000', accent: '#8A6CEF' };
    const accent = tk.accent;
    const ON = { bg: tk.onBg, color: tk.onText };
    const OFF = { bg: 'transparent', color: tk.soft };
    const isEdit = mode === 'edit';
    const isPicker = mode === 'picker';
    const dateLabels = { edit: '2 Nov', picker: '3 Nov' };
    const dateLabel = dateLabels[mode] ?? 'Date';
    const selected = isEdit || isPicker ? 'date' : 'now';
    const pickerStyle = this.props.pickerStyle ?? 'tiles';
    const paths = {
      soon: 'M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5 M5.5 5h13l2 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-5.5z',
      now: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4',
      date: 'M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z M3.5 10h17 M8 3v4 M16 3v4'
    };
    const places = [
      { key: 'soon', label: 'Soon', icon: false },
      { key: 'now', label: 'Now', icon: false },
      { key: 'date', label: dateLabel, icon: true }
    ].map((p) => {
      const on = p.key === selected;
      return {
        ...p,
        ...(on ? ON : OFF),
        path: paths[p.key],
        pillBg: on ? ON.bg : tk.card,
        labelColor: on ? '#FFFFFF' : '#8E8E93',
        weight: on ? 700 : 500,
        accentBg: on ? accent : 'transparent',
        accentBorder: on ? accent : '#3A3A3C'
      };
    });
    const styles = {
      segment: pickerStyle === 'segment',
      pills: pickerStyle === 'pills',
      tiles: pickerStyle === 'tiles',
      circles: pickerStyle === 'circles',
      accent: pickerStyle === 'accent'
    };
    const days = [];
    const start = new Date(2026, 9, 26);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const inMonth = d.getMonth() === 10;
      const isToday = d.getMonth() === 9 && d.getDate() === 30;
      const isSelected = inMonth && d.getDate() === 3;
      days.push({
        n: d.getDate(),
        bg: isSelected ? accent : 'transparent',
        color: isSelected ? '#FFFFFF' : isToday ? accent : inMonth ? tk.text : tk.outside,
        weight: isSelected || isToday ? 700 : 400
      });
    }
    return {
      tk,
      title: isEdit
        ? 'Записаться в барбершоп'
        : mode === 'long'
          ? 'Позвонить в банк и узнать, почему списали комиссию за обслуживание карты'
          : 'Позвонить в банк',
      doneLabel: isEdit ? 'Save' : 'Add',
      hasTime: mode === 'slot',
      showPicker: isPicker,
      places,
      styles,
      days,
      weekdays: ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'],
      accent,
      letterRows: [
        ['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х'],
        ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э']
      ],
      row3: ['я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю']
    };
  }
}
</script>
</body>
</html>
