<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отнести задачу к проекту</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1378px; height: 2340px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 36px; width: 1250px; display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 64px; line-height: 76px; font-weight: 700; color: #1C1C1E;">Отнести задачу к проекту</div>
<div style="font-size: 20px; line-height: 26px; color: #6B6A65; max-width: 1600px;">Из любой колонки, в меню задачи. На Mac то же меню справа от карточки. Метка на шаге 3 — по варианту 1, с вариантом 2 будет вторая строка. Пунктиром обведено новое</div>
</div>
<sc-for list="{{frames}}" as="p" hint-placeholder-count="6">
<div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: {{p.w}}px; height: {{p.h}}px; overflow: hidden; border-radius: {{p.r}}px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);">
<sc-if value="{{p.phone}}" hint-placeholder-val="{{true}}"><dc-import name="ProjPhone" view="{{p.view}}" look="{{p.look}}" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{p.desk}}" hint-placeholder-val="{{false}}"><dc-import name="ProjDesk" view="{{p.view}}" look="{{p.look}}" theme="{{p.theme}}" hint-size="1200px,800px"></dc-import></sc-if>
</div>
<div style="position: absolute; left: {{p.left}}px; top: {{p.capTop}}px; width: {{p.w}}px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</span>
<span style="font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.cap}}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1378,"height":2340}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [{"phone": true, "desk": false, "view": "menu", "look": "project", "theme": "dark", "left": 64, "top": 330, "w": 390, "h": 844, "r": 34, "capTop": 1190, "name": "1. Тап по задаче в Inbox", "cap": "Мысль пришла на бегу и легла в Inbox. На разборе тап по ней: в группе правки новая строка Project, справа — где задача сейчас, «No project»"}, {"phone": true, "desk": false, "view": "picker", "look": "project", "theme": "dark", "left": 494, "top": 330, "w": 390, "h": 844, "r": 34, "capTop": 1190, "name": "2. Project", "cap": "Список проектов на месте меню, как у Section: проекты по алфавиту, «No project» последним, галка на текущем. Тап по проекту — к задаче дописывается ссылка на заметку проекта"}, {"phone": true, "desk": false, "view": "picked", "look": "icon", "theme": "dark", "left": 924, "top": 330, "w": 390, "h": 844, "r": 34, "capTop": 1190, "name": "3. Готово", "cap": "Задача осталась на месте, в файле у строки ссылка на проект. На карточке метка проекта"}, {"phone": true, "desk": false, "view": "menu", "look": "project", "theme": "light", "left": 64, "top": 1360, "w": 390, "h": 844, "r": 34, "capTop": 2220, "name": "", "cap": ""}, {"phone": true, "desk": false, "view": "picker", "look": "project", "theme": "light", "left": 494, "top": 1360, "w": 390, "h": 844, "r": 34, "capTop": 2220, "name": "", "cap": ""}, {"phone": true, "desk": false, "view": "picked", "look": "icon", "theme": "light", "left": 924, "top": 1360, "w": 390, "h": 844, "r": 34, "capTop": 2220, "name": "", "cap": ""}] };
  }
}
</script>
</body>
</html>
