<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>2. Поповер у нажатого пункта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 2188px; height: 2190px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">2. Поповер у нажатого пункта</div>
<div style="position: absolute; left: 64px; top: 100px; width: 2060px; font-size: 18px; line-height: 24px; color: #6B6A65;">Меню остаётся под ним, нажатый пункт подсвечен. Маленькое окно со стрелкой показывает вопрос, название задачи и две кнопки рядом</div>
<sc-for list="{{frames}}" as="p" hint-placeholder-count="6">
<sc-if value="{{p.phone}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="ConfirmPhone" variant="popover" action="{{p.a}}" theme="{{p.t}}" hint-size="390px,844px"></dc-import></div>
</sc-if>
<sc-if value="{{p.desk}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: 1200px; height: 800px; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="ConfirmDesk" variant="popover" action="{{p.a}}" theme="{{p.t}}" hint-size="1200px,800px"></dc-import></div>
</sc-if>
<div style="position: absolute; left: {{p.left}}px; top: {{p.capTop}}px; width: 390px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</span>
<span style="font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.cap}}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2188,"height":2190}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [{"kind": "phone", "a": "delete", "t": "dark", "left": 64, "top": 176, "name": "Delete, тёмная", "cap": "Окно встаёт над строкой Delete, стрелка показывает на неё. Кнопка Delete красная", "phone": true, "desk": false, "w": 390, "h": 844, "capTop": 1038}, {"kind": "phone", "a": "wontdo", "t": "dark", "left": 494, "top": 176, "name": "Won’t do, тёмная", "cap": "Окно под плиткой Won’t do, стрелкой к ней. Кнопка Won’t do нейтральная, светлая на тёмном", "phone": true, "desk": false, "w": 390, "h": 844, "capTop": 1038}, {"kind": "desk", "a": "delete", "t": "dark", "left": 924, "top": 176, "name": "Десктоп: Delete, тёмная", "cap": "То же окно у пункта меню. Esc и клик мимо закрывают только окно, меню остаётся", "phone": false, "desk": true, "w": 1200, "h": 800, "capTop": 994}, {"kind": "phone", "a": "delete", "t": "light", "left": 64, "top": 1200, "name": "Delete, светлая", "cap": "Тот же вопрос в светлой теме", "phone": true, "desk": false, "w": 390, "h": 844, "capTop": 2062}, {"kind": "phone", "a": "wontdo", "t": "light", "left": 494, "top": 1200, "name": "Won’t do, светлая", "cap": "Тот же вопрос в светлой теме", "phone": true, "desk": false, "w": 390, "h": 844, "capTop": 2062}, {"kind": "desk", "a": "wontdo", "t": "light", "left": 924, "top": 1200, "name": "Десктоп: Won’t do, светлая", "cap": "Нейтральная кнопка подтверждения в светлой теме", "phone": false, "desk": true, "w": 1200, "h": 800, "capTop": 2018}] };
  }
}
</script>
</body>
</html>
