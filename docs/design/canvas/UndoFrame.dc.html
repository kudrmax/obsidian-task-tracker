<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отмена: кадр с прода</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: {{f.w}}px; height: {{f.h}}px; overflow: hidden; background: {{c.ground}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: {{c.text}};">
<img src="{{bg}}" alt="" style="position: absolute; left: 0; top: 0; width: {{f.w}}px; height: {{f.h}}px; display: block;">

<button aria-label="Undo" style="position: absolute; left: {{f.left}}px; top: {{f.plusTop}}px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: {{c.track}}; box-shadow: {{c.deskShadow}}; color: {{btnInk}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>

<sc-if value="{{hasBar}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: {{f.left}}px; top: {{f.barTop}}px; width: {{f.barW}}px; height: 52px; box-sizing: border-box; padding-left: 16px; border-radius: 14px; background: {{c.panel}}; box-shadow: {{c.panelShadow}}; display: flex; align-items: center; gap: 12px; overflow: hidden;">
<span style="display: flex; color: {{s.ink}};"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}" fill="{{s.fill}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="font-size: 16px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.label}}</span>
<span style="font-size: 13px; line-height: 16px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{s.sub}}</span>
</span>
<sc-if value="{{showKeys}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: {{c.muted}};">{{s.keys}}</span></sc-if>
<sc-if value="{{s.hasAction}}" hint-placeholder-val="{{true}}">
<button style="height: 52px; padding: 0 16px; border: 0; background: transparent; color: {{c.accent}}; font: inherit; font-size: 16px; font-weight: 600;">{{s.action}}</button>
</sc-if>
<sc-if value="{{s.noAction}}" hint-placeholder-val="{{false}}"><span style="width: 4px;"></span></sc-if>
<span style="position: absolute; left: 0; bottom: 0; width: 60%; height: 3px; background: {{c.accent}};"></span>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","default":"phone","options":["phone","desk"]},"state":{"editor":"enum","default":"done","options":["idle","done","delete","undone","conflict"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const platform = this.props.platform ?? 'phone';
    const state = this.props.state ?? 'done';
    const light = this.props.theme === 'light';
    const desk = platform === 'desk';
    const BG = {
      'phone-dark-idle': '/_blob/8702adc64d0d1a154a94dd96bea463c6',
      'phone-dark-done': '/_blob/b8e9374611c777464debc0ea3d57499b',
      'phone-dark-delete': '/_blob/4dac74cc2492d78ff03e3e0a5bddaf30',
      'phone-dark-undone': '/_blob/75a97e4aecec0c59c54848acc766d962',
      'phone-dark-conflict': '/_blob/8702adc64d0d1a154a94dd96bea463c6',
      'phone-light-idle': '/_blob/7a5dc8e5c65e1ef9b59d59633261ca0d',
      'phone-light-done': '/_blob/b1cb7f61fcee86902f5e7e0f705818d0',
      'phone-light-delete': '/_blob/73e8382a537f7fdbf661bad5db53f6f7',
      'phone-light-undone': '/_blob/e58c32579b3054956d17aa03c50baef4',
      'phone-light-conflict': '/_blob/7a5dc8e5c65e1ef9b59d59633261ca0d',
      'desk-dark-done': '/_blob/86e788a6e5b1acaf486a95c6a0c0592c',
      'desk-dark-delete': '/_blob/a340f4f704fcb7e2db1c7541d34019b7',
      'desk-light-undone': '/_blob/ed99cc82c8bac5fa07225892060c5347',
      'desk-light-idle': '/_blob/fabffb995f5fc2ae114f68e72055cd91',
      'desk-light-conflict': '/_blob/fabffb995f5fc2ae114f68e72055cd91'
    };
    const c = light
      ? { ground: '#FFFFFF', text: '#000000', muted: '#8E8E93', accent: '#9873F7', danger: '#FF3B30', stale: '#FF9500', panel: 'rgba(250,250,252,0.97)', panelShadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', track: '#F2F2F2', off: '#A1A4AB', deskShadow: '0 6px 16px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.1)' }
      : { ground: desk ? '#1E1E1E' : '#000000', text: '#FFFFFF', muted: '#8E8E93', accent: '#9580FF', danger: '#FF453A', stale: '#FF9F0A', panel: 'rgba(44,44,46,0.96)', panelShadow: '0 16px 40px rgba(0,0,0,0.6)', track: desk ? '#353535' : '#1C1C1C', off: '#5A5A5E', deskShadow: '0 6px 16px rgba(0,0,0,0.45), 0 0 0 0.5px rgba(255,255,255,0.1)' };
    const CIRCLE = 'M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z';
    const S = {
      done: { icon: CIRCLE, fill: 'currentColor', ink: c.text, label: 'Marked done', sub: 'Купить билеты в Белград', action: 'Undo', keys: '⌘Z' },
      delete: { icon: 'M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13', fill: 'none', ink: c.danger, label: 'Task deleted', sub: 'Купить билеты в Белград', action: 'Undo', keys: '⌘Z' },
      undone: { icon: 'M9 14L4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11', fill: 'none', ink: c.accent, label: 'Back in Now', sub: 'Купить билеты в Белград', action: 'Redo', keys: '⇧⌘Z' },
      conflict: { icon: 'M12 3.5L2.5 20h19z M12 10v4.5 M12 17.5v.01', fill: 'none', ink: c.stale, label: 'Can’t undo', sub: 'The tasks file changed', action: '', keys: '' },
      idle: { icon: '', fill: 'none', ink: c.text, label: '', sub: '', action: '', keys: '' }
    };
    const s = { ...S[state] };
    s.hasAction = !!s.action;
    s.noAction = !s.action;
    const f = desk
      ? { w: 1200, h: 800, left: 60, plusTop: 719, barTop: 659, barW: 1124 }
      : { w: 390, h: 844, left: 16, plusTop: 704, barTop: 644, barW: 358 };
    return {
      c, s, f,
      bg: BG[platform + '-' + (light ? 'light' : 'dark') + '-' + state] ?? '',
      hasBar: state !== 'idle',
      showKeys: desk && s.hasAction,
      btnInk: state === 'idle' ? c.off : c.text
    };
  }
}
</script>
</body>
</html>
