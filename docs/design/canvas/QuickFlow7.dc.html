<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Не выбран: всё прямо в полосе</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1458px; height: 1120px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">Не выбран: всё прямо в полосе</div>
<div style="position: absolute; left: 64px; top: 100px; width: 1330px; font-size: 18px; line-height: 24px; color: #6B6A65;">Вариант 1 для истории: место выбиралось иконками прямо в полосе, как в колёсике, на тап быстрее, но полоса шумнее. Макс выбрал две кнопки (01.11)</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="3">
<div style="position: absolute; left: {{p.left}}px; top: 168px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="QuickAdd" view="{{p.view}}" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1026px; width: 390px; font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1458,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return { phones: [{"left": 64, "view": "v1Now", "theme": "dark", "caption": "Иконки места в полосе"}, {"left": 534, "view": "v1Inbox", "theme": "dark", "caption": "Тап по Inbox"}, {"left": 1004, "view": "v1Date", "theme": "dark", "caption": "Выбран день"}] };
  }
}
</script>
</body>
</html>
