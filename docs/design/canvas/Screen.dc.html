<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экран: список и календарь</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">

<div style="position: absolute; left: 0; right: 0; top: 56px; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box; z-index: 6;">
<button aria-label="Toggle sidebar" style="width: 46px; height: 46px; border-radius: 23px; border: 0; padding: 0; background: {{c.chrome}}; color: {{c.chromeIcon}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg></button>
<span style="font-size: 17px; font-weight: 600; color: {{c.text}};">Task Calendar</span>
<button aria-label="More actions" style="width: 56px; height: 46px; border-radius: 23px; border: 0; padding: 0; background: {{c.chrome}}; color: {{c.chromeIcon}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>

<div style="position: absolute; left: 0; right: 0; top: 118px; height: 36px; padding: 0 12px 0 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<div style="display: flex; align-items: center; gap: 4px; min-width: 0;">
<button aria-label="Previous day" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; border: 0; padding: 0; background: transparent; color: {{c.icon}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg></button>
<button aria-label="Today, back to today" style="height: 36px; border: 0; padding: 0 4px; background: transparent; color: {{c.text}}; font: inherit; font-size: 20px; font-weight: 700; white-space: nowrap;">{{dayTitle}}</button>
<button aria-label="Next day" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; border: 0; padding: 0; background: transparent; color: {{c.icon}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg></button>
</div>
<div style="position: relative; height: 32px; flex-shrink: 0; box-sizing: border-box; padding: 2px; border-radius: 16px; background: {{c.track}}; display: flex;">
<span style="position: absolute; top: 2px; left: {{pillLeft}}px; width: 76px; height: 28px; border-radius: 14px; background: {{c.selectedBg}};"></span>
<sc-for list="{{chips}}" as="o" hint-placeholder-count="3">
<button aria-label="{{o.label}}" style="position: relative; width: 38px; height: 28px; border: 0; padding: 0; background: transparent; color: {{o.color}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg><sc-if value="{{o.dot}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 2px; right: 6px; width: 7px; height: 7px; border-radius: 4px; background: {{c.dot}};"></span></sc-if></button>
</sc-for>
</div>
</div>

<div style="position: absolute; left: {{now.left}}px; top: 166px; bottom: 0; width: {{now.width}}px; padding: {{now.pad}}; box-sizing: border-box; overflow: hidden;">
<div style="margin-top: -{{listScroll}}px; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="7">
<div style="position: relative; overflow: hidden; height: 40px; box-sizing: border-box; background: {{c.card}}; border-radius: 12px; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 6px;">
<sc-if value="{{t.progress}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: {{stripColor}};"></span>
</sc-if>
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; font-size: 15px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{t.title}}</div>
<sc-if value="{{t.showDue}}" hint-placeholder-val="{{false}}">
<span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: {{c.dueDay}}; font-variant-numeric: tabular-nums;">{{t.day}}</span><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: {{c.muted}}; letter-spacing: 0.3px;">{{t.mon}}</span></span>
</sc-if>
</div>
</sc-for>
</div>
</div>

<sc-if value="{{soonPanel.visible}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{soonPanel.left}}px; top: 166px; bottom: 0; width: {{soonPanel.width}}px; padding: 0 2px 0 10px; box-sizing: border-box; overflow: hidden;">
<div style="margin-top: -{{soonScroll}}px; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{soon}}" as="t" hint-placeholder-count="8">
<div style="position: relative; overflow: hidden; height: 40px; box-sizing: border-box; background: {{c.card}}; border-radius: 12px; padding: 0 8px 0 12px; display: flex; align-items: center;">
<sc-if value="{{t.progress}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: {{stripColor}};"></span>
</sc-if>
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; font-size: 15px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{t.title}}</div>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-for list="{{dividers}}" as="d" hint-placeholder-count="1">
<div style="position: absolute; left: {{d.left}}px; top: 166px; bottom: 0; width: 16px; display: flex; justify-content: center;">
<div style="width: 1px; height: 100%; background: {{c.separator}};"></div>
<sc-if value="{{d.handle}}" hint-placeholder-val="{{true}}">
<button aria-label="Resize columns" style="position: absolute; top: 260px; left: 3px; width: 10px; height: 52px; border: 0; padding: 0; border-radius: 5px; background: {{c.handle}};"></button>
</sc-if>
</div>
</sc-for>

<div style="position: absolute; left: {{calLeft}}px; width: {{calWidth}}px; top: 166px; bottom: 0; overflow: hidden;">
<sc-if value="{{isCal}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 26px; background: {{c.bg}}; z-index: 3;"></div>
<div style="position: relative; z-index: 4; margin-left: 28px; margin-right: 4px; height: 22px; border-radius: 6px; background: {{allDay.bg}}; display: flex; overflow: hidden;">
<div style="width: 3px; flex-shrink: 0; background: {{allDay.bar}};"></div>
<div style="flex: 1; min-width: 0; padding: 0 6px; display: flex; align-items: center; font-size: 12px; font-weight: 600; color: {{allDay.text}}; white-space: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent);">День рождения Ани</div>
</div>

<div style="position: absolute; top: {{timelineTop}}px; left: 0; right: 0; height: 640px; z-index: 1;">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="11">
<sc-if value="{{h.showLabel}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; top: {{h.labelTop}}px; left: 0; width: 22px; text-align: right; font-size: 11px; line-height: 14px; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{h.label}}</div>
</sc-if>
<div style="position: absolute; top: {{h.top}}px; left: 26px; right: 0; height: 1px; background: {{c.grid}};"></div>
</sc-for>

<div style="position: absolute; top: 0; bottom: 0; left: 28px; right: 4px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<sc-if value="{{it.isEvent}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; {{it.pos}} box-sizing: border-box; overflow: hidden; border-radius: 6px; background: {{it.bg}}; display: flex;">
<div style="width: 3px; flex-shrink: 0; background: {{it.bar}};"></div>
<div style="flex: 1; min-width: 0; padding: {{it.pad}};">
<div style="font-size: {{it.fs}}px; line-height: {{it.lh}}px; font-weight: 600; color: {{it.text}}; white-space: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent);">{{it.title}}</div>
</div>
</div>
</sc-if>
<sc-if value="{{it.isTask}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; {{it.pos}} box-sizing: border-box; overflow: hidden; border-radius: 8px; background: {{c.card}}; box-shadow: inset 0 0 0 1px {{c.outline}}; padding: {{it.pad}}; z-index: 1;">
<sc-if value="{{it.progress}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: {{stripColor}};"></span>
</sc-if>
<div style="font-size: {{it.fs}}px; line-height: {{it.lh}}px; font-weight: 600; color: {{c.text}}; white-space: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 16px), transparent);">{{it.title}}</div>
<div style="position: absolute; bottom: 3px; left: 50%; width: 16px; height: 3px; margin-left: -8px; border-radius: 2px; background: {{c.grabber}};"></div>
</div>
</sc-if>
</sc-for>

<sc-if value="{{dragging}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; top: {{drop.top}}px; height: {{drop.height}}px; left: 1px; width: calc(50% - 2px); box-sizing: border-box; border-radius: 8px; border: 1.5px dashed {{accent}}; background: {{c.placeholder}}; padding: 4px 7px; z-index: 2;">
<span style="font-size: 12px; font-weight: 600; color: {{accent}}; font-variant-numeric: tabular-nums;">16:30</span>
</div>
</sc-if>
</div>

<div style="position: absolute; top: {{nowTop}}px; left: 0; right: 0; height: 16px; display: flex; align-items: center; z-index: 3;">
<span style="width: 34px; height: 16px; flex-shrink: 0; border-radius: 8px; background: {{c.now}}; color: #FFFFFF; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;">14:20</span>
<div style="flex: 1; height: 2px; background: {{c.now}};"></div>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{dragging}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{floatLeft}}px; top: {{floatTop}}px; width: 190px; height: 42px; box-sizing: border-box; background: {{c.raised}}; border-radius: 12px; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 6px; box-shadow: {{c.raisedShadow}}; z-index: 5;">
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; font-size: 15px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">Купить билеты в Белград</div>
<span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: {{c.dueDay}};">3</span><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: {{c.raisedMuted}}; letter-spacing: 0.3px;">NOV</span></span>
</div>
</sc-if>

<div style="position: absolute; left: {{now.left}}px; bottom: 76px; width: {{now.width}}px; padding: {{now.btnPad}}; box-sizing: border-box; background: {{c.bg}}; z-index: 4;">
<button style="width: 100%; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px dashed {{c.dash}}; background: transparent; padding: 0 10px; display: flex; align-items: center; gap: 8px; font: inherit; font-size: 15px; color: {{c.muted}}; white-space: nowrap; overflow: hidden;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>New task</button>
</div>

<sc-if value="{{soonPanel.visible}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{soonPanel.left}}px; width: {{soonPanel.width}}px; bottom: 76px; padding: 8px 2px 8px 10px; box-sizing: border-box; background: {{c.bg}}; z-index: 4;">
<button style="width: 100%; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px dashed {{c.dash}}; background: transparent; padding: 0 10px; display: flex; align-items: center; gap: 8px; font: inherit; font-size: 15px; color: {{c.muted}}; white-space: nowrap; overflow: hidden;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>New task</button>
</div>
</sc-if>

<nav aria-label="Obsidian navigation" style="position: absolute; left: 42px; right: 42px; bottom: 19px; height: 49px; border-radius: 25px; background: {{c.nav}}; box-shadow: {{c.navShadow}}; display: flex; align-items: center; justify-content: space-around; z-index: 6; color: {{c.chromeIcon}};">
<button aria-label="Back" style="width: 40px; height: 40px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg></button>
<button aria-label="Forward" style="width: 40px; height: 40px; border: 0; padding: 0; background: transparent; color: {{c.chromeOff}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg></button>
<button aria-label="Search" style="width: 40px; height: 40px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg></button>
<button aria-label="New note" style="width: 40px; height: 40px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
<button aria-label="Tabs" style="width: 40px; height: 40px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center;"><svg width="24" height="22" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="4" width="22" height="16" rx="3.5"></rect><text x="13" y="16" text-anchor="middle" font-size="10" font-family="-apple-system, Inter, sans-serif" fill="currentColor" stroke="none">20</text></svg></button>
<button aria-label="Menu" style="width: 40px; height: 40px; border: 0; padding: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"listWidth":{"editor":"range","default":187,"min":110,"max":280,"step":1,"unit":"px"},"dragging":{"editor":"boolean","default":false},"rightMode":{"editor":"enum","default":"calendar","options":["calendar","soon"]},"progress":{"editor":"range","default":-1,"min":-1,"max":1,"step":0.05},"scrollHours":{"editor":"range","default":0,"min":0,"max":6,"step":0.5,"unit":"h"},"newSlot":{"editor":"boolean","default":false},"sourceDot":{"editor":"boolean","default":false},"listScroll":{"editor":"range","default":0,"min":0,"max":300,"step":1,"unit":"px"},"soonScroll":{"editor":"range","default":0,"min":0,"max":300,"step":1,"unit":"px"},"accent":{"editor":"color","default":"#9580FF","options":["#9580FF","#0A84FF","#30D158","#FF9F0A"]},"stripColor":{"editor":"color","default":"#8A6CEF","options":["#8A6CEF","#3B3266"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  themes() {
    return {
      dark: {
        bg: '#000000', card: '#1C1C1E', raised: '#2C2C2E', raisedShadow: '0 14px 32px rgba(0,0,0,0.7), 0 0 0 1px #48484A',
        text: '#FFFFFF', icon: '#E5E5EA', dueDay: '#E5E5EA', muted: '#8E8E93', raisedMuted: '#AEAEB2',
        separator: '#2C2C2E', handle: '#48484A', grid: '#232325', outline: '#3A3A3C', grabber: '#636366', dash: '#3A3A3C',
        track: '#1C1C1E', selectedBg: '#E5E5EA', selectedText: '#000000',
        accent: '#9580FF', strip: '#8A6CEF', placeholder: '#251F3D', now: '#D92C24', dot: '#FF9F0A',
        chrome: '#1F1F21', chromeIcon: '#E5E5EA', chromeOff: '#6C6C70', nav: '#2A2A2C', navShadow: 'none',
        events: {
          work: { bg: 'rgba(10,132,255,0.24)', bar: '#0A84FF', text: '#8CC6FF' },
          google: { bg: 'rgba(255,159,10,0.22)', bar: '#FF9F0A', text: '#FFC56B' },
          pink: { bg: 'rgba(255,55,95,0.22)', bar: '#FF375F', text: '#FF9AAE' },
          green: { bg: 'rgba(48,209,88,0.22)', bar: '#30D158', text: '#86E3A0' }
        }
      },
      light: {
        bg: '#FFFFFF', card: '#F2F2F7', raised: '#FFFFFF', raisedShadow: '0 14px 32px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.12)',
        text: '#000000', icon: '#3A3A3C', dueDay: '#1C1C1E', muted: '#8E8E93', raisedMuted: '#8E8E93',
        separator: '#E5E5EA', handle: '#C7C7CC', grid: '#EFEFF4', outline: '#D1D1D6', grabber: '#AEAEB2', dash: '#C7C7CC',
        track: '#EEEEF0', selectedBg: '#1C1C1E', selectedText: '#FFFFFF',
        accent: '#8A5CF5', strip: '#8A5CF5', placeholder: '#F1ECFE', now: '#FF3B30', dot: '#FF9500',
        chrome: '#F2F2F7', chromeIcon: '#3A3A3C', chromeOff: '#C7C7CC', nav: '#F7F7F9', navShadow: '0 0 0 0.5px rgba(0,0,0,0.08), 0 6px 20px rgba(0,0,0,0.08)',
        events: {
          work: { bg: 'rgba(0,122,255,0.13)', bar: '#007AFF', text: '#0058B8' },
          google: { bg: 'rgba(255,149,0,0.16)', bar: '#FF9500', text: '#9A5300' },
          pink: { bg: 'rgba(255,45,85,0.13)', bar: '#FF2D55', text: '#B8173C' },
          green: { bg: 'rgba(52,199,89,0.16)', bar: '#34C759', text: '#1F7A35' }
        }
      }
    };
  }
  renderVals() {
    const listW = Number(this.props.listWidth ?? 187);
    const dragging = this.props.dragging === true || this.props.dragging === 'true';
    const isSoon = (this.props.rightMode ?? 'calendar') === 'soon';
    const newSlot = this.props.newSlot === true || this.props.newSlot === 'true';
    const light = this.props.theme === 'light';
    const c = this.themes()[light ? 'light' : 'dark'];
    const soon = [
      { title: 'Продлить страховку' },
      { title: 'Купить подарок Ане' },
      { title: 'Разобрать фото с поездки', progress: true },
      { title: 'Записаться к стоматологу' },
      { title: 'Починить велосипед' },
      { title: 'Прочитать Deep Work' },
      { title: 'Заменить фильтр для воды' },
      { title: 'Настроить бэкап ноутбука' }
    ].map((t) => ({ ...t, progress: !!t.progress }));
    const accent = light ? c.accent : (this.props.accent ?? '#9580FF');
    const HOUR = 56;
    const START = 9;
    const COLUMNS_TOP = 166;
    const TIMELINE_OFFSET = 34;
    const DUE_MIN_WIDTH = 160;
    const SCREEN_HALF = (390 - 16) / 2;
    const palette = c.events;
    const stripColor = light ? c.strip : (this.props.stripColor ?? '#8A6CEF');
    const tasks = [
      { title: 'Созвониться с врачом' },
      { title: 'Купить билеты в Белград', day: '3', mon: 'NOV', dragged: true },
      { title: 'Сдать налоговую декларацию', day: '30', mon: 'OCT' },
      { title: 'Записаться в барбершоп', progress: true, day: '2', mon: 'NOV' },
      { title: 'Посмотреть доклад про local-first приложения', progress: true },
      { title: 'Чай масала' },
      { title: 'Позвонить маме' }
    ]
      .filter((t) => !(dragging && t.dragged))
      .map((t) => ({ ...t, progress: !!t.progress, showDue: !!t.day && (isSoon ? SCREEN_HALF : listW) >= DUE_MIN_WIDTH }));
    const raw = [
      { kind: 'event', title: 'Стендап', s: 9, e: 9.25, cal: 'work' },
      { kind: 'event', title: '1:1 с Костей', s: 10, e: 11, cal: 'work' },
      { kind: 'task', title: 'Написать отчёт по проекту', s: 11, e: 12, progress: true },
      { kind: 'event', title: 'Обед с Вадимом', s: 12.5, e: 13.5, cal: 'google' },
      { kind: 'task', title: 'Разобрать почту', s: 14, e: 15 },
      { kind: 'event', title: 'Планирование спринта', s: 15, e: 16.5, cal: 'work', col: 0, cols: 2 },
      { kind: 'event', title: 'Созвон с банком', s: 15.5, e: 16, cal: 'pink', col: 1, cols: 2 },
      { kind: 'task', title: 'Заказать продукты', s: 17, e: 17.5 },
      { kind: 'event', title: 'Тренировка', s: 18, e: 19.5, cal: 'green' }
    ];
    const items = raw
      .map((r) => {
        const sharesWithNewSlot = (newSlot || dragging) && r.s === 17;
        const col = sharesWithNewSlot ? 1 : (r.col ?? 0);
        const cols = sharesWithNewSlot ? 2 : (r.cols ?? 1);
        const top = (r.s - START) * HOUR + 1;
        const height = (r.e - r.s) * HOUR - 2;
        const tiny = height < 24;
        const colors = r.kind === 'event' ? palette[r.cal] : {};
        return {
          ...colors,
          title: r.title,
          isEvent: r.kind === 'event',
          isTask: r.kind === 'task',
          progress: !!r.progress,
          pos: 'top: ' + top + 'px; height: ' + height + 'px; left: calc(' + (col * 100 / cols) + '% + 1px); width: calc(' + (100 / cols) + '% - 2px);',
          pad: tiny ? '0 5px' : '4px 6px',
          fs: tiny ? 10 : 12,
          lh: tiny ? Math.max(height - 2, 10) : 15
        };
      });
    const nowY = (14 + 20 / 60 - START) * HOUR;
    const hours = [];
    for (let h = START; h <= 19; h++) {
      const top = (h - START) * HOUR;
      hours.push({ label: String(h), top, labelTop: top - 7, showLabel: Math.abs(top - nowY) > 20 });
    }
    const drop = { top: (16.5 - START) * HOUR + 1, height: HOUR - 2 };
    const SCREEN = 390;
    const GAP = 16;
    const rawProgress = Number(this.props.progress ?? -1);
    const p = rawProgress >= 0 ? rawProgress : (isSoon ? 0 : 1);
    const mix = (from, to) => Math.round(from + (to - from) * p);
    const half = (SCREEN - GAP) / 2;
    const nowLeft = mix(half + GAP, 0);
    const nowWidth = mix(half, listW);
    const leftSide = p > 0.5;
    const now = {
      left: nowLeft,
      width: nowWidth,
      pad: leftSide ? '0 2px 0 10px' : '0 10px 0 2px',
      btnPad: leftSide ? '8px 2px 8px 10px' : '8px 10px 8px 2px'
    };
    const soonPanel = { left: nowLeft - GAP - half, width: half, visible: nowLeft - GAP > 0 };
    const calLeft = nowLeft + nowWidth + GAP;
    const calWidth = SCREEN - listW - GAP;
    const dividers = [
      ...(soonPanel.visible ? [{ left: nowLeft - GAP, handle: false }] : []),
      ...(calLeft < SCREEN ? [{ left: nowLeft + nowWidth, handle: true }] : [])
    ];
    const chipPaths = {
      soon: 'M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5 M5.5 5h13l2 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-5.5z',
      now: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4',
      cal: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5'
    };
    const firstChip = leftSide ? 1 : 0;
    const sourceDot = this.props.sourceDot === true || this.props.sourceDot === 'true';
    const chips = [
      { key: 'soon', label: 'Soon' },
      { key: 'now', label: 'Now' },
      { key: 'cal', label: 'Calendar' }
    ].map((o, i) => ({
      ...o,
      path: chipPaths[o.key],
      color: i === firstChip || i === firstChip + 1 ? c.selectedText : c.muted,
      dot: o.key === 'cal' && sourceDot
    }));
    return {
      c,
      allDay: palette.green,
      listW,
      calLeft,
      calWidth,
      now,
      soonPanel,
      dividers,
      chips,
      pillLeft: 2 + Math.round(38 * p),
      dragging,
      isCal: calLeft < SCREEN,
      soon,
      dayTitle: 'Today',
      tasks,
      items,
      hours,
      drop,
      timelineTop: TIMELINE_OFFSET - Number(this.props.scrollHours ?? 0) * HOUR,
      listScroll: Number(this.props.listScroll ?? 0),
      soonScroll: Number(this.props.soonScroll ?? 0),
      nowTop: nowY - 8,
      floatLeft: Math.max(calLeft - 60, 10),
      floatTop: COLUMNS_TOP + TIMELINE_OFFSET + drop.top - 20,
      accent,
      stripColor
    };
  }
}
</script>
</body>
</html>
