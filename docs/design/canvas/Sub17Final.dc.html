</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
</sc-if>

<sc-if value="{{menu.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{menu.left}}px; top: {{menu.top}}px; height: 35px; box-sizing: border-box; overflow: hidden; background: {{c.card}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; z-index: 11;">
<sc-if value="{{menu.progress}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: {{c.strip}};"></span></sc-if>
<div style="white-space: nowrap; font-size: 15px;">{{menu.title}}</div>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 600; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{menu.count}}</span>
<sc-if value="{{menu.due}}" hint-placeholder-val="{{false}}">
<span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: {{c.strong}}; font-variant-numeric: tabular-nums;">3</span><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: {{c.muted}}; letter-spacing: 0.3px;">NOV</span></span>
</sc-if>
</div>
<div style="position: absolute; left: {{menu.left}}px; top: {{menu.panelTop}}px; width: 250px; border-radius: 14px; overflow: hidden; background: {{c.panel}}; box-shadow: {{c.shadow}}; z-index: 11;">
<sc-for list="{{taskMenu}}" as="g" hint-placeholder-count="3">
<div style="border-top: {{g.gap}};">
<sc-for list="{{g.rows}}" as="m" hint-placeholder-count="2">
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-bottom: {{m.sep}}; background: transparent; color: {{m.color}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;">
<span style="flex: 1; min-width: 0;">{{m.label}}</span>
<sc-if value="{{m.hasValue}}" hint-placeholder-val="{{false}}"><span style="font-size: 15px; color: {{c.muted}};">{{m.value}}</span></sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{m.d}}"></path><path d="{{m.fd}}" fill="currentColor" stroke="none"></path></svg>
</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isNewSub}}" hint-placeholder-val="{{false}}">
<dc-import name="NewSheet" mode="sub" theme="{{theme}}" hint-size="390px,844px"></dc-import>
</sc-if>

<sc-for list="{{marks}}" as="k" hint-placeholder-count="0">
<div style="position: absolute; left: {{k.left}}px; top: {{k.top}}px; width: {{k.width}}px; height: {{k.height}}px; box-sizing: border-box; border: 2px dashed {{c.mark}}; border-radius: {{k.radius}}px; z-index: 20; pointer-events: none;"></div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"list","options":["list","menu","menuTask","newSub","added","dragTask","dragSub","dragOut","dragInto","calList","calMenu"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>

  renderVals() {

    const light = this.props.theme === 'light';
    const c = light
      ? { bg: '#FFFFFF', card: '#F2F2F7', text: '#000000', strong: '#1C1C1E', muted: '#8E8E93', dash: '#C7C7CC', strip: '#8A5CF5', accent: '#8A5CF5', target: '#F1ECFE', backdrop: 'rgba(0,0,0,0.22)', panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', sep: '#D1D1D6', gap: '#E5E5EA', danger: '#FF3B30', float: '#FFFFFF', floatShadow: '0 14px 32px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.12)', floatMonth: '#8E8E93', under1: '#F7F7F9', under2: '#EFEFF2', mark: '#FF9500', kbd: '#D1D3D9', key: '#FFFFFF', fnKey: '#ABB0BC', keyShadow: '0 1px 0 rgba(0,0,0,0.3)' }
      : { bg: '#000000', card: '#1C1C1E', text: '#FFFFFF', strong: '#E5E5EA', muted: '#8E8E93', dash: '#3A3A3C', strip: '#8A6CEF', accent: '#9580FF', target: '#251F3D', backdrop: 'rgba(0,0,0,0.55)', panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', sep: '#48484A', gap: '#1C1C1E', danger: '#FF453A', float: '#2C2C2E', floatShadow: '0 14px 32px rgba(0,0,0,0.7), 0 0 0 1px #48484A', floatMonth: '#AEAEB2', under1: '#242426', under2: '#1C1C1E', mark: '#FFD60A', kbd: '#1E1E20', key: '#48484B', fnKey: '#2F2F31', keyShadow: '0 1px 0 rgba(0,0,0,0.5)' };
    const INDENT = 20;
    const CARD = 35;
    const STEP = CARD + 2;
    const TOP = 166;
    const tree = [
      { title: 'Созвониться с врачом' },
      { id: 'belgrade', title: 'Купить билеты в Белград', day: '3', mon: 'NOV', subs: [
        { title: 'Сравнить цены на рейсы', done: true },
        { title: 'Согласовать даты с Аней', done: true },
        { id: 'seats', title: 'Выбрать места', progress: true, subs: [
          { title: 'Окно для Ани' },
          { title: 'Проход для меня' }
        ] },
        { id: 'pay', title: 'Оплатить билеты' },
        { id: 'wallet', title: 'Добавить посадочные в Wallet' },
        { id: 'bag', title: 'Взять багаж', added: true }
      ] },
      { id: 'taxes', title: 'Сдать налоговую декларацию', subs: [
        { title: 'Собрать справки о доходах', done: true },
        { title: 'Заполнить в личном кабинете' },
        { title: 'Подписать и отправить' }
      ] },
      { title: 'Записаться в барбершоп', progress: true, day: '2', mon: 'NOV' },
      { title: 'Посмотреть доклад про local-first приложения', progress: true },
      { title: 'Чай масала' },
      { id: 'mom', title: 'Позвонить маме' },
      { title: 'Оплатить интернет' },
      { title: 'Забрать посылку' }
    ];
    const expanded = ['belgrade', 'seats', 'taxes'];
    const hidden = { dragTask: 'belgrade', dragSub: 'pay', dragOut: 'pay', dragInto: 'mom' }[view];
    const gapAfter = { dragSub: { id: 'wallet', level: 1 }, dragOut: { id: 'taxes', level: 0 } }[view];
    const target = view === 'dragInto' ? 'taxes' : null;
    const rows = [];
    let gapTop = 0;
    const walk = (items, level) => {
      for (const t of items) {

        const subs = t.subs ?? [];
        const isTarget = t.id === target;
        rows.push({
          isCard: true, isGap: false, indent: level * INDENT,
          title: t.title, progress: !!t.progress, due: !!t.day, day: t.day, mon: t.mon,
          hasSubs: subs.length > 0, count: subs.filter((s) => s.done).length + '/' + subs.filter((s) => !s.added || view === 'added').length,

        });

        }
      }
    };
    walk(tree, 0);
    const targetIndex = rows.findIndex((r) => r.id === target);
    const drags = {

      dragSub: { title: 'Оплатить билеты', left: 10 + INDENT + 14, top: gapTop + 6 },

    const drag = d

          layer1Left: d.left + 7, layer1Top: d.top + 6, layer1W: 176, layer2Left: d.left + 14, layer2Top: d.top + 12, layer2W: 162 }
      : { on: false };
    const SCROLL = 1.5;
    const calView = ['calList', 'calMenu'].includes(view);
    const blockTop = TOP + 34 + (11 - 9 - SCROLL) * 56 + 1;
    const calSubs = [{ title: 'Собрать цифры за квартал' }, { title: 'Написать выводы' }, { title: 'Отправить Косте' }];
    const cal = calView
      ? { on: true, top: blockTop,
          subsUnder: view === 'calMenu', subsLeft: 231, subsW: 155, subsTop: blockTop + 56,
          menu: view === 'calMenu', menuTop: blockTop + 56 + calSubs.length * STEP + 10 }
      : { on: false };

    const rowBox = (i) => box(10 + rows[i].indent, rowTop(i), 175 - rows[i].indent, CARD);
    const span = (from, to) => box(10 + Math.min(...rows.slice(from, to + 1).map((r) => r.indent)), rowTop(from), 175 - Math.min(...rows.slice(from, to + 1).map((r) => r.indent)), (to - from) * STEP + CARD);
    const subsOf = (id) => {
      const at = rows.findIndex((r) => r.id === id);
      let end = at;
      while (end + 1 < rows.length && rows[end + 1].indent > rows[at].indent) end++;
      return end > at ? span(at + 1, end) : null;
    };
    const menuOf = { menu: 'seats', menuTask: 'belgrade' }[view];
    const menuAt = rows.findIndex((r) => r.id === menuOf);
    const menuRow = menuOf ? rows[menuAt] : null;

      menu: () => [addSubRow(menu.panelTop, menu.left)],
      menuTask: () => [addSubRow(menu.panelTop, menu.left)],

      added: () => [rowBox(rows.findIndex((r) => r.id === 'bag'))],
      dragTask: () => d ? [box(d.left, d.top + 6, 190, 43)] : [],
      dragSub: () => [rowBox(rows.findIndex((r) => r.isGap))],
      dragOut: () => [rowBox(rows.findIndex((r) => r.isGap))],
