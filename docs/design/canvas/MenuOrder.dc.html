<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Меню задачи по группам</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<dc-import name="Screen" theme="dark" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10;"></div>

<div style="position: absolute; left: 10px; top: 212px; width: 175px; height: 40px; box-sizing: border-box; background: {{cardBg}}; border-radius: 20px; padding: 0 8px 0 12px; display: flex; align-items: center; gap: 6px; z-index: 11;">
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; font-size: 15px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">Записаться на корабль</div>
<span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: #E5E5EA;">1</span><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: #AEAEB2; letter-spacing: 0.3px;">NOV</span></span>
</div>

<div style="position: absolute; left: 10px; top: 264px; width: 300px; border-radius: 14px; overflow: hidden; background: rgba(44,44,46,0.96); box-shadow: 0 16px 40px rgba(0,0,0,0.6); z-index: 11;">
<div style="padding: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{statusTiles}}" as="r" hint-placeholder-count="3">
<button style="min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: rgba(255,255,255,0.08); color: #FFFFFF; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path><path d="{{r.fd}}" fill="currentColor" stroke="none"></path></svg>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap;">{{r.label}}</span>
</button>
</sc-for>
</div>

<div style="border-top: 8px solid #1C1C1E; padding: 8px; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{priorityRows}}" as="row" hint-placeholder-count="1">
<div style="display: flex; gap: 6px;">
<sc-for list="{{row.tiles}}" as="l" hint-placeholder-count="3">
<button aria-label="{{l.aria}}" style="position: relative; flex: 1; min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{l.bg}}; box-shadow: {{l.ring}}; color: {{l.c}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{flag}}"></path></svg>
<span style="width: 100%; box-sizing: border-box; padding: 0 8px; font-size: 13px; font-weight: 500; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-align: {{l.align}}; -webkit-mask-image: {{l.mask}}; mask-image: {{l.mask}};">{{l.name}}</span>
<sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; border-radius: 9px; background: {{l.c}}; color: #000000; display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span>
</sc-if>
</button>
</sc-for>
</div>
</sc-for>
</div>

<div style="border-top: 8px solid #1C1C1E;">
<sc-for list="{{editRows}}" as="r" hint-placeholder-count="3">
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-bottom: {{r.sep}}; background: transparent; color: #FFFFFF; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;">
<span style="flex: 1; min-width: 0;">{{r.label}}</span>
<sc-if value="{{r.hasValue}}" hint-placeholder-val="{{false}}"><span style="font-size: 15px; color: #8E8E93;">{{r.value}}</span></sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{r.d}}"></path></svg>
</button>
</sc-for>
</div>

<button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 8px solid #1C1C1E; background: transparent; color: #FF453A; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1;">Delete</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.del}}"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"priorities":{"editor":"enum","default":"short","options":["short","long","unset"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const CIRCLE = 'M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z';
    const FLAG = 'M5.5 21V4 M5.5 4.5h11.5l-2.5 4.75 2.5 4.75H5.5';
    const icons = {
      progressFill: 'M12 3a9 9 0 0 1 0 18z',
      wontdo: CIRCLE + ' M8 12h8',
      due: 'M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z M3.5 10h17 M8 3v4 M16 3v4',
      rename: 'M4 20h4L19 9l-4-4L4 16z M13.5 6.5l4 4',
      del: 'M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13',
      subtask: 'M5 4v8a4 4 0 0 0 4 4h11 M16 12l4 4-4 4'
    };
    const editRows = [
      { label: 'Rename', d: icons.rename },
      { label: 'Due date', d: icons.due, value: '1 Nov' },
      { label: 'Add subtask', d: icons.subtask }
    ].map((r, i, a) => ({ ...r, hasValue: !!r.value, sep: i < a.length - 1 ? '0.5px solid #48484A' : '0' }));
    const set = this.props.priorities ?? 'short';
    const levels = set === 'long'
      ? [
          { name: 'Супер срочно', c: '#FF453A', tint: '#572725' },
          { name: 'Важно', c: '#FF9F0A', tint: '#573E19', on: true },
          { name: 'На этой неделе', c: '#FFD60A', tint: '#574C19' },
          { name: 'Когда-нибудь, если будет время', c: '#40C8E0', tint: '#254950' }
        ]
      : [
          { name: 'p1', c: '#FF453A', tint: '#572725' },
          { name: 'p2', c: '#FF9F0A', tint: '#573E19', on: set === 'short' },
          { name: 'p3', c: '#FFD60A', tint: '#574C19' }
        ];
    const FADE = 'linear-gradient(to right, #000 calc(100% - 20px), transparent calc(100% - 8px))';
    const fits = (name) => name.length <= 10;
    const tiles = levels.map((l) => ({
      ...l,
      on: !!l.on,
      aria: l.on ? 'Remove priority ' + l.name : 'Priority ' + l.name,
      bg: l.on ? l.tint : 'rgba(255,255,255,0.08)',
      ring: l.on ? 'inset 0 0 0 1.5px ' + l.c : 'none',
      align: fits(l.name) ? 'center' : 'left',
      mask: fits(l.name) ? 'none' : FADE
    }));
    const rowCount = Math.ceil(tiles.length / 3);
    const perRow = Math.ceil(tiles.length / rowCount);
    const priorityRows = [];
    for (let i = 0; i < tiles.length; i += perRow) priorityRows.push({ tiles: tiles.slice(i, i + perRow) });
    const current = levels.find((l) => l.on);
    return {
      icons,
      flag: FLAG,
      priorityRows,
      cardBg: current ? current.tint : '#2C2C2E',
      statusTiles: [
        { label: 'Done', d: CIRCLE, fd: CIRCLE },
        { label: 'In progress', d: CIRCLE, fd: icons.progressFill },
        { label: 'Won’t do', d: icons.wontdo, fd: '' }
      ],
      editRows
    };
  }
}
</script>
</body>
</html>
