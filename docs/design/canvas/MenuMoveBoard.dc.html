<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Перенос и секция в меню задачи</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1928px; height: 1290px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">Перенос и секция в меню задачи</div>
<div style="position: absolute; left: 64px; top: 100px; width: 1800px; font-size: 18px; line-height: 24px; color: #6B6A65;">Зон при переносе больше нет: перетаскивание только меняет порядок, кладёт в секцию списка и на таймлайн. Быстрые переносы и секция — в меню, строки Due date больше нет. Пунктиром выделено новое</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="position: absolute; left: {{p.left}}px; top: 176px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="MenuMove" view="{{p.view}}" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1038px; width: 390px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</span>
<span style="font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1928,"height":1290}}'>
class Component extends DCLogic {
  renderVals() {
    const phones = [
      { view: 'today', theme: 'dark', name: '1. Открыт сегодняшний день', caption: 'Под приоритетом — плитки переноса, как были зоны: Tomorrow и Pick a date. Today нет: задача уже в этом дне. Нажатие переносит и закрывает меню' },
      { view: 'later', theme: 'dark', name: '2. Открыт другой день', caption: 'Открыт 5 ноября: Today, Tomorrow и Pick a date. Открыт завтрашний день — Today и Pick a date. Pick a date открывает календарь на месте меню, внизу в нём Remove due date, если срок есть' },
      { view: 'sections', theme: 'dark', name: '3. Section', caption: 'Строка Section с текущей секцией справа открывает список: все секции этого списка и заготовки из настроек, текущая с галкой, No section. New section переносит задачу в новую группу в конце и ставит поле имени' },
      { view: 'today', theme: 'light', name: 'Светлая тема', caption: 'То же меню, что в 1, в светлой теме. На десктопе меню то же самое: открывается кликом или правой кнопкой' }
    ];
    const lefts = [64, 534, 1004, 1474];
    return { phones: phones.map((p, i) => ({ ...p, left: lefts[i] })) };
  }
}
</script>
</body>
</html>
