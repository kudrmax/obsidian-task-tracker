<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Источники календаря</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">

<sc-if value="{{usesScreen}}" hint-placeholder-val="{{true}}">
<dc-import name="Screen" source-dot="{{showDot}}" scroll-hours="{{scrollHours}}" hint-size="390px,844px"></dc-import>
</sc-if>

<sc-if value="{{isPopover}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10;"></div>
<div style="position: absolute; left: 292px; top: 120px; height: 32px; box-sizing: border-box; padding: 2px; border-radius: 16px; background: #1C1C1E; display: flex; gap: 2px; z-index: 11;">
<span style="position: relative; width: 40px; height: 28px; border-radius: 14px; background: #E5E5EA; color: #000000; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><line x1="3.5" y1="10" x2="20.5" y2="10"></line><line x1="8" y1="3" x2="8" y2="6.5"></line><line x1="16" y1="3" x2="16" y2="6.5"></line></svg><span style="position: absolute; top: 2px; right: 7px; width: 7px; height: 7px; border-radius: 4px; background: #FF9F0A;"></span></span>
<span style="width: 40px; height: 28px; border-radius: 14px; color: #8E8E93; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="9" y1="6.5" x2="20" y2="6.5"></line><line x1="9" y1="12" x2="20" y2="12"></line><line x1="9" y1="17.5" x2="20" y2="17.5"></line><circle cx="4.5" cy="6.5" r="1" fill="currentColor"></circle><circle cx="4.5" cy="12" r="1" fill="currentColor"></circle><circle cx="4.5" cy="17.5" r="1" fill="currentColor"></circle></svg></span>
</div>
<div style="position: absolute; right: 12px; top: 162px; width: 268px; border-radius: 14px; overflow: hidden; background: rgba(44,44,46,0.97); box-shadow: 0 16px 40px rgba(0,0,0,0.7); z-index: 11;">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
<div style="min-height: 56px; box-sizing: border-box; padding: 8px 14px; border-bottom: {{s.sep}}; display: flex; align-items: center; gap: 10px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E5EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{s.icon}}"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 16px;">{{s.name}}</span>
<span style="font-size: 13px; color: #8E8E93;">{{s.sub}}</span>
</div>
<span style="font-size: 15px; color: {{s.color}}; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;">{{s.time}}</span>
</div>
</sc-for>
<button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; border-top: 8px solid #1C1C1E; background: transparent; color: {{accent}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.refresh}}"></path></svg>Refresh now</button>
</div>
</sc-if>

<sc-if value="{{isPull}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 207px; right: 6px; top: 198px; height: 80px; display: flex; flex-direction: column; gap: 6px; z-index: 5;">
<div style="align-self: center; color: #8E8E93;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1"></path></svg></div>
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{s.icon}}"></path></svg>
<span style="flex: 1; min-width: 0; color: #AEAEB2; white-space: nowrap;">{{s.short}}</span>
<span style="color: {{s.color}}; font-variant-numeric: tabular-nums; white-space: nowrap;">{{s.time}}</span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isSettings}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; padding: 64px 16px 0; box-sizing: border-box; background: #000000; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0 0 16px; font-size: 17px; font-weight: 600; text-align: center;">Task Calendar</h1>
<span style="padding: 0 16px; font-size: 13px; color: #8E8E93;">CALENDARS</span>
<div style="border-radius: 12px; overflow: hidden; background: #1C1C1E; margin-bottom: 24px;">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
<div style="min-height: 60px; box-sizing: border-box; padding: 10px 14px; border-bottom: {{s.sep}}; display: flex; align-items: center; gap: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5E5EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{s.icon}}"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 16px;">{{s.name}}</span>
<span style="font-size: 13px; color: {{s.color}};">{{s.long}}</span>
</div>
<button style="height: 30px; flex-shrink: 0; padding: 0 12px; border: 0; border-radius: 15px; background: #2C2C2E; color: {{accent}}; font: inherit; font-size: 14px; font-weight: 600;">Refresh</button>
</div>
</sc-for>
</div>
<span style="padding: 0 16px; font-size: 13px; color: #8E8E93;">TASKS</span>
<div style="border-radius: 12px; overflow: hidden; background: #1C1C1E;">
<sc-for list="{{taskSettings}}" as="r" hint-placeholder-count="3">
<div style="height: 46px; box-sizing: border-box; padding: 0 14px; border-bottom: {{r.sep}}; display: flex; align-items: center; gap: 10px; font-size: 16px;">
<span style="flex: 1;">{{r.label}}</span>
<span style="color: #8E8E93;">{{r.value}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"dot","options":["dot","popover","pull","settings"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'dot';
    const SEP = '0.5px solid #48484A';
    const ORANGE = '#FF9F0A';
    const icons = {
      cloud: 'M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5H7z',
      phone: 'M9 2.5h6a2.5 2.5 0 0 1 2.5 2.5v14a2.5 2.5 0 0 1-2.5 2.5H9A2.5 2.5 0 0 1 6.5 19V5A2.5 2.5 0 0 1 9 2.5z M11 18.5h2',
      refresh: 'M20 12a8 8 0 1 1-2.3-5.7 M20 4v4.5h-4.5'
    };
    const sources = [
      { name: 'Google Calendar', short: 'Google', sub: 'Updated today', time: '14:19', long: 'Updated today at 14:19', color: '#8E8E93', icon: icons.cloud, sep: SEP },
      { name: 'Work calendar', short: 'Work', sub: 'Exported from iPhone', time: 'Yesterday 08:02', long: 'Exported yesterday at 08:02 from iPhone', color: ORANGE, icon: icons.phone, sep: '0' }
    ];
    const taskSettings = [
      { label: 'Task file', value: 'Tasks.md' },
      { label: 'New task duration', value: '1 hour' },
      { label: 'Long press delay', value: '250 ms' }
    ].map((r, i, a) => ({ ...r, sep: i < a.length - 1 ? SEP : '0' }));
    return {
      usesScreen: mode !== 'settings',
      showDot: mode === 'dot' || mode === 'popover',
      scrollHours: mode === 'pull' ? -1.5 : 0,
      isPopover: mode === 'popover',
      isPull: mode === 'pull',
      isSettings: mode === 'settings',
      sources,
      taskSettings,
      icons,
      accent: '#8A6CEF'
    };
  }
}
</script>
</body>
</html>
