<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Источники календаря</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{k.bg}}; color: {{k.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">

<sc-if value="{{usesScreen}}" hint-placeholder-val="{{true}}">
<dc-import name="Screen" theme="{{theme}}" foot="prod" source-dot="{{showDot}}" source-tone="{{tone}}" scroll-hours="{{scrollHours}}" hint-size="390px,844px"></dc-import>
</sc-if>

<sc-if value="{{isPopover}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: {{k.overlay}}; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10;"></div>
<div style="position: absolute; left: {{wheel.left}}px; bottom: {{wheel.bottom}}px; width: {{wheel.width}}px; height: 44px; box-sizing: border-box; border-radius: 22px; background: {{k.track}}; box-shadow: {{k.control}}; overflow: hidden; z-index: 11;">
<span style="position: absolute; left: {{wheel.pillLeft}}px; top: 4px; width: 76px; height: 36px; border-radius: 18px; background: {{k.selBg}};"></span>
<sc-for list="{{wheel.icons}}" as="o" hint-placeholder-count="3">
<span style="position: absolute; left: {{o.left}}px; top: 4px; width: 38px; height: 36px; color: {{o.color}}; display: flex; align-items: center; justify-content: center; transform: scale({{o.scale}}); opacity: {{o.opacity}};"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg></span>
</sc-for>
</div>
<div style="position: absolute; left: {{panel.left}}px; bottom: {{panel.bottom}}px; width: 268px; border-radius: 14px; overflow: hidden; background: {{k.panel}}; box-shadow: {{k.shadow}}; z-index: 11;">
<sc-for list="{{windowLines}}" as="s" hint-placeholder-count="4">
<sc-if value="{{s.caption}}" hint-placeholder-val="{{false}}">
<div style="box-sizing: border-box; padding: 8px 16px; border-bottom: {{s.sep}}; font-size: 13px; color: {{k.muted}};">Not in use</div>
</sc-if>
<sc-if value="{{s.row}}" hint-placeholder-val="{{true}}">
<div style="min-height: 56px; box-sizing: border-box; padding: 8px 16px; border-bottom: {{s.sep}}; display: flex; align-items: center; gap: 10px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{s.iconColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{s.icon}}"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 16px; color: {{s.nameColor}};">{{s.name}}</span>
<span style="font-size: 13px; color: {{s.subColor}};">{{s.sub}}</span>
</div>
<span style="font-size: 15px; color: {{s.timeColor}}; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;">{{s.time}}</span>
</div>
</sc-if>
</sc-for>
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 8px solid {{k.gap}}; background: transparent; color: {{accent}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.refresh}}"></path></svg>Refresh now</button>
</div>
</sc-if>

<sc-if value="{{isPull}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 207px; right: 6px; top: 198px; height: 80px; display: flex; flex-direction: column; gap: 6px; z-index: 5;">
<div style="align-self: center; color: #8E8E93;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1"></path></svg></div>
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px;">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{k.soft}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{s.icon}}"></path></svg>
<span style="flex: 1; min-width: 0; color: {{k.soft}}; white-space: nowrap;">{{s.short}}</span>
<span style="color: {{s.color}}; font-variant-numeric: tabular-nums; white-space: nowrap;">{{s.time}}</span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isSettings}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; padding: 64px 16px 0; box-sizing: border-box; background: #000000; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0 0 16px; font-size: 17px; font-weight: 600; text-align: center;">Task Calendar</h1>
<span style="padding: 0 16px; font-size: 13px; color: #8E8E93;">CALENDARS</span>
<div style="border-radius: 12px; overflow: hidden; background: #1C1C1E; margin-bottom: 24px;">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="2">
<div style="min-height: 60px; box-sizing: border-box; padding: 10px 14px; border-bottom: {{s.sep}}; display: flex; align-items: center; gap: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E5E5EA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{s.icon}}"></path></svg>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 16px;">{{s.name}}</span>
<span style="font-size: 13px; color: {{s.color}};">{{s.long}}</span>
</div>
<button style="height: 30px; flex-shrink: 0; padding: 0 12px; border: 0; border-radius: 15px; background: #2C2C2E; color: {{accent}}; font: inherit; font-size: 14px; font-weight: 600;">Refresh</button>
</div>
</sc-for>
</div>
<span style="padding: 0 16px; font-size: 13px; color: #8E8E93;">TASKS</span>
<div style="border-radius: 12px; overflow: hidden; background: #1C1C1E;">
<sc-for list="{{taskSettings}}" as="r" hint-placeholder-count="3">
<div style="height: 46px; box-sizing: border-box; padding: 0 14px; border-bottom: {{r.sep}}; display: flex; align-items: center; gap: 10px; font-size: 16px;">
<span style="flex: 1;">{{r.label}}</span>
<span style="color: #8E8E93;">{{r.value}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"dot","options":["dot","popover","pull","settings"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"tone":{"editor":"enum","default":"old","options":["old","broken"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'dot';
    const light = this.props.theme === 'light';
    const k = light
      ? { bg: '#FFFFFF', text: '#000000', overlay: 'rgba(0,0,0,0.22)', track: '#EEEEF0', selBg: '#1C1C1E', selText: '#FFFFFF', muted: '#8E8E93', orange: '#FF9500', panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', control: '0 6px 16px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.1)', icon: '#3A3A3C', gap: '#E5E5EA', soft: '#6C6C70', sep: '#D1D1D6', accent: '#8A5CF5' }
      : { bg: '#000000', text: '#FFFFFF', overlay: 'rgba(0,0,0,0.55)', track: '#1C1C1E', selBg: '#E5E5EA', selText: '#000000', muted: '#8E8E93', orange: '#FF9F0A', panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', control: '0 6px 16px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.1)', icon: '#E5E5EA', gap: '#1C1C1E', soft: '#AEAEB2', sep: '#48484A', accent: '#8A6CEF' };
    const SEP = '0.5px solid ' + k.sep;
    const ORANGE = k.orange;
    const icons = {
      cloud: 'M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5H7z',
      phone: 'M9 2.5h6a2.5 2.5 0 0 1 2.5 2.5v14a2.5 2.5 0 0 1-2.5 2.5H9A2.5 2.5 0 0 1 6.5 19V5A2.5 2.5 0 0 1 9 2.5z M11 18.5h2',
      refresh: 'M20 12a8 8 0 1 1-2.3-5.7 M20 4v4.5h-4.5'
    };
    const sources = [
      { name: 'Google Calendar', short: 'Google', sub: 'Updated today', time: '14:19', long: 'Updated today at 14:19', color: '#8E8E93', icon: icons.cloud, sep: SEP },
      { name: 'Work calendar', short: 'Work', sub: 'Exported from iPhone', time: 'Yesterday 08:02', long: 'Exported yesterday at 08:02 from iPhone', color: ORANGE, icon: icons.phone, sep: '0' }
    ];
    const iphoneIcon = 'M9 2.5h6a2.5 2.5 0 0 1 2.5 2.5v14a2.5 2.5 0 0 1-2.5 2.5H9A2.5 2.5 0 0 1 6.5 19V5A2.5 2.5 0 0 1 9 2.5z M10.5 5h3';
    const plain = { iconColor: k.icon, nameColor: k.text, subColor: k.muted, timeColor: k.muted };
    const spare = { iconColor: k.muted, nameColor: k.muted, subColor: k.muted, timeColor: k.muted };
    const windowLines = [
      { row: true, name: 'Google Calendar', sub: 'Updated today', time: '14:19', icon: icons.cloud, ...plain },
      { row: true, name: 'iPhone calendars', sub: 'Exported from iPhone', time: '08:02', icon: iphoneIcon, ...plain },
      { caption: true },
      { row: true, name: 'Work calendar', sub: 'Exported from iPhone', time: '5 Nov 20:21', icon: icons.phone, ...spare }
    ].map((line, i, all) => ({ caption: false, row: false, ...line, sep: i < all.length - 1 ? SEP : '0' }));
    const wheelPaths = {
      soon: 'M5 21.5h14 M5 2.5h14 M17 21.5v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 3.9a2 2 0 0 0-.6 1.4v4.2 M7 2.5v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-3.9a2 2 0 0 0 .6-1.4V2.5',
      now: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4',
      cal: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5'
    };
    const WHEEL_W = 122;
    const wheelLeft = 390 / 2 - 38 - 4 - 38;
    const wheel = {
      left: wheelLeft,
      bottom: 78,
      width: WHEEL_W,
      pillLeft: 42,
      icons: [
        { path: wheelPaths.soon, left: 4, color: k.muted, scale: 0.86, opacity: 0.72 },
        { path: wheelPaths.now, left: 42, color: k.selText, scale: 1, opacity: 1 },
        { path: wheelPaths.cal, left: 80, color: k.selText, scale: 1, opacity: 1 }
      ]
    };
    const panel = { left: wheelLeft + WHEEL_W / 2 - 134, bottom: 78 + 44 + 12 };
    const taskSettings = [
      { label: 'Task file', value: 'Tasks.md' },
      { label: 'New task duration', value: '1 hour' },
      { label: 'Long press delay', value: '250 ms' }
    ].map((r, i, a) => ({ ...r, sep: i < a.length - 1 ? SEP : '0' }));
    return {
      usesScreen: mode !== 'settings',
      showDot: mode === 'dot',
      scrollHours: mode === 'pull' ? -1.5 : 0,
      isPopover: mode === 'popover',
      isPull: mode === 'pull',
      isSettings: mode === 'settings',
      sources,
      taskSettings,
      icons,
      k,
      windowLines,
      wheel,
      panel,
      tone: this.props.tone === 'broken' ? 'broken' : 'old',
      theme: light ? 'light' : 'dark',
      accent: k.accent
    };
  }
}
</script>
</body>
</html>
