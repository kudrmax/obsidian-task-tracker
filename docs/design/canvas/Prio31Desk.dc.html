<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки приоритетов на Mac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1040px; height: 640px; position: relative; overflow: hidden; border-radius: 12px; background: {{s.modal}}; color: {{s.text}}; display: flex; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<nav style="width: 220px; flex-shrink: 0; box-sizing: border-box; padding: 40px 12px; background: {{s.side}}; display: flex; flex-direction: column; gap: 2px;">
<span style="padding: 6px 10px; font-size: 12px; font-weight: 600; color: {{s.muted}};">Community plugins</span>
<span style="padding: 6px 10px; border-radius: 6px; background: {{s.sideOn}}; font-size: 14px;">Task Calendar</span>
</nav>
<div style="flex: 1; min-width: 0; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 10px;">
<h2 style="margin: 0 0 6px; font-size: 18px; font-weight: 700;">Priorities</h2>
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<div style="height: 60px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: 12px; background: {{s.group}}; display: flex; align-items: center; gap: 16px;">
<span style="width: 56px; height: 30px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px solid {{s.border}}; background: {{s.field}}; display: flex; align-items: center; font-size: 14px;">{{l.prefix}}</span>
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px;">
<sc-for list="{{l.swatches}}" as="w" hint-placeholder-count="6">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: {{w.fill}}; box-shadow: {{w.ring}};"></span>
</sc-for>
<button aria-label="Свой цвет" style="width: 26px; height: 26px; flex-shrink: 0; border: 0; padding: 0; border-radius: 13px; background: {{l.well.bg}}; box-shadow: {{l.well.ring}}; display: flex; align-items: center; justify-content: center;"><span style="width: 16px; height: 16px; border-radius: 8px; background: {{l.well.inner}};"></span></button>
</div>
<label style="width: 96px; height: 30px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; border-radius: 6px; border: 1px solid {{s.border}}; background: {{s.field}}; display: flex; align-items: center; gap: 2px; font-family: 'SF Mono', ui-monospace, Menlo, monospace; font-size: 13px;"><span style="color: {{s.muted}};">#</span><span>{{l.hex}}</span></label>
<div style="flex: 1; min-width: 0; height: 32px; box-sizing: border-box; border-radius: 16px; background: {{l.card}}; position: relative; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 6px;">
<span style="position: absolute; left: 5px; top: 14px; width: 4px; height: 4px; border-radius: 2px; background: {{l.meta}};"></span>
<span style="flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden;">Позвонить в банк</span>
<span style="flex-shrink: 0; font-size: 12px; font-weight: 600; color: {{l.meta}};">10:00</span>
</div>
<button aria-label="Delete level" style="width: 28px; height: 28px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: {{s.muted}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13"></path></svg></button>
</div>
</sc-for>
<div style="box-sizing: border-box; padding: 14px 16px; border-radius: 12px; background: {{s.group}}; display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 13px; line-height: 18px; color: {{s.muted}};">A task whose text starts with the prefix gets its colour. Pick one of the six, open the last circle to choose any colour, or type its code.</span>
<button style="height: 30px; border: 0; border-radius: 6px; background: {{s.button}}; color: {{s.text}}; font: inherit; font-size: 14px;">Add priority</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1040,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.theme === 'light';
    const s = light
      ? { modal: '#FFFFFF', side: '#F6F6F6', sideOn: '#E6E6E6', group: '#F6F6F6', field: '#FFFFFF', border: '#E0E0E0', button: '#E6E6E6', text: '#222222', muted: '#6E6E6E', halo: '#F6F6F6',
          card: '#F2F2F2', alpha: 0.16, pole: [0, 0, 0],
          colors: ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#30B0C7', '#007AFF'] }
      : { modal: '#1E1E1E', side: '#262626', sideOn: '#363636', group: '#262626', field: '#1E1E1E', border: '#3F3F3F', button: '#363636', text: '#DADADA', muted: '#A3A3A3', halo: '#262626',
          card: '#373737', alpha: 0.26, pole: [255, 255, 255],
          colors: ['#FF453A', '#FF9F0A', '#FFD60A', '#30D158', '#40C8E0', '#0A84FF'] };
    const ch = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
    const hx = (c) => '#' + c.map((v) => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('').toUpperCase();
    const mix = (a, b, t) => a.map((x, i) => x + (b[i] - x) * t);
    const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);
    const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
    const grey = ch('#8E8E93');
    const card = ch(s.card);
    const target = contrast(grey, card);
    const tone = (hex) => {
      const ink = ch(hex);
      const fill = mix(card, ink, s.alpha);
      const half = mix(ink, grey, 0.5);
      let lo = 0, hi = 1;
      for (let k = 0; k < 30; k++) { const t = (lo + hi) / 2; if (contrast(mix(half, s.pole, t), fill) < target) lo = t; else hi = t; }
      return { ink: hex, fill: hx(fill), meta: hx(mix(half, s.pole, hi)) };
    };
    const custom = light ? '#C2185B' : '#FF5FA2';
    const rows = [{ prefix: 'p1', pick: 0 }, { prefix: 'p2', pick: 1 }, { prefix: 'p3', pick: -1 }];
    const levels = rows.map((r) => {
      const hex = r.pick >= 0 ? s.colors[r.pick] : custom;
      const t = tone(hex);
      const swatches = s.colors.map((c, i) => {
        const w = tone(c);
        return { fill: w.fill, ring: i === r.pick ? '0 0 0 2px ' + s.halo + ', 0 0 0 4px ' + w.ink : 'none' };
      });
      const wellOn = r.pick < 0;
      const well = {
        bg: 'conic-gradient(#FF453A, #FFD60A, #30D158, #40C8E0, #0A84FF, #BF5AF2, #FF453A)',
        ring: wellOn ? '0 0 0 2px ' + s.halo + ', 0 0 0 4px ' + t.ink : 'none',
        inner: wellOn ? t.fill : s.group
      };
      return { prefix: r.prefix, swatches, well, hex: hex.slice(1), card: t.fill, meta: t.meta };
    });
    return { s, levels };
  }
}
</script>
</body>
</html>
