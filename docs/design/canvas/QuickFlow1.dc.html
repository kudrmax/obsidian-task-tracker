<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>1. Пишешь прямо в списке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1928px; height: 1120px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">1. Пишешь прямо в списке</div>
<div style="position: absolute; left: 64px; top: 100px; width: 1800px; font-size: 18px; line-height: 24px; color: #6B6A65;">Отдельного экрана нет: тап по плюсу или по New task ставит поле в конец списка, клавиатура уже открыта. Enter сохраняет задачу и сразу даёт пустое поле под ней — так накидывают много задач подряд. Жёлтой пунктирной рамкой обведено новое</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="position: absolute; left: {{p.left}}px; top: 168px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="QuickAdd" view="{{p.view}}" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1026px; width: 390px; font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1928,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return { phones: [{"left": 64, "view": "empty", "theme": "dark", "caption": "Тап по плюсу: пустое поле в конце сегодняшнего списка, над клавиатурой полоса"}, {"left": 534, "view": "typing", "theme": "dark", "caption": "Название пишут прямо на месте"}, {"left": 1004, "view": "enter", "theme": "dark", "caption": "Enter: задача встала в список, под ней уже новое пустое поле"}, {"left": 1474, "view": "closed", "theme": "dark", "caption": "Enter на пустом поле или тап мимо — ввод закончен"}] };
  }
}
</script>
</body>
</html>
