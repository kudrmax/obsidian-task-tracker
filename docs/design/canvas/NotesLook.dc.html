    };

    const s = styles[look];
    const above = ['Созвониться с врачом', 'Записаться в барбершоп', 'Чай масала', 'Позвонить в банк', 'Оплатить интернет', 'Забрать посылку', 'Выбрать подарок маме', 'Сдать отчёт'];
    const editing = place === 'edit';
    const rows = editing
      ? [...above.map((title) => ({ title, plain: true, field: false, desc: false })), { title: '', plain: false, field: true, desc: false }]
      : [...above.slice(0, 4).map((title) => ({ title, plain: true, field: false, desc: false })), { title: 'Купить билеты в Белград', plain: true, field: false, desc: true }, ...above.slice(4).map((title) => ({ title, plain: true, field: false, desc: false }))];
    const list = {
      rows,
      justify: editing ? 'flex-end' : 'flex-start',
      boxH: editing ? 484 - 166 : 494,
      coverH: editing ? 334 : 494
    };

    const edit = editing
      ? { on: true, panel: look === 'panel', inside: look !== 'panel', items: notes(s, true), ink: s.ink, font: s.font, gapTop: s.gapTop, padBottom: look === 'panel' ? 8.5 : 9 }
      : { on: false, panel: false, inside: false, items: [] };

    const band = '8px solid transparent';
    const tile = (label, d, ink, fd, fillAll) => ({ label, d, ink: ink ?? c.text, fd: fd ?? '', fillAll: fillAll ?? 'none' });
    const groups = [
      { rows: [[tile('Done', CIRCLE, null, CIRCLE), tile('In progress', CIRCLE, null, 'M12 3a9 9 0 0 1 0 18z'), tile('Won’t do', CIRCLE + ' M8 12h8')]] },
      { rows: [[tile('p1', icons.priority, c.p1, '', 'currentColor'), tile('p2', icons.priority, c.p2, '', 'currentColor')]] },
      { rows: [[tile('Tomorrow', icons.tomorrow, c.accent), tile('Pick a date', icons.calendar, c.accent), tile('Repeat', icons.repeat, c.accent)]] },
      { small: true, rows: [[tile('Rename', icons.rename), tile('Notes', icons.description), tile('Project', icons.project)]] },
      { small: true, rows: [[tile('First step', icons.firstStep), tile('Subtask', icons.subtask)], [tile('Open full screen', icons.fullScreen), tile('Open in Obsidian', icons.openFile)]] }
    ].map((g, i) => ({ ...g, band: i === 0 ? '0' : band, h: g.small ? 52 : 66, icon: g.small ? 18 : 22, fs: g.small ? 12 : 13, gap: g.small ? 4 : 6 }));
    const groupH = groups.reduce((sum, g, i) => sum + (i === 0 ? 0 : 8) + 16 + g.rows.length * g.h + (g.rows.length - 1) * 6, 0);
    const panelH = groupH + 8 + 44;
    const WINDOW_BOTTOM = 776 - 10;
    const panelTop = WINDOW_BOTTOM - panelH;
    const items = notes(s, false);
    const notesH = items.length * s.lh;
    const copyH = look === 'panel' ? 35 : 8.5 + 18 + s.gapTop + notesH + 9;
    const copyBottom = 844 - (panelTop - 12);
    const menu = place === 'menu'
      ? {
          on: true,
          peek: look === 'panel',
          inside: look !== 'panel',
          items, ink: s.ink, font: s.font, gapTop: s.gapTop,
          panelTop,
          copyBottom,
          copyW: look === 'panel' ? 'auto' : '300px',
          padBottom: look === 'panel' ? 8.5 : 9,
          peekBottom: copyBottom + copyH + 10
        }
      : { on: false, items: [] };

    const fs = fullStyles[look];
    const full = place === 'full'
      ? { on: true, items: notes(fs, true), ink: fs.ink, font: fs.font, gapTop: fs.gapTop }
      : { on: false, items: [] };

    const marksOn = this.props.marks !== false;

    return {
      c, md, icons,
      theme: light ? 'light' : 'dark',
      list, edit, menu, full, groups,
      keyboard: place !== 'menu',
      returnMark: marksOn ? '2px dashed ' + c.mark : 'none',
      barButtons: [
        { d: icons.priority, ink: c.text },
        { d: icons.project, ink: c.text },
        { d: icons.repeat, ink: c.text },
        { d: icons.description, ink: c.accent }
      ],
      letterRows: [
        ['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х'],
        ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э']
      ],
      row3: ['я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю']
    };
  }
}
</script>
</body>
