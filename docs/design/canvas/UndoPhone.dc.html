<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отмена на телефоне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<dc-import name="Screen" theme="{{theme}}" right-mode="calendar" layout="bottom" task-shape="capsule" task-height="35" stack-gap="2" hint-size="390px,844px"></dc-import>
<button aria-label="New task" style="position: absolute; left: 330px; top: 722px; width: 44px; height: 44px; border: 0; padding: 0; border-radius: 22px; background: {{c.accent}}; box-shadow: {{c.plusShadow}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; z-index: 7;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>

<sc-if value="{{isBar}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 16px; top: 656px; width: 358px; height: 56px; z-index: 8;"><dc-import name="UndoToast" state="{{state}}" shape="bar" width="358" theme="{{theme}}" hint-size="358px,56px"></dc-import></div>
</sc-if>

<sc-if value="{{isButton}}" hint-placeholder-val="{{false}}">
<button aria-label="Undo" style="position: absolute; left: 16px; top: 722px; width: 44px; height: 44px; border: 0; padding: 0; border-radius: 22px; background: {{c.track}}; box-shadow: {{btnRing}}; color: {{btnInk}}; display: flex; align-items: center; justify-content: center; z-index: 7;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
<div style="position: absolute; left: 16px; top: 656px; width: 300px; height: 56px; z-index: 8;"><dc-import name="UndoToast" state="{{state}}" shape="bubble" width="300" theme="{{theme}}" hint-size="300px,56px"></dc-import></div>
</sc-if>

<sc-if value="{{isTop}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 16px; top: 98px; width: 358px; height: 52px; z-index: 8;"><dc-import name="UndoToast" state="{{state}}" shape="pill" width="358" theme="{{theme}}" hint-size="358px,52px"></dc-import></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","default":"bar","options":["bar","button","top"]},"state":{"editor":"enum","default":"done","options":["done","delete","undone","conflict"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const look = this.props.look ?? 'bar';
    const state = this.props.state ?? 'done';
    const light = this.props.theme === 'light';
    const c = light
      ? { bg: '#FFFFFF', text: '#000000', accent: '#8A5CF5', track: '#F2F2F2', off: '#A1A4AB', plusShadow: '0 6px 16px rgba(138,92,245,0.35)' }
      : { bg: '#000000', text: '#FFFFFF', accent: '#9580FF', track: '#1C1C1E', off: '#5A5A5E', plusShadow: '0 6px 16px rgba(0,0,0,0.55)' };
    const conflict = state === 'conflict';
    return {
      c,
      state,
      theme: light ? 'light' : 'dark',
      isBar: look === 'bar',
      isButton: look === 'button',
      isTop: look === 'top',
      btnInk: conflict ? c.off : c.text,
      btnRing: conflict ? 'none' : 'inset 0 0 0 1.5px ' + c.accent
    };
  }
}
</script>
</body>
</html>
