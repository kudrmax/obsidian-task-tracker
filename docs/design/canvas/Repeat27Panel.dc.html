<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Панель повтора: компонент</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 300px; box-sizing: border-box; border-radius: 14px; overflow: hidden; background: {{c.panel}}; box-shadow: {{c.shadow}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">

<sc-if value="{{all}}" hint-placeholder-val="{{true}}">
<div style="padding: {{pad}}; display: flex; flex-direction: column; gap: 8px;">
<div role="group" aria-label="Repeat kind" style="height: 32px; box-sizing: border-box; padding: 2px; border-radius: 16px; background: {{c.tile}}; display: flex;">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
<button style="flex: 1; min-width: 0; height: 28px; border: 0; border-radius: 14px; padding: 0; background: {{k.bg}}; color: {{k.ink}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap;">{{k.label}}</button>
</sc-for>
</div>
<div style="height: 32px; padding: 0 0 0 8px; display: flex; align-items: center; gap: 4px; font-size: 16px;">
<span style="flex: 1;">Every</span>
<button aria-label="Fewer" style="width: 32px; height: 32px; border: 0; padding: 0; border-radius: 16px; background: transparent; color: {{c.minusInk}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span style="min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums;">{{n}}</span>
<button aria-label="More" style="width: 32px; height: 32px; border: 0; padding: 0; border-radius: 16px; background: transparent; color: {{c.accentUi}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></button>
</div>
<div role="group" aria-label="Unit" style="height: 32px; box-sizing: border-box; padding: 2px; border-radius: 16px; background: {{c.tile}}; display: flex;">
<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<button style="flex: 1; min-width: 0; height: 28px; border: 0; border-radius: 14px; padding: 0; background: {{u.bg}}; color: {{u.ink}}; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap;">{{u.label}}</button>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between;">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button aria-pressed="{{d.pressed}}" style="width: 36px; height: 36px; border: 0; padding: 0; border-radius: 18px; background: {{d.bg}}; color: {{d.ink}}; font: inherit; font-size: 13px; font-weight: {{d.weight}};">{{d.label}}</button>
</sc-for>
</div>
<sc-if value="{{set}}" hint-placeholder-val="{{true}}">
<button style="height: 44px; box-sizing: border-box; margin-top: -2px; padding: 0 8px; border: 0; border-top: 0.5px solid {{c.sep}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1;">Remove repeat</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z M9 9l6 6 M15 9l-6 6"></path></svg></button>
</sc-if>
</div>
</sc-if>

<sc-if value="{{list}}" hint-placeholder-val="{{false}}">
<div>
<sc-for list="{{presets}}" as="r" hint-placeholder-count="4">
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-bottom: {{r.sep}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1; min-width: 0; white-space: nowrap;">{{r.label}}</span><span style="font-size: 15px; color: {{c.muted}}; white-space: nowrap;">{{r.value}}</span></button>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}};">
<sc-for list="{{more}}" as="r" hint-placeholder-count="2">
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-bottom: {{r.sep}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1; min-width: 0; white-space: nowrap;">{{r.label}}</span></button>
</sc-for>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"all","options":["all","list"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"set":{"editor":"boolean","default":true},"$preview":{"width":300,"height":272}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.theme === 'light';
    const set = this.props.set !== false && this.props.set !== 'false';
    const c = light
      ? { panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', text: '#000000', muted: '#8E8E93', tile: 'rgba(0,0,0,0.05)', strong: '#1C1C1E', onStrong: '#FFFFFF', accentUi: '#8A5CF5', dim: '#C7C7CC', sep: '#D1D1D6', gap: '#E5E5EA' }
      : { panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', text: '#FFFFFF', muted: '#8E8E93', tile: 'rgba(255,255,255,0.08)', strong: '#E5E5EA', onStrong: '#000000', accentUi: '#8A6CEF', dim: '#636366', sep: '#48484A', gap: '#1C1C1E' };
    const n = 1;
    c.minusInk = n > 1 ? c.accentUi : c.dim;
    const seg = (labels, on) => labels.map((label) => ({ label, bg: label === on ? c.strong : 'transparent', ink: label === on ? c.onStrong : c.text }));
    const chosen = ['Mon', 'Wed', 'Fri'];
    const week = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((label) => {
      const on = chosen.includes(label);
      return { label, pressed: on ? 'true' : 'false', bg: on ? c.accentUi : 'transparent', ink: on ? '#FFFFFF' : c.text, weight: on ? 700 : 500 };
    });
    const sepped = (rows) => rows.map((r, i, a) => ({ value: '', ...r, sep: i < a.length - 1 ? '0.5px solid ' + c.sep : '0' }));
    return {
      c,
      all: (this.props.variant ?? 'all') === 'all',
      list: this.props.variant === 'list',
      set,
      pad: set ? '8px 8px 0' : '8px',
      n,
      kinds: seg(['Schedule', 'After done'], 'Schedule'),
      units: seg(['days', 'weeks', 'months'], 'weeks'),
      week,
      presets: sepped([
        { label: 'Every day' },
        { label: 'Every weekday', value: 'Mon to Fri' },
        { label: 'Every week', value: 'on Wed' },
        { label: 'Every month', value: 'on the 4th' }
      ]),
      more: sepped([{ label: 'After done…' }, { label: 'Custom…' }])
    };
  }
}
</script>
</body>
</html>
