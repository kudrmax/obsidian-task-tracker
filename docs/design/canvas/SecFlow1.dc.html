<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>1. Секции в списке</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1928px; height: 1076px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">1. Секции в списке</div>
<div style="position: absolute; left: 64px; top: 100px; width: 1800px; font-size: 18px; line-height: 24px; color: #6B6A65;">Пока секций нет, список ровно как сейчас. Появилась секция — у каждой группы с задачами свой заголовок, включая «No section». Жёлтой пунктирной рамкой обведено то, что новое</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="position: absolute; left: {{p.left}}px; top: 168px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="SecFinal" view="{{p.view}}" theme="dark" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1026px; width: 390px; font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1928,"height":1076}}'>
class Component extends DCLogic {
  renderVals() {
    const at = (i) => 64 + i * 470;
    return {
      phones: [
        { left: at(0), view: 'plain', caption: 'Секций нет: заголовков нет' },
        { left: at(1), view: 'list', caption: 'No section сверху, за ней Morning и Экскурсия' },
        { left: at(2), view: 'moved', caption: 'No section переставлена вниз' },
        { left: at(3), view: 'single', caption: 'Все задачи в одной секции: её заголовок есть' }
      ]
    };
  }
}
</script>
</body>
</html>
