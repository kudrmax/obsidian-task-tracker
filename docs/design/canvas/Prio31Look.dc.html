<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Цвет приоритета в настройках — два варианта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1948px; height: 1400px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 36px; width: 1820px; display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 64px; line-height: 76px; font-weight: 700; color: #1C1C1E;">Цвет приоритета в настройках — два варианта</div>
<div style="font-size: 20px; line-height: 26px; color: #6B6A65;">p1 красный, p2 оранжевый, p3 — свой цвет. Последний кружок открывает выбор любого цвета, под ним поле с кодом цвета</div>
</div>
<sc-for list="{{heads}}" as="h" hint-placeholder-count="2">
<div style="position: absolute; left: {{h.left}}px; top: 210px; width: 820px; display: flex; flex-direction: column; gap: 8px;">
<div style="font-size: 40px; line-height: 48px; font-weight: 700; color: #1C1C1E;">{{h.title}}</div>
<div style="font-size: 18px; line-height: 24px; color: #6B6A65;">{{h.sub}}</div>
</div>
</sc-for>
<sc-for list="{{frames}}" as="p" hint-placeholder-count="4">
<div style="position: absolute; left: {{p.left}}px; top: 380px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="Prio31Settings" look="{{p.look}}" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1240px; width: 390px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</span>
<span style="font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.cap}}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1948,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      heads: [
        { left: 64, title: 'Вариант 1 — кружок как карточка', sub: 'Кружок залит тем же оттенком, что карточка задачи, и обведён цветом уровня — как выбранный приоритет в меню задачи' },
        { left: 984, title: 'Вариант 2 — карточка под кружками', sub: 'Кружки чистого цвета, как сейчас. Под ними маленькая карточка задачи в выбранном цвете: фон, точка «в процессе» и время' }
      ],
      frames: [
        { look: 'tint', theme: 'dark', left: 64, name: 'Тёмная', cap: 'Кружок того же цвета, что карточка на экране' },
        { look: 'tint', theme: 'light', left: 494, name: 'Светлая', cap: 'То же в светлой теме' },
        { look: 'card', theme: 'dark', left: 984, name: 'Тёмная', cap: 'Карточка показывает, как задача выглядит на экране' },
        { look: 'card', theme: 'light', left: 1414, name: 'Светлая', cap: 'То же в светлой теме' }
      ]
    };
  }
}
</script>
</body>
</html>
