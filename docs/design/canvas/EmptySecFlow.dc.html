<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пустая секция</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1928px; height: 1076px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">Пустая секция</div>
<div style="position: absolute; left: 64px; top: 100px; width: 1800px; font-size: 18px; line-height: 24px; color: #6B6A65;">Секция без задач держится, пока из неё не унесли последнюю. Под заголовком — плашка «No tasks»: пунктир, фон экрана. Задачу бросают прямо на плашку — она загорается, как место для броска. Жёлтым обведено новое</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="4">
<div style="position: absolute; left: {{p.left}}px; top: 168px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="EmptySec" view="{{p.view}}" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1026px; width: 390px; font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1928,"height":1076}}'>
class Component extends DCLogic {
  renderVals() {
    const at = (i) => 64 + i * 470;
    return {
      phones: [
        { left: at(0), view: 'empty', theme: 'dark', caption: 'Пустая секция Evening' },
        { left: at(1), view: 'empty', theme: 'light', caption: 'То же, светлая тема' },
        { left: at(2), view: 'drop', theme: 'dark', caption: 'Задачу несут на плашку' },
        { left: at(3), view: 'drop', theme: 'light', caption: 'То же, светлая тема' }
      ]
    };
  }
}
</script>
</body>
</html>
