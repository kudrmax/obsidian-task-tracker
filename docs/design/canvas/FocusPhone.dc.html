      openFile: 'M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
      rename: 'M4 20h4L19 9l-4-4L4 16z M13.5 6.5l4 4',
      repeat: 'M17 2l3 3-3 3 M4 11V9a4 4 0 0 1 4-4h12 M7 22l-3-3 3-3 M20 13v2a4 4 0 0 1-4 4H4',
      subtask: 'M5 4v8a4 4 0 0 0 4 4h11 M16 12l4 4-4 4',
      del: 'M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13'
    };
    const STEP = 37, CARD = 35, INDENT = 20;
    const branchesFor = (rows, x0) => {
      let d = '';
      rows.forEach((r, i) => {
        const kids = [];
        for (let k = i + 1; k < rows.length && rows[k].level > r.level; k++) if (rows[k].level === r.level + 1) kids.push(k);
        if (!kids.length) return;
        const x = x0 + r.level * INDENT + INDENT / 2;
        const mid = (j) => j * STEP + CARD / 2;
        const last = mid(kids[kids.length - 1]);
        d += 'M' + x + ' ' + mid(i) + 'V' + (last - 6) + 'Q' + x + ' ' + last + ' ' + (x + 6) + ' ' + last + 'H' + (x + INDENT / 2);
        kids.slice(0, -1).forEach((k) => { d += 'M' + x + ' ' + mid(k) + 'H' + (x + INDENT / 2); });
      });
      return d;
    };
    const metaOf = (t) => ({ hasSubs: !!t.count, desc: !!t.desc, meta: !!t.count || !!t.desc, iconSize: t.count ? 11 : 13 });

    const mainTasks = [
      { title: 'Собраться утром', level: 0, count: '0/5', desc: true },
      { title: 'Собрать рюкзак', level: 1, count: '0/3', desc: true },
      { title: 'Ноутбук и зарядка', level: 2 },
      { title: 'Пропуск в офис', level: 2 },
      { title: 'Наушники', level: 2 },
      { title: 'Умыться и побриться', level: 1 },
      { title: 'Душ', level: 1 },
      { title: 'Погладить рубашку', level: 1 },
      { title: 'Выпить витамины', level: 1 },
      { title: 'Оплатить интернет', level: 0, desc: true },
      { title: 'Позвонить маме', level: 0 },
      { title: 'Забрать посылку', level: 0 }
    ];
    const list = {
      rows: mainTasks.map((t, i) => ({ ...t, ...metaOf(t), left: 10 + t.level * INDENT, w: 175 - t.level * INDENT, top: i * STEP })),
      branches: branchesFor(mainTasks, 0)
    };

    const isSub = view === 'sub';
    const ticked = view === 'ticked' || view === 'typing' || view === 'submenu';
    const morning = [
      { title: 'Собрать рюкзак', level: 0, count: ticked ? '1/3' : '0/3', desc: true },
      { title: 'Ноутбук и зарядка', level: 1, done: ticked },
      { title: 'Пропуск в офис', level: 1 },
      { title: 'Наушники', level: 1 },
      { title: 'Умыться и побриться', level: 0, done: ticked },
      { title: 'Душ', level: 0, done: ticked },
      { title: 'Погладить рубашку', level: 0 },
      { title: 'Выпить витамины', level: 0 }
    ];
    const backpack = [
      { title: 'Ноутбук и зарядка', level: 0, done: true },
      { title: 'Пропуск в офис', level: 0, done: true },
      { title: 'Наушники', level: 0 },
      { title: 'Ключи от велосипеда', level: 0 }
    ];
    const subs = isSub ? backpack : morning;
    const frows = subs.map((t, i) => ({
      ...t, ...metaOf(t),
      done: !!t.done,
      left: t.level * INDENT, w: 350 - t.level * INDENT, top: i * STEP,
      ring: t.done ? '0' : '1.5px solid ' + c.muted,
      dot: t.done ? c.accent : 'transparent',
      ink: t.done ? c.muted : c.text,
      deco: t.done ? 'line-through' : 'none',
      aria: t.done ? 'Mark ' + t.title + ' as open' : 'Mark ' + t.title + ' as done'
    }));
    const link = { color: md.link, deco: 'underline' };
    const part = (t, style) => ({ t, color: md.text, deco: 'none', ...(style ?? {}) });
    const item = (level, parts, cursor) => ({ pad: level * 24, guides: Array.from({ length: level }, (_, k) => ({ x: k * 24 + 12 })), parts, cursor: !!cursor });
    const typing = view === 'typing';
    const morningDesc = [
      item(0, [part('Выйти не позже 8:40')]),
      item(0, [part('Если опаздываю — '), part('такси', link)]),
      item(0, [part('Зонт, если по '), part('прогнозу', link), part(' дождь')]),
      item(0, [part('В пятницу без рубашки, дресс-код свободный')]),
      ...(typing ? [item(0, [part('Проверить, заряжены ли наушники')], true)] : [])
    ];
    const backpackDesc = [
      item(0, [part('Рюкзак висит в шкафу у двери')]),
      item(0, [part('Зарядку брать короткую, длинная остаётся дома')])
    ];
    const listH = frows.length * STEP - 2;
    const focus = {
      title: isSub ? 'Собрать рюкзак' : 'Собраться утром',
      parent: 'Собраться утром',
      hasParent: isSub,
      rows: frows,
      branches: branchesFor(subs, 0),
      listH,
      desc: isSub ? backpackDesc : morningDesc,
      typing,
      foot: !typing,
      clipH: typing ? 402 : 678,
      shift: typing ? -146 : 8
    };

    const menuOn = view === 'menu' || view === 'submenu';
    const menu = !menuOn ? { on: false } : view === 'menu'
      ? { on: true, left: 10, top: 166, cardW: 175, pad: '0 10px 0 14px', gap: 6, circle: false, title: 'Собраться утром', count: '0/5', panelTop: 213 }
      : { on: true, left: 20, top: 146, cardW: 350, pad: '0 10px 0 9px', gap: 8, circle: true, title: 'Собрать рюкзак', count: '1/3', panelTop: 193 };
    const editRows = [
      { label: 'Rename', d: icons.rename },
      { label: 'Repeat', d: icons.repeat, value: view === 'menu' ? 'Every day' : '' },
      { label: 'Add subtask', d: icons.subtask }
    ].map((r, i, a) => ({ ...r, hasValue: !!r.value, sep: i < a.length - 1 ? '0.5px solid ' + c.sep : '0' }));

    const marks = [];
    const ring = (left, top, width, height, radius, tag, tagPos) => ({ left: left - 4, top: top - 4, width: width + 8, height: height + 8, radius: radius + 4, tag, tagPos });
    const pos = (left, top) => 'left: ' + left + 'px; top: ' + top + 'px;';
    const rpos = (right, top) => 'right: ' + right + 'px; top: ' + top + 'px;';
    const fullRowTop = (m) => m.panelTop + 82 + 90 + 90 + 8 + 132 + 8;
    if (view === 'menu') marks.push(ring(10, fullRowTop(menu), 300, 52, 0, '← Новая строка', pos(160, fullRowTop(menu) + 16)));
    if (view === 'submenu') marks.push(ring(20, fullRowTop(menu), 300, 52, 0, '← И у подзадачи', pos(170, fullRowTop(menu) + 16)));
    if (view === 'focus') {
      marks.push(ring(20, 106 + 28 + 12, 350, listH, 17.5, '↑ Подзадачи с кружками', rpos(16, 106 + 28 + 12 + listH + 8)));
      marks.push(ring(16, 722, 80, 44, 22, '↓ ⋯ — меню задачи', pos(12, 692)));
      marks.push(ring(330, 722, 44, 44, 22, '↓ Подзадача', rpos(10, 692)));
    }
    if (view === 'ticked') marks.push(ring(29, 106 + 28 + 12 + 4 * STEP + 8.5, 18, 18 + 2 * STEP, 9, '← Вычеркнул', pos(150, 106 + 28 + 12 + 4 * STEP + 26)));
    if (view === 'typing') marks.push(ring(14, 98 + 8 - 146 + 28 + 12 + listH + 20 + 4 * 24, 356, 24, 6, '↑ Пишу прямо здесь', rpos(16, 98 + 8 - 146 + 28 + 12 + listH + 20 + 5 * 24 + 10)));
    if (view === 'sub') marks.push(ring(20, 106, 150, 20, 6, '← Назад к задаче', pos(180, 106)));

    return {
      c, md, icons, list, focus, menu, editRows,
      theme: light ? 'light' : 'dark',
      onMain: view === 'menu',
      onFocus: view !== 'menu',
      statusTiles: [
        { label: 'Done', d: CIRCLE, fd: CIRCLE },
        { label: 'In progress', d: CIRCLE, fd: 'M12 3a9 9 0 0 1 0 18z' },
        { label: 'Won’t do', d: CIRCLE + ' M8 12h8', fd: '' }
      ],
      levels: [{ name: 'p1', c: c.p1 }, { name: 'p2', c: c.p2 }, { name: 'p3', c: c.p3 }],
      moveTiles: [
        { label: 'Tomorrow', d: 'M4 12h13 M12 6l6 6-6 6 M20.5 5v14' },
        { label: 'Pick a date', d: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5' }
      ],
      letterRows: [
        ['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х'],
        ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э']
      ],
      row3: ['я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю'],
      marks: this.props.marks === false || this.props.marks === 'false' ? [] : marks
    };
  }
}
</script>
