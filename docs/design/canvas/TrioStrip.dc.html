<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лента из трёх колонок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0E0E10}
</style>
</helmet>
<div style="width: 820px; box-sizing: border-box; padding: 40px; background: #0E0E10; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 48px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 18px;">
<header style="display: flex; align-items: center; justify-content: space-between;">
<h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700;">{{r.title}}</h2>
<div style="position: relative; height: 32px; box-sizing: border-box; padding: 2px; border-radius: 16px; background: #1C1C1E; display: flex;">
<span style="position: absolute; top: 2px; left: {{r.pillLeft}}px; width: 76px; height: 28px; border-radius: 14px; background: #E5E5EA;"></span>
<sc-for list="{{r.chips}}" as="o" hint-placeholder-count="3">
<span style="position: relative; width: 38px; height: 28px; color: {{o.color}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.path}}"></path></svg></span>
</sc-for>
</div>
</header>
<div style="position: relative; height: 300px;">
<sc-for list="{{r.panels}}" as="c" hint-placeholder-count="3">
<div style="position: absolute; top: 10px; left: {{c.left}}px; width: 220px; height: 280px; box-sizing: border-box; padding: 14px 12px; border-radius: 14px; background: #000000; opacity: {{c.opacity}}; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: center; gap: 8px; color: #E5E5EA;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.path}}"></path></svg><span style="font-size: 15px; font-weight: 600;">{{c.name}}</span></div>
<sc-if value="{{c.isList}}" hint-placeholder-val="{{true}}">
<sc-for list="{{c.cards}}" as="t" hint-placeholder-count="5">
<div style="position: relative; overflow: hidden; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; background: #1C1C1E; padding: 0 10px; display: flex; align-items: center; font-size: 13px; white-space: nowrap;">{{t}}</div>
</sc-for>
</sc-if>
<sc-if value="{{c.isCal}}" hint-placeholder-val="{{false}}">
<div style="position: relative; flex: 1;">
<sc-for list="{{c.blocks}}" as="b" hint-placeholder-count="5">
<div style="position: absolute; left: 0; right: 0; top: {{b.top}}px; height: {{b.h}}px; border-radius: 6px; background: {{b.bg}}; box-shadow: {{b.ring}}; border-left: 3px solid {{b.bar}}; box-sizing: border-box; padding: 3px 7px; font-size: 11px; font-weight: 600; color: {{b.text}}; overflow: hidden; white-space: nowrap;">{{b.title}}</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<div style="position: absolute; top: 0; left: {{r.frameLeft}}px; width: 476px; height: 300px; box-sizing: border-box; border-radius: 22px; border: 2px solid #9580FF; pointer-events: none;"></div>
<span style="position: absolute; top: -11px; left: {{r.labelLeft}}px; padding: 2px 8px; border-radius: 8px; background: #9580FF; color: #000000; font-size: 12px; font-weight: 700;">Экран</span>
<div style="position: absolute; top: 10px; height: 280px; left: {{r.divLeft}}px; width: 16px; display: flex; justify-content: center;">
<div style="width: 1px; height: 100%; background: #48484A;"></div>
<sc-if value="{{r.handle}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 114px; left: 3px; width: 10px; height: 52px; border-radius: 5px; background: #8E8E93;"></span>
</sc-if>
</div>
</div>
<div style="display: flex; gap: 12px;">
<sc-for list="{{r.facts}}" as="f" hint-placeholder-count="2">
<div style="flex: 1; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #1C1C1E; display: flex; align-items: flex-start; gap: 10px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9580FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px;"><path d="{{f.path}}"></path></svg>
<span style="font-size: 14px; line-height: 19px; color: #E5E5EA;">{{f.text}}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":970}}'>
class Component extends DCLogic {
  renderVals() {
    const paths = {
      soon: 'M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5 M5.5 5h13l2 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-5.5z',
      now: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4',
      cal: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5',
      lock: 'M7 11V8a5 5 0 0 1 10 0v3 M5.5 11h13v9.5h-13z',
      resize: 'M4 12h16 M8 8l-4 4 4 4 M16 8l4 4-4 4'
    };
    const COL = 236;
    const blocks = [
      { title: '1:1 с Костей', top: 6, h: 40, bg: 'rgba(10,132,255,0.24)', bar: '#0A84FF', text: '#8CC6FF', ring: 'none' },
      { title: 'Написать отчёт', top: 52, h: 40, bg: '#1C1C1E', bar: '#8A6CEF', text: '#FFFFFF', ring: 'inset 0 0 0 1px #3A3A3C' },
      { title: 'Обед с Вадимом', top: 104, h: 36, bg: 'rgba(255,159,10,0.22)', bar: '#FF9F0A', text: '#FFC56B', ring: 'none' },
      { title: 'Разобрать почту', top: 150, h: 34, bg: '#1C1C1E', bar: '#3A3A3C', text: '#FFFFFF', ring: 'inset 0 0 0 1px #3A3A3C' },
      { title: 'Тренировка', top: 196, h: 36, bg: 'rgba(48,209,88,0.22)', bar: '#30D158', text: '#86E3A0', ring: 'none' }
    ];
    const panelsFor = (visible) => [
      { name: 'Soon', path: paths.soon, isList: true, isCal: false, cards: ['Продлить страховку', 'Купить подарок Ане', 'Разобрать фото', 'Починить велосипед', 'Прочитать Deep Work'] },
      { name: 'Now', path: paths.now, isList: true, isCal: false, cards: ['Созвониться с врачом', 'Купить билеты', 'Сдать декларацию', 'Записаться в барбершоп', 'Позвонить маме'] },
      { name: 'Календарь', path: paths.cal, isList: false, isCal: true, blocks }
    ].map((c, i) => ({ ...c, left: 8 + i * COL, opacity: visible.includes(i) ? 1 : 0.28 }));
    const chipsFor = (first) => ['soon', 'now', 'cal'].map((key, i) => ({ path: paths[key], color: i === first || i === first + 1 ? '#000000' : '#8E8E93' }));
    return {
      rows: [
        {
          title: 'Soon и Now',
          pillLeft: 2,
          chips: chipsFor(0),
          panels: panelsFor([0, 1]),
          frameLeft: 0,
          labelLeft: 20,
          divLeft: 8 + 220 + 0,
          handle: false,
          facts: [
            { path: paths.lock, text: 'Разделитель стоит ровно по центру, тянуть нельзя' },
            { path: paths.cal, text: 'Календарь ждёт справа за краем экрана' }
          ]
        },
        {
          title: 'Now и Календарь',
          pillLeft: 40,
          chips: chipsFor(1),
          panels: panelsFor([1, 2]),
          frameLeft: COL,
          labelLeft: COL + 20,
          divLeft: 8 + COL + 220,
          handle: true,
          facts: [
            { path: paths.resize, text: 'Разделитель тянется, ширина запоминается' },
            { path: paths.soon, text: 'Soon уехал влево за край экрана' }
          ]
        }
      ]
    };
  }
}
</script>
</body>
</html>
