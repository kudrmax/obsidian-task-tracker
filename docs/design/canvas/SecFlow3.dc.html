<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>3. Задачи и секции перетаскиванием</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1458px; height: 1076px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">3. Задачи и секции перетаскиванием</div>
<div style="position: absolute; left: 64px; top: 100px; width: 1330px; font-size: 18px; line-height: 24px; color: #6B6A65;">Задачу бросают в зазор нужной секции. Секцию поднимают долгим нажатием на заголовок: её задачи схлопываются под ним, цель — промежуток между группами</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="3">
<div style="position: absolute; left: {{p.left}}px; top: 168px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="SecFinal" view="{{p.view}}" theme="dark" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1026px; width: 390px; font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1458,"height":1076}}'>
class Component extends DCLogic {
  renderVals() {
    const at = (i) => 64 + i * 470;
    return {
      phones: [
        { left: at(0), view: 'gapInto', caption: 'Задачу кладут в Экскурсию: зазор раскрылся' },
        { left: at(1), view: 'lift', caption: 'Morning подняли и несут в конец списка' },
        { left: at(2), view: 'dragInbox', caption: 'Inbox и Soon: зоны под обеими колонками' }
      ]
    };
  }
}
</script>
</body>
</html>
