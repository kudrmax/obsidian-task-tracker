<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Экран: перетаскивание задачи</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
</style>
</helmet>
<dc-import name="Screen" list-width="{{listWidth}}" dragging="{{dragging}}" hint-size="390px,844px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { listWidth: 187, dragging: true };
  }
}
</script>
</body>
</html>
