<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подтверждение на десктопе</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 800px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 15px;">

<div style="position: absolute; left: 0; top: 0; width: 44px; height: 800px; background: {{c.chrome}}; box-shadow: inset -1px 0 0 {{c.chromeLine}};"></div>
<div style="position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; flex-direction: column;">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57;"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E;"></span>
<span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840;"></span>
</div>
<div style="position: absolute; left: 44px; top: 0; width: 1156px; height: 40px; background: {{c.bg}}; box-shadow: inset 0 -1px 0 {{c.chromeLine}}; display: flex; align-items: center; padding-left: 72px; box-sizing: border-box; font-size: 13px;">Task Calendar</div>

<div style="position: absolute; left: 64px; top: 58px; font-size: 28px; line-height: 34px; font-weight: 700;">Now</div>
<div style="position: absolute; left: 470px; top: 58px; display: flex; align-items: center; gap: 12px; font-size: 28px; line-height: 34px; font-weight: 700;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>Today<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg>
</div>
<div style="position: absolute; left: 431px; top: 104px; width: 2px; height: 672px; border-radius: 1px; background: {{c.line}};"></div>
<sc-for list="{{hours}}" as="h" hint-placeholder-count="12">
<div style="position: absolute; left: 448px; top: {{h.top}}px; width: 40px; font-size: 12px; line-height: 14px; font-weight: 500; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{h.label}}</div>
<div style="position: absolute; left: 492px; top: {{h.line}}px; width: 698px; height: 1px; background: {{c.hourLine}};"></div>
</sc-for>
<sc-for list="{{events}}" as="ev" hint-placeholder-count="3">
<div style="position: absolute; left: 496px; top: {{ev.top}}px; width: 690px; height: {{ev.height}}px; box-sizing: border-box; border-radius: 6px; overflow: hidden; background: {{ev.bg}}; color: {{ev.ink}}; display: flex; font-size: 13px; line-height: 16px; font-weight: 600;"><span style="width: 3px; flex-shrink: 0; background: {{ev.bar}};"></span><span style="padding: 4px 8px;">{{ev.title}}</span></div>
</sc-for>
<div style="position: absolute; left: 448px; top: {{nowTop}}px; width: 742px; height: 2px; background: {{c.now}};"></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="position: absolute; left: 54px; top: {{r.top}}px; width: 360px; height: 35px; box-sizing: border-box; overflow: hidden; background: {{c.card}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center;">
<sc-if value="{{r.progress}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: {{c.accent}};"></span></sc-if>
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;">{{r.title}}</div>
</div>
</sc-for>
<div style="position: absolute; right: 0; bottom: 0; height: 24px; box-sizing: border-box; padding: 0 12px; border-top-left-radius: 6px; background: {{c.chrome}}; box-shadow: inset 1px 1px 0 {{c.chromeLine}}; display: flex; align-items: center; gap: 16px; font-size: 12px; color: {{c.muted}};"><span>0 backlinks</span><span>14 words</span><span>112 characters</span></div>

<sc-if value="{{lifted}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; inset: 0; background: {{c.backdrop}}; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10;"></div>

<div style="position: absolute; left: 54px; top: 104px; width: 360px; height: 35px; box-sizing: border-box; background: {{c.card}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; z-index: 11;">
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;">Купить билеты в Белград</div>
</div>

</sc-if>

<sc-if value="{{onMenu}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 54px; top: 151px; width: 300px; z-index: 11;"><dc-import name="ConfirmMenu" variant="{{variant}}" action="{{action}}" theme="{{theme}}" pop-right="1190" hint-size="300px,600px"></dc-import></div>
</sc-if>

<sc-if value="{{onDialog}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 450px; top: 280px; width: 300px; box-sizing: border-box; padding: 20px 16px 16px; border-radius: 14px; background: {{c.panel}}; box-shadow: {{c.shadow}}; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 11;">
<span style="width: 44px; height: 44px; border-radius: 22px; background: {{dialog.iconBg}}; color: {{dialog.ink}}; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{dialog.icon}}"></path></svg></span>
<span style="margin-top: 12px; font-size: 16px; line-height: 21px; font-weight: 600;">{{dialog.question}}</span>
<span style="margin-top: 4px; max-width: 100%; font-size: 14px; line-height: 19px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Купить билеты в Белград</span>
<span style="margin-top: 2px; font-size: 13px; line-height: 18px; color: {{c.muted}};">{{dialog.hint}}</span>
<div style="margin-top: 16px; width: 100%; display: flex; gap: 8px;">
<button style="flex: 1; height: 36px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.text}}; font: inherit; font-size: 14px; font-weight: 500;">Cancel</button>
<button style="flex: 1; height: 36px; border: 0; border-radius: 10px; padding: 0; background: {{dialog.bg}}; color: {{dialog.onBg}}; font: inherit; font-size: 14px; font-weight: 600;">{{dialog.confirm}}</button>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"inline","options":["plain","menu","inline","popover","sheet"]},"action":{"editor":"enum","default":"delete","options":["delete","wontdo"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1200,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'inline';
    const action = this.props.action ?? 'delete';
    const light = this.props.theme === 'light';
    const c = light
      ? { bg: '#FFFFFF', chrome: '#F6F6F6', chromeLine: '#E3E3E3', card: '#F2F2F2', text: '#000000', strong: '#1C1C1E', onStrong: '#FFFFFF', muted: '#8E8E93', accent: '#8A5CF5', line: '#E5E5EA', hourLine: '#EFEFF4', now: '#FF3B30', backdrop: 'rgba(0,0,0,0.22)', panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', tile: 'rgba(0,0,0,0.05)', danger: '#FF3B30', dangerSoft: 'rgba(255,59,48,0.12)', neutralSoft: 'rgba(0,0,0,0.06)', ev: { bg: 'rgba(0,122,255,0.13)', ink: '#0058B8', bar: '#007AFF' }, ev2: { bg: 'rgba(52,199,89,0.16)', ink: '#1F7735', bar: '#34C759' } }
      : { bg: '#1E1E1E', chrome: '#262626', chromeLine: '#363636', card: '#373737', text: '#FFFFFF', strong: '#E5E5EA', onStrong: '#000000', muted: '#8E8E93', accent: '#9580FF', line: '#2C2C2E', hourLine: '#2A2A2A', now: '#D92C24', backdrop: 'rgba(0,0,0,0.55)', panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', tile: 'rgba(255,255,255,0.08)', danger: '#FF453A', dangerSoft: 'rgba(255,69,58,0.18)', neutralSoft: 'rgba(255,255,255,0.1)', ev: { bg: 'rgba(10,132,255,0.24)', ink: '#85C1FF', bar: '#0A84FF' }, ev2: { bg: 'rgba(48,209,88,0.22)', ink: '#97E8AC', bar: '#30D158' } };
    const del = action === 'delete';
    const titles = ['Купить билеты в Белград', 'Записаться в барбершоп', 'Позвонить маме', 'Чай масала', 'Разобрать почту', 'Оплатить интернет'];
    const rows = titles.map((title, i) => ({ title, top: 104 + i * 37, progress: i === 1 }));
    const HOUR = 56, FIRST = 9;
    const hours = [];
    for (let h = 0; h < 12; h++) hours.push({ label: String(FIRST + h).padStart(2, '0') + ':00', top: 104 + h * HOUR - 7, line: 104 + h * HOUR });
    const at = (hh) => 104 + (hh - FIRST) * HOUR + 1;
    const events = [
      { title: 'Стендап', top: at(10), height: HOUR / 2 - 2, ...c.ev },
      { title: 'Обед с Сашей', top: at(13), height: HOUR - 2, ...c.ev2 },
      { title: 'Ревью дизайна', top: at(16), height: HOUR * 1.5 - 2, ...c.ev }
    ];
    const CIRCLE = 'M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z';
    return {
      c,
      variant,
      action,
      theme: light ? 'light' : 'dark',
      rows,
      hours,
      events,
      nowTop: at(11.5),
      lifted: variant !== 'plain',
      onMenu: variant !== 'sheet' && variant !== 'plain',
      onDialog: variant === 'sheet',
      dialog: {
        question: del ? 'Delete this task?' : 'Mark as won’t do?',
        hint: del ? 'It leaves the tasks file' : 'It stays in the file, marked won’t do',
        confirm: del ? 'Delete' : 'Won’t do',
        icon: del ? 'M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13' : CIRCLE + ' M8 12h8',
        ink: del ? c.danger : c.text,
        iconBg: del ? c.dangerSoft : c.neutralSoft,
        bg: del ? c.danger : c.strong,
        onBg: del ? '#FFFFFF' : c.onStrong
      }
    };
  }
}
</script>
</body>
</html>
