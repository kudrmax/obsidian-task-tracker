<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>2. Завести секцию броском</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 2398px; height: 1076px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 52px; font-size: 34px; line-height: 40px; font-weight: 700; color: #1C1C1E;">2. Завести секцию броском</div>
<div style="position: absolute; left: 64px; top: 100px; width: 2270px; font-size: 18px; line-height: 24px; color: #6B6A65;">Пока карточка под пальцем, New task под каждым списком уступает место зонам: заготовки из настроек, которых в списке ещё нет, и New section. Под сегодняшним днём ниже — зоны дат, как в «Отложить #22»</div>
<sc-for list="{{arrows}}" as="a" hint-placeholder-count="3">
<svg width="64" height="8" viewBox="0 0 64 8" style="position: absolute; left: {{a.left}}px; top: 586px; width: 64px; height: 8px; overflow: visible; fill: none; stroke: #8A8378; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round" aria-hidden="true"><path d="M 0 4 L 58 4 M 52 -1 L 58 4 L 52 9"></path></svg>
</sc-for>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="5">
<div style="position: absolute; left: {{p.left}}px; top: 168px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="SecFinal" view="{{p.view}}" theme="dark" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1026px; width: 390px; font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.caption}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2398,"height":1076}}'>
class Component extends DCLogic {
  renderVals() {
    const at = (i) => 64 + i * 470;
    return {
      phones: [
        { left: at(0), view: 'drag', caption: 'Soon и Now: задачу из Soon несут на Evening' },
        { left: at(1), view: 'dropped', caption: 'Evening встала за Morning, задача в ней' },
        { left: at(2), view: 'dragCal', caption: 'Now и календарь: задачу несут на New section' },
        { left: at(3), view: 'newName', caption: 'Новая секция в конце списка, вводят имя' },
        { left: at(4), view: 'named', caption: 'Готово: секция заведена' }
      ],
      arrows: [
        { left: at(0) + 398 },
        { left: at(2) + 398 },
        { left: at(3) + 398 }
      ]
    };
  }
}
</script>
</body>
</html>
