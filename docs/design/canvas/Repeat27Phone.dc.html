<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Повторы на телефоне: компонент</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">

<dc-import name="Screen" foot="prod" plus="{{plus}}" theme="{{theme}}" right-mode="calendar" layout="bottom" task-shape="capsule" task-height="35" stack-gap="2" hint-size="390px,844px"></dc-import>

<div style="position: absolute; left: 0; top: 166px; width: 187px; height: 494px; overflow: hidden; background: {{c.bg}}; z-index: 5;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<sc-if value="{{r.isCard}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 10px; top: {{r.top}}px; width: 175px; height: 35px; box-sizing: border-box; overflow: hidden; background: {{r.bg}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px;">
<sc-if value="{{r.progress}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 5px; top: 15.5px; width: 4px; height: 4px; border-radius: 50%; background: {{r.meta}};"></span></sc-if>
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; font-size: 15px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{r.title}}</div>
<sc-if value="{{r.hasCount}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; flex-shrink: 0; text-align: center; font-size: 12px; line-height: 18px; font-weight: 600; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{r.count}}</span></sc-if>
<sc-if value="{{r.rep1}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{r.meta}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Repeats" role="img" style="flex-shrink: 0;"><path d="{{icons.repeat}}"></path></svg></sc-if>
<sc-if value="{{r.showCol}}" hint-placeholder-val="{{false}}">
<span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;">
<span style="height: 13px; display: flex; align-items: center; gap: 2px;">
<sc-if value="{{r.hasDue}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: {{c.strong}}; font-variant-numeric: tabular-nums;">{{r.day}}</span></sc-if>
<sc-if value="{{r.rep2}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{r.meta}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Repeats" role="img"><path d="{{icons.repeat}}"></path></svg></sc-if>
</span>
<sc-if value="{{r.hasDue}}" hint-placeholder-val="{{false}}"><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: {{c.muted}}; letter-spacing: 0.3px;">{{r.mon}}</span></sc-if>
</span>
</sc-if>
</div>
</sc-if>
<sc-if value="{{r.isField}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 10px; top: {{r.top}}px; width: 175px; height: 35px; box-sizing: border-box; overflow: hidden; background: {{c.card}}; box-shadow: inset 0 0 0 1.5px {{c.accent}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; white-space: nowrap; font-size: 15px;"><span>{{r.title}}</span><span style="width: 2px; height: 20px; flex-shrink: 0; margin-left: 1px; background: {{c.accent}}; border-radius: 1px;"></span></div>
</sc-if>
</sc-for>
</div>

<sc-if value="{{menu.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: {{c.backdrop}}; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10;"></div>
<div style="position: absolute; inset: 0; filter: {{c.level}}; z-index: 11; pointer-events: none;">
<div style="position: absolute; left: 10px; top: 166px; width: 175px; height: 35px; box-sizing: border-box; overflow: hidden; background: {{c.card}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; font-size: 15px;"><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;">Зал</span></div>
<div style="position: absolute; left: 10px; top: 213px; width: 300px; height: {{menu.height}}px; border-radius: 14px; overflow: hidden; background: {{c.panel}}; box-shadow: {{c.ring}};">

<sc-if value="{{menu.tiles}}" hint-placeholder-val="{{true}}">
<div style="padding: 8px; display: flex; flex-direction: column; gap: 6px;">
<sc-for list="{{statusRows}}" as="row" hint-placeholder-count="2">
<div style="display: flex; gap: 6px;">
<sc-for list="{{row.tiles}}" as="t" hint-placeholder-count="2">
<button style="flex: 1; min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.text}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path><path d="{{t.fd}}" fill="currentColor" stroke="none"></path></svg>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap;">{{t.label}}</span>
</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{menu.ask}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px; display: flex; flex-direction: column; gap: 8px;">
<div style="height: 20px; padding: 0 8px; display: flex; font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap;"><span style="flex-shrink: 0;">Stop “</span><span style="min-width: 0; overflow: hidden;">Зал</span><span style="flex-shrink: 0;">”?</span></div>
<div style="display: flex; gap: 6px;">
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.text}}; font: inherit; font-size: 16px;">Cancel</button>
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; padding: 0; background: {{c.strong}}; color: {{c.onStrong}}; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.stop}}"></path></svg>Stop</button>
</div>
</div>
</sc-if>

<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; gap: 6px;">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<button style="flex: 1; min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{l.c}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4 M5.5 4.5h11.5l-2.5 4.75 2.5 4.75H5.5"></path></svg>
<span style="font-size: 13px; font-weight: 500; color: {{c.text}};">{{l.name}}</span>
</button>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; gap: 6px;">
<sc-for list="{{moves}}" as="m" hint-placeholder-count="2">
<button style="flex: 1; min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.accentUi}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
<span style="font-size: 13px; font-weight: 500; color: {{c.text}}; white-space: nowrap;">{{m.label}}</span>
</button>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}};">
<sc-for list="{{editRows}}" as="r" hint-placeholder-count="4">
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-bottom: {{r.sep}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;">
<span style="flex: 1; min-width: 0;">{{r.label}}</span>
<sc-if value="{{r.days}}" hint-placeholder-val="{{false}}">
<span aria-label="Mon, Wed, Fri" style="display: flex; gap: 1px;">
<sc-for list="{{weekStrip}}" as="w" hint-placeholder-count="7"><span style="width: 12px; text-align: center; font-size: 13px; font-weight: 600; color: {{w.ink}};">{{w.l}}</span></sc-for>
</span>
</sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{r.d}}"></path></svg>
</button>
</sc-for>
</div>
<button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 8px solid {{c.gap}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1;">Open in Obsidian</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>
<button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 8px solid {{c.gap}}; background: transparent; color: {{c.danger}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1;">Delete</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13"></path></svg></button>
</div>
</div>
</sc-if>

<sc-if value="{{kbd.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 509px; width: 390px; height: 44px; box-sizing: border-box; padding: 0 8px; background: {{c.bg}}; display: flex; align-items: center; gap: 8px; z-index: 12;">
<div style="height: 36px; flex-shrink: 0; border-radius: 18px; background: {{c.card}}; display: flex;">
<button aria-label="Move out" style="width: 44px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: transparent; color: {{c.dim}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 6H11 M21 12H11 M21 18H11 M7 8l-4 4 4 4"></path></svg></button>
<button aria-label="Move in" style="width: 44px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: transparent; color: {{c.text}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 6H11 M21 12H11 M21 18H11 M3 8l4 4-4 4"></path></svg></button>
</div>
<span style="flex: 1;"></span>
<button aria-label="Priority" style="width: 44px; height: 36px; flex-shrink: 0; padding: 0; border: 0; border-radius: 18px; background: {{c.card}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4 M5.5 4.5h11.5l-2.5 4.75 2.5 4.75H5.5"></path></svg></button>
<button aria-label="Repeat" aria-pressed="{{kbd.pressed}}" style="width: 44px; height: 36px; flex-shrink: 0; padding: 0; border: 0; border-radius: 18px; background: {{c.card}}; color: {{kbd.repInk}}; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.repeat}}"></path></svg></button>
<button aria-label="Place" style="width: 108px; height: 36px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 10px; border: 0; border-radius: 18px; background: {{c.card}}; color: {{c.text}}; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{icons.now}}"></path></svg>Now</button>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 291px; box-sizing: border-box; padding: 8px 3px 0; background: {{c.kbd}}; display: flex; flex-direction: column; gap: 12px; z-index: 12;">
<sc-for list="{{kbd.rows}}" as="kr" hint-placeholder-count="4">
<div style="display: flex; gap: 5px;">
<sc-for list="{{kr.keys}}" as="k" hint-placeholder-count="10">
<div style="flex: {{k.flex}}; height: 42px; border-radius: 5px; background: {{k.bg}}; box-shadow: {{c.keyShadow}}; display: flex; align-items: center; justify-content: center; font-size: {{k.size}}px; color: {{c.keyInk}};">{{k.label}}</div>
</sc-for>
</div>
</sc-for>
</div>
<div style="position: absolute; right: 8px; bottom: 343px; width: 300px; z-index: 13;">
<dc-import name="Repeat27Panel" variant="{{kbd.panel}}" theme="{{theme}}" set="{{kbd.set}}" hint-size="300px,{{kbd.panelH}}px"></dc-import>
</div>
</sc-if>

<sc-for list="{{marks}}" as="m" hint-placeholder-count="0">
<div style="position: absolute; left: {{m.left}}px; top: {{m.top}}px; width: {{m.width}}px; height: {{m.height}}px; box-sizing: border-box; border: 2px dashed {{c.mark}}; border-radius: {{m.radius}}px; z-index: 20; pointer-events: none;"></div>
<span style="position: absolute; {{m.tagPos}} height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 6px; background: {{c.mark}}; color: #000000; font-size: 11px; line-height: 20px; font-weight: 600; white-space: nowrap; z-index: 21;">{{m.tag}}</span>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"mark1","options":["mark1","mark2","mark3","panelAll","panelList","menu","stop"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"marks":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'mark1';
    const light = this.props.theme === 'light';
    const c = light
      ? { bg: '#FFFFFF', card: '#F2F2F2', text: '#000000', muted: '#8E8E93', strong: '#1C1C1E', onStrong: '#FFFFFF', accent: '#8A5CF5', accentUi: '#8A5CF5', dim: '#C7C7CC', danger: '#FF3B30', backdrop: 'rgba(0,0,0,0.22)', panel: 'rgba(250,250,252,0.97)', level: 'drop-shadow(0 16px 40px rgba(0,0,0,0.18))', ring: '0 0 0 0.5px rgba(0,0,0,0.1)', tile: 'rgba(0,0,0,0.05)', gap: '#E5E5EA', sep: '#D1D1D6', mark: '#FF9500', kbd: '#D1D3D9', key: '#FFFFFF', fnKey: '#ABB0BC', keyInk: '#000000', keyShadow: '0 1px 0 rgba(0,0,0,0.3)', p: ['#FF3B30', '#FF9500', '#FFCC00'], orangeCard: '#F4E3CF', orangeMeta: '#AA7D40' }
      : { bg: '#000000', card: '#1C1C1C', text: '#FFFFFF', muted: '#8E8E93', strong: '#E5E5EA', onStrong: '#000000', accent: '#9580FF', accentUi: '#8A6CEF', dim: '#636366', danger: '#FF453A', backdrop: 'rgba(0,0,0,0.55)', panel: 'rgba(44,44,46,0.96)', level: 'drop-shadow(0 16px 40px rgba(0,0,0,0.6))', ring: 'none', tile: 'rgba(255,255,255,0.08)', gap: '#1C1C1E', sep: '#48484A', mark: '#FFD60A', kbd: '#1E1E20', key: '#48484B', fnKey: '#2F2F31', keyInk: '#FFFFFF', keyShadow: '0 1px 0 rgba(0,0,0,0.5)', p: ['#FF453A', '#FF9F0A', '#FFD60A'], orangeCard: '#573E19', orangeMeta: '#D8B785' };
    const CIRCLE = 'M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z';
    const icons = {
      repeat: 'M17 2.5l3.5 3.5-3.5 3.5 M3.5 11.5V10a4 4 0 0 1 4-4h13 M7 21.5L3.5 18 7 14.5 M20.5 12.5V14a4 4 0 0 1-4 4h-13',
      stop: CIRCLE + ' M9.5 9.5h5v5h-5z',
      now: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4'
    };
    const markVariant = { mark1: 1, mark2: 2, mark3: 3 }[view] ?? 0;
    const panelView = view === 'panelAll' || view === 'panelList';
    const menuView = view === 'menu' || view === 'stop';

    const listCards = [
      { title: 'Зал', repeat: true },
      { title: 'Оплатить счёт', repeat: true, priority: 'orange', day: '5', mon: 'NOV' },
      { title: 'Собрать вещи в поездку', count: '1/4', day: '6', mon: 'NOV' },
      { title: 'Разобрать почту', progress: true },
      { title: 'Позвонить маме' },
      { title: 'Чай масала' }
    ];
    const typingRows = [
      { title: 'Разобрать почту', progress: true },
      { title: 'Позвонить маме' },
      { title: 'Собрать вещи в поездку', count: '1/4', day: '6', mon: 'NOV' },
      { title: 'Чай масала' },
      { title: 'Зал', field: true }
    ];
    const source = panelView ? typingRows : listCards;
    const shownMark = (t) => !!t.repeat && !menuView ? markVariant : 0;
    const rows = source.map((t, i) => {
      const m = shownMark(t);
      return {
        isCard: !t.field,
        isField: !!t.field,
        top: i * 37,
        title: t.title,
        bg: t.priority ? c.orangeCard : c.card,
        meta: t.priority ? c.orangeMeta : c.muted,
        progress: !!t.progress,
        hasCount: !!t.count,
        count: t.count ?? '',
        hasDue: !!t.day,
        day: t.day ?? '',
        mon: t.mon ?? '',
        rep1: m === 1,
        rep2: m === 2,
        showCol: !!t.day || m === 2
      };
    });

    const statusTiles = [
      { label: 'Done', d: CIRCLE, fd: CIRCLE },
      { label: 'In progress', d: CIRCLE, fd: 'M12 3a9 9 0 0 1 0 18z' },
      { label: 'Won’t do', d: CIRCLE + ' M8 12h8', fd: '' },
      { label: 'Stop', d: icons.stop, fd: '' }
    ];
    const statusRows = [{ tiles: statusTiles }];
    const editRows = [
      { label: 'Rename', d: 'M4 20h4L19 9l-4-4L4 16z M13.5 6.5l4 4' },
      { label: 'Add description', d: 'M4 6h16 M4 12h16 M4 18h10' },
      { label: 'Repeat', d: icons.repeat, days: true },
      { label: 'Add subtask', d: 'M5 4v8a4 4 0 0 0 4 4h11 M16 12l4 4-4 4' }
    ].map((r, i, a) => ({ days: false, ...r, sep: i < a.length - 1 ? '0.5px solid ' + c.sep : '0' }));
    const onDays = [0, 2, 4];
    const weekStrip = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((l, i) => ({ l, ink: onDays.includes(i) ? c.text : c.dim }));

    const MENU_TOP = 213, VIEW_BOTTOM = 776 - 8;
    const statusH = view === 'stop' ? 88 : 82;
    const menuFull = statusH + 90 + 90 + 8 + 4 * 44 + 52 + 52;
    const menuH = Math.min(menuFull, VIEW_BOTTOM - MENU_TOP);

    const key = (label, extra) => ({ label, flex: '1', bg: c.key, size: 22, ...extra });
    const fn = (label, flex) => key(label, { flex, bg: c.fnKey, size: 15 });
    const panelH = view === 'panelAll' ? 214 : 272;
    const kbd = panelView
      ? { on: true, panel: view === 'panelAll' ? 'all' : 'list', set: view === 'panelAll' ? 'true' : 'false', panelH, pressed: view === 'panelAll' ? 'true' : 'false', repInk: view === 'panelAll' ? c.accent : c.text, rows: [
          { keys: ['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х'].map((k) => key(k)) },
          { keys: ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э'].map((k) => key(k)) },
          { keys: [fn('⇧', '1.4'), ...['я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю'].map((k) => key(k)), fn('⌫', '1.4')] },
          { keys: [fn('123', '1.3'), key('пробел', { flex: '6', size: 16 }), fn('Далее', '2.2')] }
        ] }
      : { on: false, rows: [] };

    const marks = [];
    const ring = (left, top, width, height, radius, tag, tagPos) => ({ left: left - 4, top: top - 4, width: width + 8, height: height + 8, radius: radius + 4, tag, tagPos });
    const at = (left, top) => 'left: ' + left + 'px; top: ' + top + 'px;';
    const LIST_TOP = 166;
    if (markVariant === 1 || markVariant === 3) {
      const tag = markVariant === 1 ? '↑ Значок повтора перед датой' : '↑ Повторяются, метки нет';
      marks.push(ring(10, LIST_TOP, 175, 72, 17.5, tag, at(10, LIST_TOP + 6 * 37 + 8)));
    }
    if (markVariant === 2) {
      marks.push(ring(151, LIST_TOP, 24, 72, 8, '↑ Значок в колонке даты', at(10, LIST_TOP + 6 * 37 + 8)));
    }
    if (panelView) {
      const barBtnLeft = 390 - 8 - 108 - 8 - 44;
      marks.push(ring(barBtnLeft, 513, 44, 36, 18, 'Кнопка повтора', at(barBtnLeft - 30, 509 + 50)));
      const pTop = 509 - 8 - panelH;
      marks.push(ring(82, pTop, 300, panelH, 14, view === 'panelAll' ? 'Панель: всё сразу' : 'Панель: частые сверху', 'right: 4px; top: ' + (pTop - 30) + 'px;'));
    }
    if (view === 'menu') {
      marks.push(ring(10, MENU_TOP, 300, statusH, 14, 'Четвёртая плитка: Stop', at(192, MENU_TOP - 30)));
      const repeatTop = MENU_TOP + statusH + 90 + 90 + 8 + 2 * 44;
      marks.push(ring(10, repeatTop, 300, 44, 0, '← Новая', 'left: 320px; top: ' + (repeatTop + 12) + 'px;'));
    }
    if (view === 'stop') marks.push(ring(10, MENU_TOP, 300, statusH, 14, 'Вопрос на месте статусов', at(192, MENU_TOP - 30)));

    return {
      c, icons, rows, statusRows, editRows, weekStrip, kbd,
      theme: light ? 'light' : 'dark',
      plus: panelView || menuView ? 'false' : 'true',
      menu: { on: menuView, tiles: view !== 'stop', ask: view === 'stop', height: menuH },
      levels: [{ name: 'p1', c: c.p[0] }, { name: 'p2', c: c.p[1] }, { name: 'p3', c: c.p[2] }],
      moves: [{ label: 'Tomorrow', d: 'M4 12h13 M12 6l6 6-6 6 M20.5 5v14' }, { label: 'Pick a date', d: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5' }],
      marks: this.props.marks === false || this.props.marks === 'false' ? [] : marks
    };
  }
}
