<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки: приоритеты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{s.bg}}; color: {{s.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; inset: 0; padding: 64px 16px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0 0 16px; font-size: 17px; font-weight: 600; text-align: center;">Task Calendar</h1>
<span style="padding: 0 16px; font-size: 13px; color: #8E8E93;">PRIORITIES</span>
<div style="border-radius: 12px; overflow: hidden; background: {{s.group}};">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="2">
<div style="height: 56px; box-sizing: border-box; padding: 0 10px 0 14px; border-bottom: 0.5px solid {{s.sep}}; display: flex; align-items: center; gap: 12px;">
<span style="width: 56px; height: 32px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px; border-radius: 8px; background: {{s.field}}; display: flex; align-items: center; font-size: 16px;">{{l.prefix}}</span>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between;">
<sc-for list="{{l.swatches}}" as="w" hint-placeholder-count="6">
<span style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: {{w.color}}; box-shadow: {{w.ring}};"></span>
</sc-for>
</div>
<button aria-label="Delete level" style="width: 32px; height: 32px; flex-shrink: 0; border: 0; padding: 0; background: transparent; color: #8E8E93; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13"></path></svg></button>
</div>
</sc-for>
<button style="width: 100%; height: 46px; box-sizing: border-box; padding: 0 14px; border: 0; background: transparent; color: {{s.accent}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Add priority</button>
</div>
<span style="padding: 0 16px; font-size: 13px; line-height: 18px; color: #8E8E93;">A task whose text starts with the prefix gets its colour. Levels show in this order in the menu and on the task screen.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.theme === 'light';
    const s = light
      ? { bg: '#F2F2F7', group: '#FFFFFF', text: '#000000', field: '#F2F2F7', sep: '#D1D1D6', accent: '#8A5CF5', ringGap: '#FFFFFF',
          colors: ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#30B0C7', '#007AFF'] }
      : { bg: '#000000', group: '#1C1C1E', text: '#FFFFFF', field: '#2C2C2E', sep: '#48484A', accent: '#9580FF', ringGap: '#1C1C1E',
          colors: ['#FF453A', '#FF9F0A', '#FFD60A', '#30D158', '#40C8E0', '#0A84FF'] };
    const levels = [{ prefix: 'p1', color: 0 }, { prefix: 'p2', color: 1 }].map((l) => ({
      prefix: l.prefix,
      swatches: s.colors.map((color, i) => ({
        color,
        ring: i === l.color ? '0 0 0 2px ' + s.ringGap + ', 0 0 0 4px ' + color : 'none'
      }))
    }));
    return { s, levels };
  }
}
</script>
</body>
</html>
