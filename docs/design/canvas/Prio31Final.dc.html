<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Цвет приоритета в настройках — итог</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 2288px; height: 2140px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 36px; width: 2160px; display: flex; flex-direction: column; gap: 12px;">
<div style="font-size: 64px; line-height: 76px; font-weight: 700; color: #1C1C1E;">Цвет приоритета в настройках — итог</div>
<div style="font-size: 20px; line-height: 26px; color: #6B6A65;">Кружки залиты тем же цветом, что карточка задачи, без обводки; выбранный — в одном кольце. Рядом карточка задачи в выбранном цвете и поле с кодом цвета. Последний кружок открывает выбор любого цвета</div>
</div>
<div style="position: absolute; left: 64px; top: 190px; font-size: 40px; line-height: 48px; font-weight: 700; color: #1C1C1E;">Телефон</div>
<sc-for list="{{phones}}" as="p" hint-placeholder-count="2">
<div style="position: absolute; left: {{p.left}}px; top: 270px; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="Prio31Settings" look="mix" theme="{{p.theme}}" hint-size="390px,844px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1130px; width: 390px; font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</div>
</sc-for>
<div style="position: absolute; left: 64px; top: 1240px; font-size: 40px; line-height: 48px; font-weight: 700; color: #1C1C1E;">Mac — всё в одну строку</div>
<sc-for list="{{desks}}" as="p" hint-placeholder-count="2">
<div style="position: absolute; left: {{p.left}}px; top: 1320px; width: 1040px; height: 640px; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="Prio31Desk" theme="{{p.theme}}" hint-size="1040px,640px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: 1976px; width: 1040px; font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2288,"height":2140}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      phones: [{ left: 64, theme: 'dark', name: 'Тёмная' }, { left: 494, theme: 'light', name: 'Светлая' }],
      desks: [{ left: 64, theme: 'dark', name: 'Тёмная' }, { left: 1184, theme: 'light', name: 'Светлая' }]
    };
  }
}
</script>
</body>
</html>
