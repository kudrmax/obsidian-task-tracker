<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Проекты на телефоне: компонент</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 15px;">

<dc-import name="Screen" foot="prod" plus="true" theme="{{theme}}" right-mode="{{mode}}" layout="bottom" task-shape="capsule" task-height="35" stack-gap="2" hint-size="390px,844px"></dc-import>

<div style="position: absolute; left: 0; top: 160px; width: 196px; height: 562px; background: {{c.bg}}; z-index: 5;"></div>
<sc-if value="{{coverRight}}" hint-placeholder-val="{{true}}"><div style="position: absolute; left: 197px; top: 664px; width: 193px; height: 56px; background: {{c.bg}}; z-index: 5;"></div></sc-if>
<div style="position: absolute; left: 0; top: 716px; width: 120px; height: 58px; background: {{c.bg}}; z-index: 6;"></div>
<div style="position: absolute; left: 300px; top: 716px; width: 90px; height: 58px; background: {{c.bg}}; z-index: 6;"></div>

<sc-if value="{{split}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 10px; top: 444px; width: 176px; height: 1px; background: {{c.line}}; z-index: 6;"></div>
<div style="position: absolute; left: 10px; top: 453px; height: 36px; display: flex; align-items: center; font-size: 20px; font-weight: 700; z-index: 6;">Backlog</div>
</sc-if>

<div style="position: absolute; left: 0; top: 0; width: 196px; height: 720px; overflow: hidden; z-index: 6;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
<sc-if value="{{r.isCard}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 10px; top: {{r.top}}px; width: 175px; height: {{r.h}}px; box-sizing: border-box; overflow: hidden; background: {{c.card}}; border-radius: 17.5px; padding: {{r.pad}}; display: flex; align-items: center; gap: 6px; z-index: {{r.z}};">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0;">
<div style="white-space: nowrap; overflow: hidden; font-size: 15px; line-height: 20px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{r.title}}</div>
<sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><div style="white-space: nowrap; overflow: hidden; font-size: 12px; line-height: 15px; color: {{c.muted}}; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{r.sub}}</div></sc-if>
</div>
<sc-if value="{{r.hasIcon}}" hint-placeholder-val="{{false}}"><span style="width: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: {{c.muted}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.project}}"></path></svg></span></sc-if>
<sc-if value="{{r.hasDue}}" hint-placeholder-val="{{false}}"><span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: {{c.strong}}; font-variant-numeric: tabular-nums;">{{r.day}}</span><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: {{c.muted}}; letter-spacing: 0.3px;">NOV</span></span></sc-if>
</div>
</sc-if>
<sc-if value="{{r.isHead}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 10px; top: {{r.top}}px; width: 175px; height: 26px; box-sizing: border-box; padding: 0 4px 0 14px; display: flex; align-items: flex-end; gap: 6px; white-space: nowrap; overflow: hidden; z-index: 6;">
<sc-if value="{{r.fold}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 20px; flex-shrink: 0; margin-left: -6px; display: flex; align-items: center; justify-content: center; color: {{r.ink}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{r.turn}}deg);"><polyline points="9 5 16 12 9 19"></polyline></svg></span></sc-if>
<span style="flex: 0 1 auto; min-width: 0; overflow: hidden; font-size: 13px; line-height: 20px; font-weight: 600; color: {{r.ink}}; -webkit-mask-image: {{r.mask}}; mask-image: {{r.mask}};">{{r.name}}</span>
<sc-if value="{{r.hasCount}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-size: 12px; line-height: 20px; font-weight: 600; color: {{c.muted}}; font-variant-numeric: tabular-nums;">{{r.count}}</span></sc-if>
<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}"><span style="width: 16px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: {{r.ink}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.open}}"></path></svg></span></sc-if>
<sc-if value="{{r.plus}}" hint-placeholder-val="{{false}}"><span style="width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: {{c.accent}};"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></span></sc-if>
</div>
</sc-if>
</sc-for>
</div>

<sc-if value="{{fade}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 0; top: 656px; width: 196px; height: 64px; background: linear-gradient(to bottom, {{c.clear}}, {{c.bg}} 90%); z-index: 6; pointer-events: none;"></div>
</sc-if>

<div role="group" aria-label="Undo and more" style="position: absolute; left: 16px; top: 722px; width: 80px; height: 44px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.control}}; display: flex; z-index: 7;">
<span style="width: 40px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.undo}}"></path></svg></span>
<span style="width: 40px; height: 44px; color: {{c.text}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="{{icons.more}}"></path></svg></span>
</div>
<div aria-label="New task" style="position: absolute; left: 330px; top: 722px; width: 44px; height: 44px; border-radius: 22px; background: {{c.accent}}; color: #FFFFFF; box-shadow: {{c.control}}; display: flex; align-items: center; justify-content: center; z-index: 7;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg></div>

<sc-if value="{{dim}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; background: {{c.backdrop}}; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 9;"></div>
<div style="position: absolute; left: 10px; top: {{tapped.top}}px; width: 175px; height: 35px; box-sizing: border-box; background: {{c.card}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; z-index: 10;"><div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{tapped.title}}</div></div>
<div style="position: absolute; left: 10px; top: {{panelTop}}px; width: 300px; border-radius: 14px; overflow: hidden; background: {{c.panel}}; box-shadow: {{c.shadow}}; z-index: 11;">
<sc-if value="{{onMenu}}" hint-placeholder-val="{{true}}">
<div style="padding: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{statusTiles}}" as="s" hint-placeholder-count="3">
<div style="min-width: 0; height: 66px; border-radius: 10px; background: {{c.tile}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path><path d="{{s.fd}}" fill="currentColor" stroke="none"></path></svg>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap;">{{s.label}}</span>
</div>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; gap: 6px;">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<div style="flex: 1; min-width: 0; height: 66px; border-radius: 10px; background: {{c.tile}}; color: {{l.c}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 21V4 M5.5 4.5h11.5l-2.5 4.75 2.5 4.75H5.5"></path></svg>
<span style="font-size: 13px; font-weight: 500; color: {{c.text}};">{{l.name}}</span>
</div>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; gap: 6px;">
<sc-for list="{{moveTiles}}" as="m" hint-placeholder-count="4">
<div style="flex: 1; min-width: 0; height: 66px; border-radius: 10px; background: {{c.tile}}; color: {{c.accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
<span style="font-size: 13px; font-weight: 500; color: {{c.text}}; white-space: nowrap;">{{m.label}}</span>
</div>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}};">
<sc-for list="{{editRows}}" as="e" hint-placeholder-count="4">
<div style="height: 44px; box-sizing: border-box; padding: 0 16px; border-bottom: {{e.sep}}; display: flex; align-items: center; gap: 10px; font-size: 16px; outline: {{e.mark}}; outline-offset: -3px;">
<span style="flex: 1; min-width: 0;">{{e.label}}</span>
<sc-if value="{{e.hasValue}}" hint-placeholder-val="{{false}}"><span style="font-size: 15px; color: {{c.muted}}; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis;">{{e.value}}</span></sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{e.d}}"></path></svg>
</div>
</sc-for>
</div>
<div style="height: 52px; box-sizing: border-box; padding: 0 16px; border-top: 8px solid {{c.gap}}; display: flex; align-items: center; font-size: 16px;"><span style="flex: 1;">Open in Obsidian</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.open}}"></path></svg></div>
<div style="height: 52px; box-sizing: border-box; padding: 0 16px; border-top: 8px solid {{c.gap}}; display: flex; align-items: center; font-size: 16px; color: {{c.danger}};"><span style="flex: 1;">Delete</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.del}}"></path></svg></div>
</sc-if>
<sc-if value="{{onPicker}}" hint-placeholder-val="{{false}}">
<div style="height: 52px; box-sizing: border-box; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>Project
</div>
<div style="border-top: 8px solid {{c.gap}};">
<sc-for list="{{projectRows}}" as="p" hint-placeholder-count="4">
<div style="height: 44px; box-sizing: border-box; padding: 0 16px; border-bottom: {{p.sep}}; display: flex; align-items: center; gap: 10px; font-size: 16px; color: {{p.ink}}; outline: {{p.mark}}; outline-offset: -3px;">
<span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">{{p.name}}</span>
<sc-if value="{{p.on}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>

<sc-for list="{{marks}}" as="m" hint-placeholder-count="0">
<div style="position: absolute; left: {{m.left}}px; top: {{m.top}}px; width: {{m.width}}px; height: {{m.height}}px; box-sizing: border-box; border: 2px dashed {{c.mark}}; border-radius: {{m.radius}}px; z-index: 20; pointer-events: none;"></div>
<span style="position: absolute; {{m.tagPos}} height: 20px; box-sizing: border-box; padding: 0 5px; border-radius: 6px; background: {{c.mark}}; color: #000000; font-size: 11px; line-height: 20px; font-weight: 600; white-space: nowrap; z-index: 21;">{{m.tag}}</span>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","default":"backlog","options":["backlog","card","menu","picker","picked"]},"look":{"editor":"enum","default":"plain","options":["project","icon","line"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"marks":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'backlog';
    const look = this.props.look ?? 'project';
    const light = this.props.theme === 'light';
    const c = light
      ? { bg: '#FFFFFF', clear: 'rgba(255,255,255,0)', card: '#F2F2F2', text: '#000000', strong: '#1C1C1E', muted: '#8E8E93', pull: '#6C6C70', line: '#E5E5EA', accent: '#8A5CF5', backdrop: 'rgba(0,0,0,0.22)', panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', control: '0 6px 16px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.1)', sep: '#D1D1D6', gap: '#E5E5EA', tile: 'rgba(0,0,0,0.05)', danger: '#FF3B30', mark: '#FF9500' }
      : { bg: '#000000', clear: 'rgba(0,0,0,0)', card: '#1C1C1C', text: '#FFFFFF', strong: '#E5E5EA', muted: '#8E8E93', pull: '#AEAEB2', line: '#2C2C2E', accent: '#9580FF', backdrop: 'rgba(0,0,0,0.55)', panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', control: '0 6px 16px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.1)', sep: '#48484A', gap: '#1C1C1E', tile: 'rgba(255,255,255,0.08)', danger: '#FF453A', mark: '#FFD60A' };
    const CIRCLE = 'M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z';
    const icons = {
      undo: 'M9 14L4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11',
      more: 'M5 10.4a1.6 1.6 0 1 1 0 3.2a1.6 1.6 0 1 1 0-3.2z M12 10.4a1.6 1.6 0 1 1 0 3.2a1.6 1.6 0 1 1 0-3.2z M19 10.4a1.6 1.6 0 1 1 0 3.2a1.6 1.6 0 1 1 0-3.2z',
      open: 'M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
      project: 'M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z',
      rename: 'M4 20h4L19 9l-4-4L4 16z M13.5 6.5l4 4',
      desc: 'M4 6h16 M4 12h16 M4 18h10',
      subtask: 'M5 4v8a4 4 0 0 0 4 4h11 M16 12l4 4-4 4',
      del: 'M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13',
      today: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4',
      tomorrow: 'M4 12h13 M12 6l6 6-6 6 M20.5 5v14',
      pick: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5'
    };

    const ENV = 'Окружение в новой стране';
    const HAPPY = 'Стать счастливым';
    const NP = 'No project';
    const inbox = ['Узнать про курсы итальянского', 'Написать Ане из языкового клуба', 'Ответить Лёше про поход', 'Посмотреть «Дюну 2»', 'Сменить тариф мобильной связи', 'Почитать про налоговое резидентство'];
    const groups = [
      { name: ENV, tasks: ['Найти клуб скалолазания', 'Позвать коллег на ужин'], count: 2 },
      { name: HAPPY, tasks: ['Записаться к психологу', 'Вести дневник благодарности'], count: 2 },
      { name: NP, tasks: ['Выучить испанский', 'Разобрать старые фото'], count: 2, none: true }
    ];

    const STEP = 37, CARD = 35, HEAD = 26, GAP = 10;
    const card = (title, top, extra) => ({ isCard: true, isHead: false, title, top, h: CARD, pad: '0 10px 0 14px', z: 6, hasSub: false, sub: '', hasIcon: false, hasDue: false, day: '', ...extra });
    const rows = [];
    let mode = 'inbox';
    let split = false;
    let fade = false;
    let coverRight = true;
    const marks = [];
    const ring = (left, top, width, height, radius, tag, tagPos) => ({ left: left - 4, top: top - 4, width: width + 8, height: height + 8, radius: radius + 4, tag, tagPos });
    const pos = (left, top) => 'left: ' + left + 'px; top: ' + top + 'px;';

    const head = (g, top, folded) => ({
      isCard: false, isHead: true, top, name: g.name,
      mask: g.name.length > 13 ? 'linear-gradient(to right, #000 calc(100% - 24px), transparent)' : 'none',
      ink: g.none ? c.muted : c.pull,
      plus: false,
      open: !g.none,
      fold: true,
      turn: folded ? 0 : 90,
      hasCount: folded,
      count: String(g.count)
    });
    const inboxRows = (list) => list.forEach((t, i) => rows.push(card(t, 166 + i * STEP)));

    if (view === 'backlog') {
      split = true;
      fade = true;
      inboxRows(inbox);
      let y = 501;
      const firstOpen = 0;
      groups.forEach((g, gi) => {
        if (gi > 0) y += GAP;
        const folded = gi !== firstOpen;
        rows.push(head(g, y, folded));
        if (gi === 0) marks.push(ring(10, y, 175, HEAD, 6, '← Группа проекта', pos(200, y + 3)));
        y += HEAD;
        if (!folded) g.tasks.forEach((t) => { rows.push(card(t, y)); y += STEP; });
      });
    }

    const nowTasks = ['Созвониться с врачом', 'Сходить на языковой обмен', 'Чай масала', 'Позвонить маме', 'Оплатить интернет', 'Разобрать почту'];
    if (view === 'card') {
      mode = 'calendar';
      coverRight = false;
      let y = 166;
      nowTasks.forEach((t, i) => {
        const mine = i === 1;
        if (mine && look === 'line') {
          rows.push(card(t, y, { h: 47, pad: '6px 10px 6px 14px', hasSub: true, sub: ENV }));
          marks.push(ring(10, y, 175, 47, 23.5, '↑ Из проекта', pos(14, 166 + 6 * STEP + 26)));
          y += 47 + 2;
        } else {
          rows.push(card(t, y, mine ? { hasIcon: true } : {}));
          if (mine) marks.push(ring(10, y, 175, CARD, 17.5, '↑ Из проекта', pos(14, 166 + 6 * STEP + 14)));
          y += STEP;
        }
      });
    }

    const picked = view === 'picked';
    if (view === 'menu' || view === 'picker' || picked) {
      inboxRows(inbox);
      split = true;
      fade = true;
      let y = 501;
      groups.forEach((g, gi) => {
        if (gi > 0) y += GAP;
        const folded = gi !== 0;
        rows.push(head(g, y, folded));
        y += HEAD;
        if (!folded) g.tasks.forEach((t) => { rows.push(card(t, y)); y += STEP; });
      });
      if (picked) {
        rows[1] = card(inbox[1], 166 + STEP, { hasIcon: true });
        marks.push(ring(10, 166 + STEP, 175, CARD, 17.5, '↑ Теперь в проекте', pos(14, 166 + 6 * STEP + 6)));
      }
    }

    const dim = view === 'menu' || view === 'picker';
    const tapped = { top: 166 + STEP, title: inbox[1] };
    const panelTop = tapped.top + CARD + 12;
    const markLine = (on) => (on && this.props.marks !== false && this.props.marks !== 'false' ? '2px dashed ' + c.mark : 'none');
    const editRows = [
      { label: 'Rename', d: icons.rename },
      { label: 'Add description', d: icons.desc },
      { label: 'Project', d: icons.project, value: NP, mark: true },
      { label: 'Add subtask', d: icons.subtask }
    ].map((r, i, a) => ({ ...r, hasValue: !!r.value, sep: i < a.length - 1 ? '0.5px solid ' + c.sep : '0', mark: markLine(!!r.mark) }));
    const projectRows = [
      { name: ENV, mark: true },
      { name: HAPPY },
      { name: NP, muted: true, on: true }
    ].map((p, i, a) => ({ ...p, on: !!p.on, ink: p.muted ? c.muted : c.text, sep: i < a.length - 1 ? '0.5px solid ' + c.sep : '0', mark: markLine(!!p.mark) }));

    return {
      c, icons, rows, mode, split, fade, coverRight,
      theme: light ? 'light' : 'dark',
      dim,
      tapped, panelTop,
      onMenu: view === 'menu',
      onPicker: view === 'picker',
      statusTiles: [
        { label: 'Done', d: CIRCLE, fd: CIRCLE },
        { label: 'In progress', d: CIRCLE, fd: 'M12 3a9 9 0 0 1 0 18z' },
        { label: 'Won’t do', d: CIRCLE + ' M8 12h8', fd: '' }
      ],
      moveTiles: [
        { label: 'Today', d: icons.today },
        { label: 'Tomorrow', d: icons.tomorrow },
        { label: 'Pick a date', d: icons.pick }
      ],
      levels: [{ name: 'p1', c: light ? '#FF3B30' : '#FF453A' }, { name: 'p2', c: light ? '#FF9500' : '#FF9F0A' }, { name: 'p3', c: light ? '#FFCC00' : '#FFD60A' }],
      editRows, projectRows,
      marks: this.props.marks === false || this.props.marks === 'false' || dim ? [] : marks
    };
  }
}
</script>
</body>
</html>
