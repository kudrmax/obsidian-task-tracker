<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подтверждение на телефоне</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<dc-import name="Screen" theme="{{theme}}" right-mode="calendar" layout="bottom" task-shape="capsule" task-height="35" stack-gap="2" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: {{c.backdrop}}; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 10;"></div>

<div style="position: absolute; left: 10px; top: 166px; width: 175px; height: 35px; box-sizing: border-box; background: {{c.card}}; border-radius: 17.5px; padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; z-index: 11;">
<div style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; font-size: 15px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent);">Купить билеты в Белград</div>
<span style="width: 24px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 1px;"><span style="font-size: 13px; line-height: 13px; font-weight: 700; color: {{c.strong}}; font-variant-numeric: tabular-nums;">3</span><span style="font-size: 9px; line-height: 9px; font-weight: 600; color: {{c.muted}}; letter-spacing: 0.3px;">NOV</span></span>
</div>

<sc-if value="{{onMenu}}" hint-placeholder-val="{{true}}">
<div style="position: absolute; left: 10px; top: 213px; width: 300px; z-index: 11;"><dc-import name="ConfirmMenu" variant="{{variant}}" action="{{action}}" theme="{{theme}}" pop-right="380" hint-size="300px,600px"></dc-import></div>
</sc-if>

<sc-if value="{{onSheet}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; flex-direction: column; gap: 8px; z-index: 11;">
<div style="border-radius: 14px; overflow: hidden; background: {{c.panel}}; box-shadow: {{c.shadow}};">
<div style="padding: 16px 16px 14px; display: flex; flex-direction: column; align-items: center; text-align: center;">
<span style="font-size: 13px; line-height: 18px; font-weight: 600; color: {{c.muted}};">{{sheet.question}}</span>
<span style="margin-top: 2px; max-width: 100%; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Купить билеты в Белград</span>
<span style="margin-top: 2px; font-size: 13px; line-height: 18px; color: {{c.muted}};">{{sheet.hint}}</span>
</div>
<button style="width: 100%; height: 56px; border: 0; border-top: 0.5px solid {{c.sep}}; padding: 0; background: transparent; color: {{sheet.ink}}; font: inherit; font-size: 20px; font-weight: 400;">{{sheet.confirm}}</button>
</div>
<button style="width: 100%; height: 56px; border: 0; border-radius: 14px; padding: 0; background: {{c.panel}}; box-shadow: {{c.shadow}}; color: {{c.text}}; font: inherit; font-size: 20px; font-weight: 600;">Cancel</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"inline","options":["menu","inline","popover","sheet"]},"action":{"editor":"enum","default":"delete","options":["delete","wontdo"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'inline';
    const action = this.props.action ?? 'delete';
    const light = this.props.theme === 'light';
    const c = light
      ? { bg: '#FFFFFF', card: '#F2F2F7', text: '#000000', strong: '#1C1C1E', muted: '#8E8E93', accent: '#8A5CF5', backdrop: 'rgba(0,0,0,0.22)', panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', sep: '#D1D1D6', danger: '#FF3B30' }
      : { bg: '#000000', card: '#1C1C1E', text: '#FFFFFF', strong: '#E5E5EA', muted: '#8E8E93', accent: '#9580FF', backdrop: 'rgba(0,0,0,0.55)', panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', sep: '#48484A', danger: '#FF453A' };
    const del = action === 'delete';
    return {
      c,
      variant,
      action,
      theme: light ? 'light' : 'dark',
      onMenu: variant !== 'sheet',
      onSheet: variant === 'sheet',
      sheet: {
        question: del ? 'Delete this task?' : 'Mark as won’t do?',
        hint: del ? 'It leaves the tasks file' : 'It stays in the file, marked won’t do',
        confirm: del ? 'Delete task' : 'Won’t do',
        ink: del ? c.danger : c.accent
      }
    };
  }
}
</script>
</body>
</html>
