<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Меню задачи с подтверждением</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 300px; height: {{height}}px; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 0; top: 0; width: 300px; border-radius: 14px; overflow: hidden; background: {{c.panel}}; box-shadow: {{c.shadow}};">

<sc-if value="{{askWontInline}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px; display: flex; flex-direction: column; gap: 8px;">
<div style="height: 20px; padding: 0 4px; display: flex; align-items: center; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap;">
<span style="flex-shrink: 0;">Won’t do “</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{title}}</span><span style="flex-shrink: 0;">”?</span>
</div>
<div style="display: flex; gap: 6px;">
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.text}}; font: inherit; font-size: 16px; font-weight: 500;">Cancel</button>
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; padding: 0; background: {{c.strong}}; color: {{c.onStrong}}; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.wontdo}}"></path></svg>Won’t do</button>
</div>
</div>
</sc-if>
<sc-if value="{{statusRow}}" hint-placeholder-val="{{true}}">
<div style="padding: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{statusTiles}}" as="r" hint-placeholder-count="3">
<button style="min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{r.bg}}; color: {{c.text}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path><path d="{{r.fd}}" fill="currentColor" stroke="none"></path></svg>
<span style="font-size: 13px; font-weight: 500; white-space: nowrap;">{{r.label}}</span>
</button>
</sc-for>
</div>
</sc-if>

<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; gap: 6px;">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<button style="flex: 1; min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{l.c}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{flag}}"></path></svg>
<span style="font-size: 13px; font-weight: 500; color: {{c.text}};">{{l.name}}</span>
</button>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; gap: 6px;">
<sc-for list="{{moveTiles}}" as="m" hint-placeholder-count="2">
<button style="flex: 1; min-width: 0; height: 66px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.accent}}; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
<span style="font-size: 13px; font-weight: 500; color: {{c.text}}; white-space: nowrap;">{{m.label}}</span>
</button>
</sc-for>
</div>
<div style="border-top: 8px solid {{c.gap}};">
<sc-for list="{{editRows}}" as="r" hint-placeholder-count="4">
<button style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 16px; border: 0; border-bottom: {{r.sep}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;">
<span style="flex: 1; min-width: 0;">{{r.label}}</span>
<sc-if value="{{r.hasValue}}" hint-placeholder-val="{{false}}"><span style="font-size: 15px; color: {{c.muted}};">{{r.value}}</span></sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{r.d}}"></path></svg>
</button>
</sc-for>
</div>
<button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 8px solid {{c.gap}}; background: transparent; color: {{c.text}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1;">Open in Obsidian</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.open}}"></path></svg></button>

<sc-if value="{{deleteRow}}" hint-placeholder-val="{{true}}">
<button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; border: 0; border-top: 8px solid {{c.gap}}; background: {{deleteBg}}; color: {{c.danger}}; font: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; text-align: left;"><span style="flex: 1;">Delete</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.del}}"></path></svg></button>
</sc-if>
<sc-if value="{{askDeleteInline}}" hint-placeholder-val="{{false}}">
<div style="border-top: 8px solid {{c.gap}}; padding: 8px; display: flex; flex-direction: column; gap: 8px;">
<div style="height: 20px; padding: 0 4px; display: flex; align-items: center; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap;">
<span style="flex-shrink: 0;">Delete “</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{title}}</span><span style="flex-shrink: 0;">”?</span>
</div>
<div style="display: flex; gap: 6px;">
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; padding: 0; background: {{c.tile}}; color: {{c.text}}; font: inherit; font-size: 16px; font-weight: 500;">Cancel</button>
<button style="flex: 1; height: 44px; border: 0; border-radius: 10px; padding: 0; background: {{c.danger}}; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.del}}"></path></svg>Delete</button>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{pop.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{pop.left}}px; top: {{pop.top}}px; width: 260px; z-index: 2;">
<sc-if value="{{pop.up}}" hint-placeholder-val="{{false}}">
<svg width="18" height="9" viewBox="0 0 18 9" aria-hidden="true" style="display: block; margin-left: {{pop.arrow}}px;"><path d="M0 9L9 0L18 9z" fill="{{c.pop}}"></path></svg>
</sc-if>
<div style="box-sizing: border-box; padding: 14px 14px 12px; border-radius: 14px; background: {{c.pop}}; box-shadow: {{c.popShadow}}; display: flex; flex-direction: column;">
<span style="font-size: 16px; line-height: 21px; font-weight: 600;">{{pop.question}}</span>
<span style="margin-top: 2px; font-size: 14px; line-height: 19px; color: {{c.muted}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{title}}</span>
<div style="margin-top: 12px; display: flex; gap: 8px;">
<button style="flex: 1; height: 40px; border: 0; border-radius: 10px; padding: 0; background: {{c.popTile}}; color: {{c.text}}; font: inherit; font-size: 15px; font-weight: 500;">Cancel</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 10px; padding: 0; background: {{pop.bg}}; color: {{pop.ink}}; font: inherit; font-size: 15px; font-weight: 600;">{{pop.confirm}}</button>
</div>
</div>
<sc-if value="{{pop.down}}" hint-placeholder-val="{{false}}">
<svg width="18" height="9" viewBox="0 0 18 9" aria-hidden="true" style="display: block; margin-left: {{pop.arrow}}px;"><path d="M0 0L9 9L18 0z" fill="{{c.pop}}"></path></svg>
</sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"inline","options":["menu","inline","popover"]},"action":{"editor":"enum","default":"delete","options":["delete","wontdo"]},"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"popRight":{"editor":"range","default":380,"min":260,"max":1200,"step":1,"unit":"px"},"$preview":{"width":300,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'inline';
    const action = this.props.action ?? 'delete';
    const light = this.props.theme === 'light';
    const c = light
      ? { text: '#000000', strong: '#1C1C1E', onStrong: '#FFFFFF', muted: '#8E8E93', accent: '#8A5CF5', panel: 'rgba(250,250,252,0.97)', shadow: '0 16px 40px rgba(0,0,0,0.18), 0 0 0 0.5px rgba(0,0,0,0.1)', sep: '#D1D1D6', gap: '#E5E5EA', tile: 'rgba(0,0,0,0.05)', pressed: 'rgba(0,0,0,0.1)', danger: '#FF3B30', pop: '#FFFFFF', popTile: 'rgba(0,0,0,0.06)', popShadow: '0 12px 32px rgba(0,0,0,0.2), 0 0 0 0.5px rgba(0,0,0,0.12)' }
      : { text: '#FFFFFF', strong: '#E5E5EA', onStrong: '#000000', muted: '#8E8E93', accent: '#9580FF', panel: 'rgba(44,44,46,0.96)', shadow: '0 16px 40px rgba(0,0,0,0.6)', sep: '#48484A', gap: '#1C1C1E', tile: 'rgba(255,255,255,0.08)', pressed: 'rgba(255,255,255,0.16)', danger: '#FF453A', pop: '#3A3A3C', popTile: 'rgba(255,255,255,0.1)', popShadow: '0 12px 32px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.12)' };
    const CIRCLE = 'M12 3a9 9 0 1 1 0 18a9 9 0 1 1 0-18z';
    const icons = {
      progressFill: 'M12 3a9 9 0 0 1 0 18z',
      wontdo: CIRCLE + ' M8 12h8',
      rename: 'M4 20h4L19 9l-4-4L4 16z M13.5 6.5l4 4',
      desc: 'M4 6h16 M4 12h16 M4 18h10',
      section: 'M4 6h9 M4 12h16 M4 18h16',
      subtask: 'M5 4v8a4 4 0 0 0 4 4h11 M16 12l4 4-4 4',
      open: 'M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',
      del: 'M4 7h16 M9 7V4.5h6V7 M6 7l1 13h10l1-13',
      tomorrow: 'M4 12h13 M12 6l6 6-6 6 M20.5 5v14',
      pick: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5'
    };
    const inline = variant === 'inline';
    const popover = variant === 'popover';
    const del = action === 'delete';
    const editRows = [
      { label: 'Rename', d: icons.rename },
      { label: 'Add description', d: icons.desc },
      { label: 'Section', d: icons.section, value: 'Morning' },
      { label: 'Add subtask', d: icons.subtask }
    ].map((r, i, a) => ({ ...r, hasValue: !!r.value, sep: i < a.length - 1 ? '0.5px solid ' + c.sep : '0' }));
    const wontPressed = popover && !del;
    const statusTiles = [
      { label: 'Done', d: CIRCLE, fd: CIRCLE, bg: c.tile },
      { label: 'In progress', d: CIRCLE, fd: icons.progressFill, bg: c.tile },
      { label: 'Won’t do', d: icons.wontdo, fd: '', bg: wontPressed ? c.pressed : c.tile }
    ];
    const askWontInline = inline && !del;
    const askDeleteInline = inline && del;
    const height = 550 + (askWontInline ? 6 : 0) + (askDeleteInline ? 44 : 0);
    const POP_W = 260, POP_H = 120, ARROW = 9;
    const popRight = Number(this.props.popRight ?? 380) - 10;
    let pop = { on: false, up: false, down: false, left: 0, top: 0, arrow: 0 };
    if (popover) {
      const target = del ? 274 : 8 + 2 * ((300 - 16 - 12) / 3 + 6) + (300 - 16 - 12) / 6;
      const left = Math.round(del ? 30 : Math.min(target - POP_W / 2, popRight - POP_W));
      pop = {
        on: true,
        up: !del,
        down: del,
        left,
        top: del ? 550 - 52 - ARROW - POP_H : 74 + 2,
        arrow: Math.round(target - left - 9),
        question: del ? 'Delete this task?' : 'Mark as won’t do?',
        confirm: del ? 'Delete' : 'Won’t do',
        bg: del ? c.danger : c.strong,
        ink: del ? '#FFFFFF' : c.onStrong
      };
    }
    return {
      c,
      icons,
      height,
      title: 'Купить билеты в Белград',
      flag: 'M5.5 21V4 M5.5 4.5h11.5l-2.5 4.75 2.5 4.75H5.5',
      levels: [{ name: 'p1', c: light ? '#FF3B30' : '#FF453A' }, { name: 'p2', c: light ? '#FF9500' : '#FF9F0A' }, { name: 'p3', c: light ? '#FFCC00' : '#FFD60A' }],
      statusTiles,
      statusRow: !askWontInline,
      askWontInline,
      askDeleteInline,
      deleteRow: !askDeleteInline,
      deleteBg: popover && del ? c.pressed : 'transparent',
      moveTiles: [{ label: 'Tomorrow', d: icons.tomorrow }, { label: 'Pick a date', d: icons.pick }],
      editRows,
      pop
    };
  }
}
</script>
</body>
</html>
