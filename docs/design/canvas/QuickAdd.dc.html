      soon: 'M5 21.5h14 M5 2.5h14 M17 21.5v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 3.9a2 2 0 0 0-.6 1.4v4.2 M7 2.5v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-3.9a2 2 0 0 0 .6-1.4V2.5',
      now: 'M12 8a4 4 0 1 1 0 8a4 4 0 1 1 0-8z M12 2.5v2 M12 19.5v2 M2.5 12h2 M19.5 12h2 M5.3 5.3l1.4 1.4 M17.3 17.3l1.4 1.4 M5.3 18.7l1.4-1.4 M17.3 6.7l1.4-1.4',
      date: 'M6.5 5h11a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-11a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z M3.5 10h17 M8 3v3.5 M16 3v3.5'
    };

    const card = (title, level, extra) => ({ kind: 'card', title, level: level ?? 0, ...extra });
    const field = (text, level, extra) => ({ kind: 'field', text, level: level ?? 0, ...extra });
    const gap = (level) => ({ kind: 'gap', level: level ?? 0 });
    const base = [
      card('Созвониться с врачом'),
      card('Записаться в барбершоп', 0, { progress: true }),
      card('Позвонить маме', 0, { id: 'mom' }),
      card('Чай масала'),
      card('Разобрать почту'),
      card('Оплатить интернет')
    ];
    const head = base.slice(0, 4);
    const inbox = ['Узнать про курсы итальянского', 'Идея подарка на Новый год', 'Ответить Лёше про поход', 'Посмотреть «Дюну 2»', 'Почитать про налоговое резидентство', 'Сменить тариф мобильной связи'].map((t) => card(t));
    const nov5 = [card('Забрать костюм из химчистки'), card('Встреча с риелтором')];
    const trip = (count) => card('Собрать вещи в поездку', 0, { count });
    const momTarget = base.map((r) => (r.id === 'mom' ? { ...r, target: true } : r));
    const top = (rows) => ({ side: 'left', rows });
    const right = (rows) => ({ side: 'right', rows });
    const bank = 'Позвонить в банк';

    const V = {
      empty: { cols: [top([...base, field('')])], bar: { out: false, in: true, place: 'now' }, mark: ['field'] },
      typing: { cols: [top([...base, field('Купить хлеб')])], bar: { out: false, in: true, place: 'now' }, mark: ['field'] },
      enter: { cols: [top([...base, card('Купить хлеб'), field('')])], bar: { out: false, in: true, place: 'now' }, mark: ['field'] },
      closed: { cols: [top([...base, card('Купить хлеб', 0, { fresh: true }), card('Забрать посылку', 0, { fresh: true })])], mark: ['fresh'] },
      tabBefore: { cols: [top([...head, trip(), field('Зарядка для ноутбука')])], bar: { out: false, in: true, place: 'now' }, mark: ['field', 'in'] },
      tabAfter: { cols: [top([...head, trip(), field('Зарядка для ноутбука', 1)])], bar: { out: true, in: false }, mark: ['field', 'barRight'] },
      tabNext: { cols: [top([...head, trip('0/1'), card('Зарядка для ноутбука', 1), field('', 1)])], bar: { out: true, in: true }, mark: ['field'] },
      tabOut: { cols: [top([...head, trip('0/3'), card('Зарядка для ноутбука', 1), card('Паспорт', 1), card('Наушники', 1), field('')])], bar: { out: false, in: true, place: 'now' }, mark: ['field'] },
      fabRest: { cols: [top(base)], mark: ['fab'] },
      fabCarry: { cols: [top([base[0], base[1], gap(), ...base.slice(2)])], float: { at: 'gap' }, mark: ['gap'] },
      fabCarrySub: { cols: [top([base[0], base[1], base[2], gap(1), ...base.slice(3)])], float: { at: 'gap' }, mark: ['gap'] },
      fabInto: { cols: [top(momTarget)], float: { at: 'target', dx: 30 }, mark: ['target'] },
      fabDrop: { cols: [top([base[0], base[1], base[2], field('', 1), ...base.slice(3)])], bar: { out: true, in: false }, mark: ['field'] },
      fabCal: { cols: [top(base)], newSlot: true, float: { at: 'slot' }, mark: ['slot'] },
      fabCalField: { cols: [top(base)], newSlot: true, scroll: 3.25, calField: true, bar: { indents: false }, mark: ['calField'] },
      modeCal: { cols: [top(base)], mark: ['fab'] },
      modeSoon: { mode: 'soon', mark: ['fab', 'newTasks'] },
      modeInbox: { mode: 'inbox', mark: ['fab', 'newTasks'] },
      v1Now: { mode: 'soon', cols: [right([...base, field(bank)])], bar: { out: false, in: true, place: 'now', style: 'segment' }, mark: ['field', 'barRight'] },
      v1Inbox: { mode: 'inbox', cols: [top([...inbox, field(bank)])], bar: { out: false, in: true, place: 'inbox', style: 'segment' }, mark: ['field', 'barRight'] },
      v1Date: { mode: 'soon', dayTitle: 'Thu, 5 Nov', cols: [right([...nov5, field(bank)])], bar: { out: false, in: true, place: 'date', dateText: '5 Nov', style: 'segment' }, mark: ['field', 'dayHead', 'barRight'] },
      v2Bar: { mode: 'soon', cols: [right([...base, field(bank)])], bar: { out: false, in: true, place: 'now' }, mark: ['field', 'barRight'] },
      v2Priority: { mode: 'soon', cols: [right([...base, field(bank, 0, { tint: c.p1Card })])], bar: { out: false, in: true, place: 'now', priority: 'p1' }, priorityPanel: true, mark: ['field', 'panelPriority'] },
      v2PriorityLong: { mode: 'soon', levels: 'long', cols: [right([...base, field(bank, 0, { tint: '#573E19' })])], bar: { out: false, in: true, place: 'now', priority: 'Важно' }, priorityPanel: true, mark: ['panelPriority'] },
      v2Panel: { mode: 'soon', cols: [right([...base, field(bank)])], bar: { out: false, in: true, place: 'now' }, placePanel: true, mark: ['panelPlace'] },
      v2Inbox: { mode: 'inbox', cols: [top([...inbox, field(bank)])], bar: { out: false, in: true, place: 'inbox' }, mark: ['field', 'barRight'] },
      v2DatePanel: { mode: 'soon', cols: [right([...base, field(bank)])], bar: { out: false, in: true, place: 'now' }, datePanel: true, mark: ['panelDate'] },
      v2Date: { mode: 'soon', dayTitle: 'Thu, 5 Nov', cols: [right([...nov5, field(bank)])], bar: { out: false, in: true, place: 'date', dateText: '5 Nov' }, mark: ['field', 'dayHead', 'barRight'] },
      renameBlock: { cols: [top(base)], scroll: 1.5, blk: 'rename', bar: { indents: false }, mark: ['blkRename'] },
      stackSub: { cols: [top(base)], scroll: 1.5, blk: 'stack', bar: { indents: false }, mark: ['blkStack'] },
      rename: { cols: [top([...base.slice(0, 4), field('Разобрать почту', 0, { selected: true }), base[5]])], bar: { out: false, in: true, place: 'now' }, mark: ['field'] }
    };
    const cfg = V[view] ?? V.typing;
    const mode = cfg.mode ?? 'calendar';
    const kbdOn = !!cfg.bar;
    const dragOn = !!cfg.float;
    const geo = { left: { x0: 0, pad: 10 }, right: { x0: 203, pad: 2 } };

    const marks = [];
    const box = (left, top, width, height, radius) => ({ left: left - 4, top: top - 4, width: width + 8, height: height + 8, radius: radius ?? Math.min(height + 8, 44) / 2 });
    const want = cfg.mark ?? [];
    let gapAt = null;
    let targetAt = null;

    const cols = (cfg.cols ?? []).map((col) => {
      const g = geo[col.side];
      const bottom = kbdOn ? BAR_TOP : mode === 'calendar' ? CAL_BOTTOM : NEW_TASK_TOP;
      const height = bottom - TOP;
      const rows = col.rows.map((r, i) => {
        const level = r.level ?? 0;
        return {
          ...r,
          isCard: r.kind === 'card',
          isField: r.kind === 'field',
          isGap: r.kind === 'gap',
          left: g.pad + level * INDENT,
          width: W - level * INDENT,
          top: i * STEP,
          progress: !!r.progress,
          hasCount: !!r.count,
          count: r.count ?? '',
          bg: r.target ? c.target : r.tint ?? c.card,
          ring: r.target ? 'inset 0 0 0 1.5px ' + c.accent : 'none',
          typed: r.kind === 'field' && !!r.text && !r.selected,
          empty: r.kind === 'field' && !r.text,
          selected: !!r.selected,
          text: r.text ?? ''
        };
      });
      const fieldRow = rows.find((r) => r.isField);
      const shift = kbdOn && fieldRow ? Math.max(0, fieldRow.top + CARD - (height - 16)) : 0;
      rows.forEach((r) => { r.top -= shift; });

      const branches = [];
      rows.forEach((r, i) => {
        if (r.isGap) return;
        const kids = [];
        for (let j = i + 1; j < rows.length && rows[j].level > r.level; j++) {
          if (rows[j].level === r.level + 1) kids.push(j);
        }
        if (!kids.length) return;
        const x = r.left + INDENT / 2;
        const mid = (j) => rows[j].top + CARD / 2;
        const last = mid(kids[kids.length - 1]);
        branches.push(`M${x} ${mid(i)}V${last - 6}Q${x} ${last} ${x + 6} ${last}H${x + INDENT / 2}`);
        kids.slice(0, -1).forEach((k) => branches.push(`M${x} ${mid(k)}H${x + INDENT / 2}`));
      });

      rows.forEach((r) => {
        const x = g.x0 + r.left, y = TOP + r.top;
        if (r.isGap) gapAt = { x, y };
        if (r.target) targetAt = { x, y };
        if ((want.includes('field') && r.isField) || (want.includes('gap') && r.isGap) || (want.includes('target') && r.target)) marks.push(box(x, y, r.width, CARD));
      });
      if (want.includes('fresh')) {
        const fresh = rows.filter((r) => r.fresh);
        if (fresh.length) marks.push(box(g.x0 + g.pad, TOP + fresh[0].top, W, fresh[fresh.length - 1].top - fresh[0].top + CARD));
      }
      return { x0: g.x0, height, rows, branches: branches.join('') || 'M0 0' };
    });

    const scroll = cfg.scroll ?? 0;
    const calTop = SLOT_TOP - scroll * 56;
    const float = { on: dragOn, left: 0, top: 0 };
    if (cfg.float && cfg.float.at === 'gap' && gapAt) Object.assign(float, { left: gapAt.x + 4, top: gapAt.y + 6 });
    if (cfg.float && cfg.float.at === 'target' && targetAt) Object.assign(float, { left: targetAt.x + cfg.float.dx, top: targetAt.y + 14 });
    if (cfg.float && cfg.float.at === 'slot') Object.assign(float, { left: 186, top: SLOT_TOP + 12 });

    const b = cfg.bar ?? {};
    const LEVELS = {
      short: light
        ? [{ name: 'p1', c: '#FF3B30', tint: '#F4D5D7' }, { name: 'p2', c: '#FF9500', tint: '#F4E3CF' }, { name: 'p3', c: '#FFCC00', tint: '#F4ECCF' }]
        : [{ name: 'p1', c: '#FF453A', tint: '#572725' }, { name: 'p2', c: '#FF9F0A', tint: '#573E19' }, { name: 'p3', c: '#FFD60A', tint: '#574C19' }],
      long: [{ name: 'Супер срочно', c: '#FF453A', tint: '#572725' }, { name: 'Важно', c: '#FF9F0A', tint: '#573E19' }, { name: 'На этой неделе', c: '#FFD60A', tint: '#574C19' }, { name: 'Когда-нибудь, если будет время', c: '#40C8E0', tint: '#254950' }]
    };
    const levelSet = LEVELS[cfg.levels ?? 'short'];
    const pr = b.priority ? levelSet.find((l) => l.name === b.priority) : null;
    const FADE = 'linear-gradient(to right, #000 calc(100% - 20px), transparent calc(100% - 8px))';
    const levelTiles = levelSet.map((l) => {
      const on = !!pr && pr.name === l.name;
      const fits = l.name.length <= 10;
      return { ...l, on, aria: on ? 'Remove priority ' + l.name : 'Priority ' + l.name, bg: on ? l.tint : c.menuTile, ring: on ? 'inset 0 0 0 1.5px ' + l.c : 'none', align: fits ? 'center' : 'left', mask: fits ? 'none' : FADE };
    });
    const rowCount = Math.ceil(levelTiles.length / 3);
    const perRow = Math.ceil(levelTiles.length / rowCount);
    const ppRows = [];
    for (let i = 0; i < levelTiles.length; i += perRow) ppRows.push({ tiles: levelTiles.slice(i, i + perRow) });
    const ppH = 16 + ppRows.length * 66 + (ppRows.length - 1) * 6;
    const pp = { rows: ppRows, top: BAR_TOP - 8 - ppH, height: ppH };
    const placeKeys = ['inbox', 'soon', 'now', 'date'];
    const placeLabels = { inbox: 'Inbox', soon: 'Soon', now: 'Now', date: b.dateText ?? 'Date' };
    const segmentOn = kbdOn && !!b.place && b.style === 'segment';
    const places = placeKeys.map((k) => {
      const on = b.place === k;
      const withText = on && k === 'date' && !!b.dateText;
      return { label: placeLabels[k], path: PATHS[k], width: withText ? 84 : 38, bg: on ? c.onBg : 'transparent', ink: on ? c.onInk : c.placeInk, hasText: withText, text: b.dateText ?? '' };
    });
    const priorityW = 44;
    const placeW = segmentOn ? 4 + places.reduce((s, p) => s + p.width, 0) + 2 : kbdOn && b.place ? 102 : 0;
    const bar = {
      indents: b.indents !== false,
      outInk: b.out ? c.text : c.off,
      inInk: b.in ? c.text : c.off,
      flagInk: pr ? pr.c : c.text,
      flagFill: pr ? pr.c : 'none',
      segment: segmentOn,
      places,
      placeButton: kbdOn && b.style !== 'segment' && !!b.place,
      placePath: PATHS[b.place ?? 'now'],
      placeLabel: placeLabels[b.place ?? 'now']
    };
    const rightW = priorityW + 4 + placeW;
    if (want.includes('barRight')) marks.push(box(390 - 6 - rightW, BAR_TOP + 4, rightW, 36, 12));
    if (want.includes('in')) marks.push(box(54, BAR_TOP + 4, 44, 36, 12));
    if (want.includes('fab')) marks.push(box(330, 722, 44, 44));
    if (want.includes('slot')) marks.push(box(232, SLOT_TOP, 153, CARD));
    if (want.includes('calField')) marks.push(box(232, calTop, 153, CARD));
    if (want.includes('blkRename')) marks.push(box(231, 229, 155, 54, 22));
    if (want.includes('blkStack')) marks.push(box(231, 396, 155, CARD));
    if (want.includes('newTasks')) { marks.push(box(10, 677, 175, CARD)); marks.push(box(205, 677, 175, CARD)); }
    if (want.includes('dayHead')) marks.push(box(205, 118, 180, 36, 12));
    if (want.includes('panelDate')) marks.push(box(82, 207, 300, 294, 18));
    if (want.includes('panelPriority')) marks.push(box(82, pp.top, 300, pp.height, 18));
    if (want.includes('panelPlace')) marks.push(box(82, 419, 300, 82, 18));

    const tiles = placeKeys.map((k) => ({ label: k === 'date' ? 'Date' : placeLabels[k], path: PATHS[k], bg: b.place === k ? c.placeOnBg : c.menuTile, ring: b.place === k ? c.placeRing : 'none' }));

    const days = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(2026, 9, 26 + i);
      const inMonth = d.getMonth() === 10;
      const isToday = d.getMonth() === 9 && d.getDate() === 30;
      const isSelected = inMonth && d.getDate() === 5;
      days.push({ n: d.getDate(), bg: isSelected ? c.accent : 'transparent', color: isSelected ? '#FFFFFF' : isToday ? c.accent : inMonth ? c.text : c.outside, weight: isSelected || isToday ? 700 : 400 });
    }

    const key = (label, extra) => ({ label, flex: '1', bg: c.key, color: c.keyInk, size: 22, ...extra });
    const fn = (label, flex) => key(label, { flex, bg: c.fnKey, size: 15 });
    const kbd = kbdOn
      ? { on: true, rows: [
          { keys: ['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х'].map((k) => key(k)) },
          { keys: ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э'].map((k) => key(k)) },
          { keys: [fn('⇧', '1.4'), ...['я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю'].map((k) => key(k)), fn('⌫', '1.4')] },
          { keys: [fn('123', '1.3'), key('пробел', { flex: '6', size: 16 }), fn('Далее', '2.2')] }
        ] }
      : { on: false, rows: [] };

    return {
      c,
      theme: light ? 'light' : 'dark',
      mode,
      newSlot: cfg.newSlot ? 'true' : 'false',
      scroll: String(scroll),
      dayTitle: cfg.dayTitle ?? 'Today',
      hideNewTask: mode === 'calendar',
      cols,
      calField: { on: !!cfg.calField, top: calTop },
      blk: { rename: cfg.blk === 'rename', backdrop: cfg.blk === 'stack', subs: [{ title: 'Собрать цифры за квартал' }, { title: 'Написать выводы' }, { title: 'Отправить Косте' }] },
      fab: { rest: !kbdOn && !dragOn },
      float,
      bar,
      kbd,
      datePanel: !!cfg.datePanel,
      dateTop: 207,
      priorityPanel: !!cfg.priorityPanel,
      placePanel: !!cfg.placePanel,
      pp,
      tiles,
      weekdays: ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'],
      days,
      marks: this.props.marks === false ? [] : marks
    };
  }
}
</script>
</body>
</html>
