<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вариант 2 — Окно у пункта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 2188px; height: 2204px; background: #F5F5F2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;">
<div style="position: absolute; left: 64px; top: 36px; font-size: 64px; line-height: 76px; font-weight: 700; color: #1C1C1E;">Вариант 2 — Окно у пункта</div>
<div style="position: absolute; left: 64px; top: 124px; width: 2060px; font-size: 20px; line-height: 26px; color: #6B6A65;">Меню остаётся под окном, нажатый пункт подсвечен. Маленькое окно у пункта: вопрос, название задачи и две кнопки. Пунктиром обведено новое</div>
<sc-for list="{{frames}}" as="p" hint-placeholder-count="5">
<div style="position: absolute; left: {{p.left}}px; top: {{p.top}}px; width: {{p.w}}px; height: {{p.h}}px; overflow: hidden; border-radius: {{p.r}}px; box-shadow: 0 0 0 1px #D6D2C4, 0 18px 40px rgba(0,0,0,0.18);"><dc-import name="ConfirmKit" platform="{{p.p}}" variant="popover" action="{{p.a}}" theme="{{p.t}}" hint-size="{{p.w}}px,{{p.h}}px"></dc-import></div>
<div style="position: absolute; left: {{p.left}}px; top: {{p.capTop}}px; width: {{p.capW}}px; display: flex; flex-direction: column; gap: 4px;">
<span style="font-size: 18px; line-height: 23px; font-weight: 600; color: #1C1C1E;">{{p.name}}</span>
<span style="font-size: 16px; line-height: 21px; color: #3A3A3C;">{{p.cap}}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2188,"height":2204}}'>
class Component extends DCLogic {
  renderVals() {
    return { frames: [{"p": "phone", "a": "delete", "t": "dark", "left": 64, "top": 200, "name": "Delete, тёмная", "cap": "Окно встаёт над строкой Delete, строка подсвечена. Кнопка Delete красная", "w": 390, "h": 844, "r": 34, "capTop": 1060, "capW": 390}, {"p": "phone", "a": "wontdo", "t": "dark", "left": 494, "top": 200, "name": "Won’t do, тёмная", "cap": "Окно под плиткой Won’t do, плитка подсвечена. Кнопка Won’t do нейтральная", "w": 390, "h": 844, "r": 34, "capTop": 1060, "capW": 390}, {"p": "desk", "a": "delete", "t": "dark", "left": 924, "top": 200, "name": "Mac: Delete, тёмная", "cap": "То же окно у пункта меню. Esc и клик мимо закрывают только окно, меню остаётся", "w": 1200, "h": 800, "r": 10, "capTop": 1016, "capW": 760}, {"p": "phone", "a": "delete", "t": "light", "left": 64, "top": 1210, "name": "Delete, светлая", "cap": "То же в светлой теме", "w": 390, "h": 844, "r": 34, "capTop": 2070, "capW": 390}, {"p": "desk", "a": "wontdo", "t": "light", "left": 924, "top": 1210, "name": "Mac: Won’t do, светлая", "cap": "Нейтральная кнопка подтверждения в светлой теме", "w": 1200, "h": 800, "r": 10, "capTop": 2026, "capW": 760}] };
  }
}
</script>
</body>
</html>
